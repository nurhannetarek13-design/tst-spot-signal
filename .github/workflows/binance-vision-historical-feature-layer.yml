name: Binance Vision Historical Feature Layer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/binance_vision_historical_feature_layer.py"
      - ".github/workflows/binance-vision-historical-feature-layer.yml"

permissions:
  contents: read

concurrency:
  group: binance-vision-historical-feature-layer
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: pip install numpy pandas pyarrow
      - name: Syntax check
        run: python -m py_compile research/binance_vision_historical_feature_layer.py
      - name: Build two-day BTC historical sample with futures metrics
        run: |
          python research/binance_vision_historical_feature_layer.py \
            --symbol BTCUSDT --start 2025-01-02 --end 2025-01-03 --freq 5min \
            --output-dir artifacts/binance-vision-historical-features
      - name: Validate semantics and complete datasets
        run: |
          python - <<'PY'
          import glob,json,pandas as pd
          js=glob.glob('artifacts/binance-vision-historical-features/*.json'); pq=glob.glob('artifacts/binance-vision-historical-features/*.parquet')
          assert len(js)==1 and len(pq)==1
          m=json.load(open(js[0])); d=pd.read_parquet(pq[0])
          assert m['authorization']=='RESEARCH_ONLY' and m['liveTrading'] is False and m['checksumVerification'] is True
          assert m['rows']==len(d) and len(d)>0 and m['failures']==[],m['failures']
          for src in ['aggTrades','markPriceKlines','indexPriceKlines','premiumIndexKlines','metrics']: assert m['rawRows'][src]>0,(src,m['rawRows'])
          required={'ts','symbol','trade_close','buy_quote','sell_quote','delta_quote','cvd_quote','flow_imbalance_quote','mark_close','index_close','premium_close','mark_index_basis_bps','fut_sum_open_interest','fut_sum_open_interest_value','fut_count_toptrader_long_short_ratio','fut_sum_toptrader_long_short_ratio','fut_count_long_short_ratio','fut_sum_taker_long_short_vol_ratio','fut_oi_change_1bar','fut_oi_value_change_1bar'}
          assert required.issubset(d.columns),sorted(required-set(d.columns))
          for c,n in m['metricsCoverage'].items(): assert n>0,(c,n)
          assert 'microprice' not in d.columns and 'orderBookImbalance' not in d.columns
          print(json.dumps({'rows':len(d),'rawRows':m['rawRows'],'metricsCoverage':m['metricsCoverage'],'basisNonNull':int(d.mark_index_basis_bps.notna().sum())},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binance-vision-historical-feature-layer-sample
          path: artifacts/binance-vision-historical-features
          retention-days: 14
