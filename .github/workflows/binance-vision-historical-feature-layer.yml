name: Binance Vision Historical Feature Layer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/binance_vision_historical_feature_layer.py"
      - ".github/workflows/binance-vision-historical-feature-layer.yml"

permissions:
  contents: read

concurrency:
  group: binance-vision-historical-feature-layer
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: pip install numpy pandas pyarrow
      - name: Syntax check
        run: python -m py_compile research/binance_vision_historical_feature_layer.py
      - name: Build two-day BTC historical flow sample
        run: |
          python research/binance_vision_historical_feature_layer.py \
            --symbol BTCUSDT \
            --start 2025-01-02 \
            --end 2025-01-03 \
            --freq 5min \
            --output-dir artifacts/binance-vision-historical-features
      - name: Validate semantics and output
        run: |
          python - <<'PY'
          import glob, json
          import pandas as pd
          js=glob.glob('artifacts/binance-vision-historical-features/*.json')
          pq=glob.glob('artifacts/binance-vision-historical-features/*.parquet')
          assert len(js)==1 and len(pq)==1
          m=json.load(open(js[0]))
          d=pd.read_parquet(pq[0])
          assert m['authorization']=='RESEARCH_ONLY'
          assert m['liveTrading'] is False
          assert m['checksumVerification'] is True
          assert m['rows'] == len(d) and len(d) > 0
          required={'ts','symbol','trade_close','buy_quote','sell_quote','delta_quote','cvd_quote','buy_share_quote','flow_imbalance_quote'}
          assert required.issubset(d.columns), sorted(required-set(d.columns))
          assert 'microprice' not in d.columns
          assert 'orderBookImbalance' not in d.columns
          assert m['featureSemantics']['microprice'].startswith('NOT AVAILABLE')
          print(json.dumps({'rows':len(d),'columns':list(d.columns),'failures':m['failures'][:8]},indent=2,default=str))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binance-vision-historical-feature-layer-sample
          path: artifacts/binance-vision-historical-features
          retention-days: 14
