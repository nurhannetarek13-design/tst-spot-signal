name: Binance Vision Recent Archived-Only Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/binance_vision_recent_delisted_audit.py"
      - ".github/workflows/binance-vision-recent-delisted-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile research/binance_vision_recent_delisted_audit.py research/binance_vision_archive_universe.py
      - name: Audit recent archived-only symbols
        run: PYTHONPATH=. python research/binance_vision_recent_delisted_audit.py
      - name: Assert research-only output
        run: |
          python - <<'PY'
          import json
          p='validation/edges/binance-vision-recent-archived-only.json'
          x=json.load(open(p))
          assert x['authorization']=='RESEARCH_ONLY'
          assert x['liveTrading'] is False
          assert x['counts']['archivedOnlyAllHistory'] > 0
          print('recent archived-only audit assertions passed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: binance-vision-recent-archived-only
          path: validation/edges/binance-vision-recent-archived-only.json
          retention-days: 14
