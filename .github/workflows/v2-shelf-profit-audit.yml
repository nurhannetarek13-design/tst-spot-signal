name: V2 Existing Shelf - 381 Day Historical Audit (REAL ORDERS ZERO)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v2-shelf-profit-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shelf_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      V2_MODE: shadow
      V2_LIVE_TRADING: 'false'
      V2_PRIVATE_ADAPTER_ENABLED: 'false'
      V2_LIVE_AUTHORIZED: 'false'
      V2_LIVE_ENGINE_UNLOCK: 'false'
      V2_EMERGENCY_FLATTEN_VERIFIED: 'false'
    steps:
      - name: Checkout immutable audited source without credentials
        uses: actions/checkout@v4
        with:
          ref: 329149d587fe8315fc6813ccf4f3257d792e6aa0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject live settings and execute CI regression tests
        run: |
          python - <<'PY'
          import os
          assert os.getenv('V2_MODE') == 'shadow'
          assert all(os.getenv(k)=='false' for k in (
            'V2_LIVE_TRADING','V2_PRIVATE_ADAPTER_ENABLED',
            'V2_LIVE_AUTHORIZED','V2_LIVE_ENGINE_UNLOCK',
            'V2_EMERGENCY_FLATTEN_VERIFIED'))
          assert not any(os.getenv(k) for k in (
            'BINANCE_API_KEY','BINANCE_API_SECRET',
            'V2_BINANCE_API_KEY','V2_BINANCE_API_SECRET'))
          PY
          pip install -r v2_bot/requirements.txt
          python -m compileall -q v2_bot
          python -m unittest v2_bot.tests.test_shelf_profit_audit v2_bot.tests.test_shelf_risk_cap v2_bot.tests.test_shelf_live_gate v2_bot.tests.test_crash_reversal_retest v2_bot.tests.test_fvg_ab_paper -v
      - name: Verify 381 days of public Binance Spot candles and run exact frozen strategies
        run: |
          set -o pipefail
          python -m v2_bot.shelf_profit_audit --output shelf_profit_audit.json | tee shelf_stdout.log
      - name: Audit all three holdout regimes, reject claims of live readiness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('shelf_profit_audit.json').read_text())
          assert r['status']=='DIAGNOSTIC_ONLY_NOT_PROVEN_NOT_LIVE_READY'
          assert r['real_orders']==0 and r['live_trading'] is False
          assert r['any_strategy_qualified_for_live'] is False
          assert len(r['results'])==27 and len(r['data_sha256'])==3
          assert len({(x['period'],x['symbol'],x['mode']) for x in r['results']})==27
          assert all(len(d)==64 for d in r['data_sha256'].values())
          assert r['independent_50_usdt_scenarios_not_additive']
          assert Path('shelf_profit_audit.md').is_file()
          print('SHELF_AUDIT_ALL_27_SCENARIOS_VERIFIED_NO_REAL_ORDERS')
          PY
          cat shelf_profit_audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Archive detailed audit for human review
        uses: actions/upload-artifact@v4
        with:
          name: 381-day-frozen-v2-shelf-net-profit-diagnostics
          path: |
            shelf_profit_audit.json
            shelf_profit_audit.md
            shelf_stdout.log
          retention-days: 30
