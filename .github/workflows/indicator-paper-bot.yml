name: Indicator-Only Paper Bot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ready_bot/indicator_bot.py'
      - 'ready_bot/indicator_config.json'
      - 'tests/test_indicator_bot.py'
      - '.github/workflows/indicator-paper-bot.yml'
  schedule:
    - cron: '2-59/5 * * * *'

permissions:
  contents: write

concurrency:
  group: indicator-only-paper-bot
  cancel-in-progress: true

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and test indicator runtime
        run: |
          python -m py_compile ready_bot/indicator_bot.py
          python -m py_compile ready_bot/early_momentum.py
          python -m py_compile ready_bot/market_context.py
          python -m unittest discover -s tests -p 'test_indicator_bot.py' -v
          python -m unittest discover -s tests -p 'test_early_momentum.py' -v
          python -m unittest discover -s tests -p 'test_ready_market_context.py' -v

      - name: Run indicator-only PAPER engine at ~1-minute cadence
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'indicator-paper-bot'
          git config user.email 'indicator-paper-bot@users.noreply.github.com'

          critical_hash() {
            python - <<'PY'
          import hashlib, json
          s=json.load(open('ready_bot/indicator_state.json'))
          critical={
              'day':s.get('day'),
              'cash_usdt':s.get('cash_usdt'),
              'day_pnl':s.get('day_pnl'),
              'positions':s.get('positions',{}),
              'closed_trades':s.get('closed_trades',[]),
              'seen':s.get('seen',{}),
          }
          raw=json.dumps(critical,sort_keys=True,separators=(',',':')).encode()
          print(hashlib.sha256(raw).hexdigest())
          PY
          }

          persist_state() {
            label="$1"
            cp ready_bot/indicator_state.json /tmp/indicator-state.json
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git reset --hard origin/main
              cp /tmp/indicator-state.json ready_bot/indicator_state.json
              git add ready_bot/indicator_state.json
              if git diff --cached --quiet; then
                return 0
              fi
              git commit -m "$label"
              if git push origin HEAD:main; then
                return 0
              fi
              sleep $((attempt*2))
            done
            return 1
          }

          cycles=1
          if [ "${{ github.event_name }}" = "schedule" ]; then
            cycles=5
          fi

          for i in $(seq 1 "$cycles"); do
            echo "=== scan $i/$cycles $(date -u +%FT%TZ) ==="
            before="$(critical_hash)"
            python ready_bot/indicator_bot.py
            after="$(critical_hash)"

            # Entries, exits, PnL and de-dup state are safety-critical.
            # Persist them immediately so an overlapping/cancelled Actions run
            # cannot erase a completed paper decision.
            if [ "$before" != "$after" ]; then
              persist_state "Persist critical paper state scan $i"
            fi

            if [ "$i" -lt "$cycles" ]; then
              now=$(date +%s)
              next=$(( (now / 60 + 1) * 60 ))
              sleep_for=$(( next - now ))
              if [ "$sleep_for" -gt 0 ]; then
                sleep "$sleep_for"
              fi
            fi
          done

      - name: Assert paper-only state and risk policy
        run: |
          python - <<'PY'
          import json
          c=json.load(open('ready_bot/indicator_config.json'))
          s=json.load(open('ready_bot/indicator_state.json'))
          assert c['mode']=='paper'
          assert c['market_type']=='spot'
          assert c['engine']=='INDICATOR_ONLY_V3_EARLY_MOMENTUM'
          assert c['entry']['score_required']==5
          assert c['entry']['score_total']==6
          assert c['entry']['adx_min']==20
          assert c['entry']['min_relative_quote_volume']==1.3
          assert c['entry']['min_taker_buy_ratio']==0.55
          assert c['momentum']['watch_min']==65
          assert c['momentum']['armed_min']==75
          assert c['momentum']['entry_candidate_min']==85
          assert c['momentum']['obi_armed_min']==0.58
          assert 'strategies' not in c
          assert s['mode']=='PAPER_ONLY'
          assert c['risk']['max_daily_loss_usdt']==2.0
          assert c['risk']['max_open_positions']==3
          assert c['risk']['max_quote_per_trade_usdt']<=10.0
          assert c['risk']['max_risk_per_trade_fraction']<=0.005
          assert c['risk']['allow_averaging_down'] is False
          assert c['risk']['allow_martingale'] is False
          assert c['risk']['leverage']==1
          assert c['risk']['max_pair_correlation']==0.85
          assert c['risk']['consecutive_loss_cooldown_count']==3
          assert c['data_integrity']['fail_closed'] is True
          print(json.dumps({
            'engine':c['engine'],
            'cash':s['cash_usdt'],
            'day_pnl':s['day_pnl'],
            'positions':list(s['positions']),
            'signals':s.get('signals',[]),
            'btc_regime':s.get('btc_regime')
          },indent=2))
          PY

      - name: Persist indicator paper state
        run: |
          cp ready_bot/indicator_state.json /tmp/indicator-state.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/indicator-state.json ready_bot/indicator_state.json
            git config user.name 'indicator-paper-bot'
            git config user.email 'indicator-paper-bot@users.noreply.github.com'
            git add ready_bot/indicator_state.json
            git diff --cached --quiet && exit 0
            git commit -m 'Update indicator-only paper state'
            git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
