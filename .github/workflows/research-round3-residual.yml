name: Round 3 residual dispersion
on:
  push:
    paths:
      - 'scripts/research-round3-residual.mjs'
      - '.github/workflows/research-round3-residual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check scripts/research-round3-residual.mjs
      - run: node scripts/research-round3-residual.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: round3-residual-discovery
          path: validation/round3-residual-discovery.json
          if-no-files-found: error
