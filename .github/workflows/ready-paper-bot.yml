name: Ready Multi-Strategy Paper Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ready_bot/native_paper.py'
      - 'ready_bot/arbitration.py'
      - 'ready_bot/native_js_bridge.mjs'
      - 'ready_bot/multi_bot.py'
      - 'ready_bot/multi_config.json'
      - 'ready_bot/paper_audit.py'
      - 'ready_bot/paper_observer.py'
      - 'tests/test_multi_bot.py'
      - 'tests/test_multi_bot_contract.py'
      - 'tests/test_native_paper.py'
      - 'tests/test_native_js_real.py'
      - 'tests/test_paper_arbitration.py'
      - 'tests/test_paper_audit.py'
      - '.github/workflows/ready-paper-bot.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  run-paper-bot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: ready-paper-bot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and test full source bridge and audit
        run: |
          python -m py_compile ready_bot/multi_bot.py ready_bot/native_paper.py ready_bot/arbitration.py ready_bot/paper_audit.py ready_bot/paper_observer.py
          node --check ready_bot/native_js_bridge.mjs
          python -m unittest discover -s tests -p 'test_multi_bot*.py' -v
          python -m unittest discover -s tests -p 'test_native_paper.py' -v
          python -m unittest discover -s tests -p 'test_native_js_real.py' -v
          python -m unittest discover -s tests -p 'test_paper_arbitration.py' -v
          python -m unittest discover -s tests -p 'test_paper_audit.py' -v
      - name: Run audited multi-strategy PAPER engine
        run: python ready_bot/paper_observer.py
      - name: Persist paper-only state and per-strategy report
        run: |
          if git diff --quiet -- ready_bot/multi_state.json; then
            echo 'No state change'
            exit 0
          fi
          cp ready_bot/multi_state.json /tmp/ready-multi-state.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/ready-multi-state.json ready_bot/multi_state.json
          git config user.name 'ready-paper-bot'
          git config user.email 'ready-paper-bot@users.noreply.github.com'
          git add ready_bot/multi_state.json
          git commit -m 'Update audited multi-strategy paper state' || exit 0
          git push origin HEAD:main
