name: Ready Paper Bot

on:
  workflow_dispatch:
  push:
    paths:
      - 'ready_bot/bot.py'
      - 'ready_bot/config.json'
      - 'ready_bot/OPEN_SOURCE_NOTICES.md'
      - '.github/workflows/ready-paper-bot.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  run-paper-bot:
    runs-on: ubuntu-latest
    concurrency:
      group: ready-paper-bot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile ready_bot/bot.py
      - name: Run paper bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ready_bot/bot.py
      - name: Persist paper state
        run: |
          if git diff --quiet -- ready_bot/state.json; then
            echo "No state change"
            exit 0
          fi
          cp ready_bot/state.json /tmp/ready-bot-state.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/ready-bot-state.json ready_bot/state.json
          git config user.name "ready-paper-bot"
          git config user.email "ready-paper-bot@users.noreply.github.com"
          git add ready_bot/state.json
          git commit -m "Update ready paper bot state" || exit 0
          git push origin HEAD:main
