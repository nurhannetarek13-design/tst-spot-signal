name: Ready Multi-Strategy Paper Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ready_bot/multi_bot.py'
      - 'ready_bot/multi_config.json'
      - 'tests/test_multi_bot.py'
      - 'tests/test_multi_bot_contract.py'
      - '.github/workflows/ready-paper-bot.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  run-paper-bot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: ready-paper-bot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test
        run: |
          python -m py_compile ready_bot/multi_bot.py
          python -m unittest discover -s tests -p 'test_multi_bot*.py' -v
      - name: Run multi-strategy paper bot
        run: python ready_bot/multi_bot.py
      - name: Persist multi-strategy paper state
        run: |
          if git diff --quiet -- ready_bot/multi_state.json; then
            echo 'No state change'
            exit 0
          fi
          cp ready_bot/multi_state.json /tmp/ready-multi-state.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/ready-multi-state.json ready_bot/multi_state.json
          git config user.name 'ready-paper-bot'
          git config user.email 'ready-paper-bot@users.noreply.github.com'
          git add ready_bot/multi_state.json
          git commit -m 'Update multi-strategy paper bot state' || exit 0
          git push origin HEAD:main
