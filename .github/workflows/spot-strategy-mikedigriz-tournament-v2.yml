name: MikeDiGriz Spot Strategy Tournament V2

on:
  workflow_dispatch:
  push:
    branches: [research/nfi-ready-strategy-v1]
    paths: ['.github/workflows/spot-strategy-mikedigriz-tournament-v2.yml']

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Fetch candidates
        run: |
          set -euo pipefail
          mkdir -p external user_data/strategies validation/mikedigriz-tournament-v2
          git clone --depth 1 https://github.com/mikedigriz/freqtrade-strategy-mikedigriz.git external/mike
          git -C external/mike rev-parse HEAD | tee validation/mikedigriz-tournament-v2/upstream-sha.txt
          cp external/mike/strategies/BuyOrDie.py user_data/strategies/
          cp external/mike/strategies/CCI_BB.py user_data/strategies/
          cp external/mike/strategies/EasyInEasyOut.py user_data/strategies/
          cp external/mike/strategies/FisherHull.py user_data/strategies/
          cp external/mike/strategies/RSI_BB.py user_data/strategies/
      - name: Prepare research config
        run: |
          docker pull freqtradeorg/freqtrade:stable
          python - <<'PY'
          import json,pathlib
          pairs=['BTC/USDT','ETH/USDT','SOL/USDT','BNB/USDT','XRP/USDT','ADA/USDT','DOGE/USDT','LINK/USDT','AVAX/USDT','DOT/USDT','UNI/USDT','LDO/USDT','NEAR/USDT','AAVE/USDT','LTC/USDT','ATOM/USDT','TRX/USDT','SUI/USDT','BCH/USDT','ETC/USDT']
          cfg={'stake_currency':'USDT','stake_amount':10,'max_open_trades':3,'dry_run_wallet':50,'tradable_balance_ratio':0.90,'fiat_display_currency':'USD','dry_run':True,'trading_mode':'spot','margin_mode':'','process_only_new_candles':True,'stoploss':-0.03,'trailing_stop':False,'position_adjustment_enable':False,'exchange':{'name':'binance','key':'','secret':'','ccxt_config':{'enableRateLimit':True,'urls':{'api':{'public':'https://data-api.binance.vision/api/v3'}},'options':{'defaultType':'spot','fetchMarkets':['spot']}},'pair_whitelist':pairs,'pair_blacklist':['.*(UP|DOWN|BULL|BEAR)/USDT']},'pairlists':[{'method':'StaticPairList'}],'entry_pricing':{'price_side':'other','use_order_book':False,'price_last_balance':0.0},'exit_pricing':{'price_side':'other','use_order_book':False},'order_types':{'entry':'market','exit':'market','emergency_exit':'market','force_entry':'market','force_exit':'market','stoploss':'market','stoploss_on_exchange':False},'unfilledtimeout':{'entry':5,'exit':5,'exit_timeout_count':0,'unit':'minutes'},'telegram':{'enabled':False,'token':'','chat_id':''},'api_server':{'enabled':False,'listen_ip_address':'127.0.0.1','listen_port':8080,'username':'research','password':'research-only','jwt_secret_key':'researchOnlyJwtSecretKey1234567890123456'},'internals':{'process_throttle_secs':5}}
          pathlib.Path('user_data/config.json').write_text(json.dumps(cfg,indent=2))
          PY
      - name: Inventory-load candidates
        run: |
          set +e
          docker run --rm -v "$PWD/user_data:/freqtrade/user_data" freqtradeorg/freqtrade:stable list-strategies --config /freqtrade/user_data/config.json 2>&1 | tee validation/mikedigriz-tournament-v2/load.log
          exit 0
      - name: Download historical data
        run: |
          docker run --rm -v "$PWD/user_data:/freqtrade/user_data" freqtradeorg/freqtrade:stable download-data --config /freqtrade/user_data/config.json --timeframes 5m 15m 30m 1h --timerange 20250101-20260910
      - name: Backtest candidates
        run: |
          set -euo pipefail
          OUT=validation/mikedigriz-tournament-v2
          for s in BuyOrDie CCI_BB EasyInEasyOut FisherHull RSI_BB; do
            for spec in '2025:20250101-20251231:0.002' '2026:20260101-20260910:0.002' 'stress:20260101-20260910:0.005'; do
              IFS=: read tag timerange fee <<< "$spec"
              set +e
              docker run --rm -v "$PWD/user_data:/freqtrade/user_data" freqtradeorg/freqtrade:stable backtesting --config /freqtrade/user_data/config.json --strategy "$s" --timerange "$timerange" --fee "$fee" > "$OUT/${s}_${tag}.log" 2>&1
              echo "$?" > "$OUT/${s}_${tag}.exit"
              set -e
            done
          done
      - name: Rank and verdict
        run: |
          python - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('validation/mikedigriz-tournament-v2'); ss=['BuyOrDie','CCI_BB','EasyInEasyOut','FisherHull','RSI_BB']
          def one(s,t):
            z=(root/f'{s}_{t}.log').read_text(errors='ignore') if (root/f'{s}_{t}.log').exists() else ''; code=int((root/f'{s}_{t}.exit').read_text()) if (root/f'{s}_{t}.exit').exists() else 999
            def g(p,c=float):
              m=re.search(p,z,re.I)
              if not m:return None
              try:return c(m.group(1).replace(',',''))
              except:return None
            tr=g(r'Total/Daily Avg Trades\s*│\s*(\d+)',int) or g(r'│\s*TOTAL\s*│\s*(\d+)',int)
            return {'exitCode':code,'trades':tr,'pf':g(r'Profit factor\s*│\s*([-+0-9.]+)'),'profitPct':g(r'Total profit %\s*│\s*([-+0-9.]+)'),'profitUSDT':g(r'Absolute profit\s*│\s*([-+0-9.]+)'),'ddPct':g(r'Max % of account underwater \(balance\)\s*│\s*([-+0-9.]+)'),'worstDay':g(r'Worst day\s*│\s*([-+0-9.]+)\s+USDT'),'worstTrade':g(r'Worst trade\s*│\s*[^\n│]*?([-+]\d+(?:\.\d+)?)%')}
          rows={s:{t:one(s,t) for t in ['2025','2026','stress']} for s in ss}; rank=[]
          for s,r in rows.items():
            reasons=[]
            for t,x in r.items():
              if x['exitCode']!=0: reasons.append(t+':INFRA'); continue
              if (x['trades'] or 0)<20: reasons.append(t+':LT20')
              if (x['profitUSDT'] or 0)<=0: reasons.append(t+':NONPOSITIVE')
              if (x['pf'] or 0)<(1.05 if t=='stress' else 1.15): reasons.append(t+':PF')
              if x['ddPct'] is None or x['ddPct']>15: reasons.append(t+':DD')
              if x['worstDay'] is None or x['worstDay']<-2: reasons.append(t+':WORSTDAY')
              if x['worstTrade'] is None or x['worstTrade']<-4.5: reasons.append(t+':HARDSTOP')
            rank.append({'strategy':s,'passFinancial':not reasons,'reasons':reasons,'stressPF':r['stress']['pf'],'stressProfitPct':r['stress']['profitPct']})
          rank.sort(key=lambda x:((x['passFinancial']),x['stressPF'] or -99,x['stressProfitPct'] or -999),reverse=True)
          out={'rows':rows,'ranking':rank,'winners':[x['strategy'] for x in rank if x['passFinancial']]}; (root/'verdict.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - name: Lookahead financial winners
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/winners
          import json
          for s in json.load(open('validation/mikedigriz-tournament-v2/verdict.json'))['winners']: print(s)
          PY
          while read s; do
            [ -z "$s" ] && continue
            set +e
            docker run --rm -v "$PWD/user_data:/freqtrade/user_data" freqtradeorg/freqtrade:stable lookahead-analysis --config /freqtrade/user_data/config.json --strategy "$s" --timerange 20260101-20260910 --minimum-trade-amount 20 --targeted-trade-amount 50 > "validation/mikedigriz-tournament-v2/${s}_lookahead.log" 2>&1
            echo "$?" > "validation/mikedigriz-tournament-v2/${s}_lookahead.exit"
            set -e
          done < /tmp/winners
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mikedigriz-spot-strategy-tournament-v2
          path: validation/mikedigriz-tournament-v2/**
