name: Derivatives Pressure Forward Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths:
      - "research/derivatives_pressure.py"
      - ".github/workflows/derivatives-pressure.yml"

permissions:
  contents: write

concurrency:
  group: derivatives-pressure
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run derivatives pressure monitor
        run: python research/derivatives_pressure.py

      - name: Require usable derivatives data
        run: |
          python - <<'PY'
          import json, pathlib
          row=json.loads(pathlib.Path("validation/edges/derivatives-pressure-latest.json").read_text())
          print(json.dumps(row,indent=2))
          if row.get("liveTrading") is not False:
              raise SystemExit("Derivatives monitor must remain read-only")
          if int(row.get("usableCount") or 0) < 1:
              raise SystemExit("No usable derivatives data")
          PY

      - name: Commit derivatives snapshot
        run: |
          cp validation/edges/derivatives-pressure-latest.json /tmp/derivatives-pressure-latest.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p validation/edges
            cp /tmp/derivatives-pressure-latest.json validation/edges/derivatives-pressure-latest.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add validation/edges/derivatives-pressure-latest.json
            git diff --cached --quiet && exit 0
            git commit -m "Update derivatives pressure snapshot [skip ci]"
            git push origin HEAD:main && exit 0
            sleep $((i * 2))
          done
          exit 1
