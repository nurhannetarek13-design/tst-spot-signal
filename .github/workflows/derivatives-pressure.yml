name: Derivatives Pressure Forward Monitor

on:
  workflow_dispatch:
  # GitHub-hosted runners currently receive Binance Futures HTTP 451.
  # Keep manual-only until this monitor is moved to a non-blocked runtime.
  push:
    branches: [main]
    paths:
      - "research/derivatives_pressure.py"
      - ".github/workflows/derivatives-pressure.yml"

permissions:
  contents: write

concurrency:
  group: derivatives-pressure
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run derivatives pressure monitor
        run: python research/derivatives_pressure.py
      - name: Commit forward snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/edges/derivatives-pressure-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Update derivatives runtime diagnostic"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 2))
          done
          exit 1
