name: Kaggle L2 Probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/kaggle_l2_probe.py'
      - '.github/workflows/kaggle-l2-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/kaggle_l2_probe.py
