name: Fusion Freqtrade Validator

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths:
      - "freqtrade/**"
      - "scripts/fusion-freqtrade-report.py"
      - ".github/workflows/fusion-freqtrade-validator.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Pull official Freqtrade image
        run: docker pull freqtradeorg/freqtrade:stable

      - name: Download 120 days of Binance Spot 15m data
        run: |
          docker run --rm             -v "$PWD/freqtrade/user_data:/freqtrade/user_data"             freqtradeorg/freqtrade:stable             download-data             --exchange binance             --days 120             --timeframes 15m             --pairs BTC/USDT ETH/USDT BNB/USDT SOL/USDT XRP/USDT ADA/USDT DOGE/USDT LINK/USDT AVAX/USDT DOT/USDT

      - name: Prepare writable result folders
        run: |
          mkdir -p "/tmp/ft-base-$GITHUB_RUN_ID" "/tmp/ft-stress-$GITHUB_RUN_ID"
          chmod 777 "/tmp/ft-base-$GITHUB_RUN_ID" "/tmp/ft-stress-$GITHUB_RUN_ID"

      - name: Base-cost backtest
        run: |
          docker run --rm             -v "$PWD/freqtrade/user_data:/freqtrade/user_data:ro"             -v "/tmp/ft-base-$GITHUB_RUN_ID:/results"             freqtradeorg/freqtrade:stable             backtesting             --config /freqtrade/user_data/config.json             --strategy AdaptiveRegimeStrategy             --strategy-path /freqtrade/user_data/strategies             --timeframe 15m             --fee 0.001             --cache none             --export trades             --backtest-directory /results
          cp "$(ls -1t /tmp/ft-base-$GITHUB_RUN_ID/*.zip | head -1)" /tmp/freqtrade-base.zip

      - name: Double-cost stress backtest
        run: |
          docker run --rm             -v "$PWD/freqtrade/user_data:/freqtrade/user_data:ro"             -v "/tmp/ft-stress-$GITHUB_RUN_ID:/results"             freqtradeorg/freqtrade:stable             backtesting             --config /freqtrade/user_data/config.json             --strategy AdaptiveRegimeStrategy             --strategy-path /freqtrade/user_data/strategies             --timeframe 15m             --fee 0.002             --cache none             --export trades             --backtest-directory /results
          cp "$(ls -1t /tmp/ft-stress-$GITHUB_RUN_ID/*.zip | head -1)" /tmp/freqtrade-stress.zip

      - name: Build validator report
        run: python scripts/fusion-freqtrade-report.py /tmp/freqtrade-base.zip /tmp/freqtrade-stress.zip validation/fusion/freqtrade-latest.json

      - name: Commit latest public validator snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp validation/fusion/freqtrade-latest.json /tmp/freqtrade-latest.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p validation/fusion
          cp /tmp/freqtrade-latest.json validation/fusion/freqtrade-latest.json
          git add validation/fusion/freqtrade-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Freqtrade fusion validator snapshot"
          git push
