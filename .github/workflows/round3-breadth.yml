name: Round 3 Breadth Discovery
on:
  push:
    paths:
      - 'scripts/round3_breadth.py'
      - '.github/workflows/round3-breadth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas
      - run: python -m py_compile scripts/round3_breadth.py
      - run: python scripts/round3_breadth.py
      - uses: actions/upload-artifact@v4
        with:
          name: round3-breadth
          path: validation/round3-breadth.json
          if-no-files-found: error
