name: Gate G L2 OOS V1
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gate-g-l2-oos-v1.yml'
permissions: {contents: read}
jobs:
  sample:
    strategy:
      fail-fast: false
      matrix:
        symbol: [SOLUSDT, ETHUSDT]
        date: [2025-02-15, 2025-03-15]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - name: Run frozen L2 sampler on OOS date
        run: |
          mkdir -p gate-g-oos
          python research/gate_g_l2_microstructure_v1.py \
            --symbol ${{ matrix.symbol }} \
            --date ${{ matrix.date }} \
            --out gate-g-oos/${{ matrix.symbol }}-${{ matrix.date }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: gate-g-oos-${{ matrix.symbol }}-${{ matrix.date }}
          path: gate-g-oos/${{ matrix.symbol }}-${{ matrix.date }}.json
  aggregate:
    needs: sample
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gate-g-oos-*
          path: gate-g-oos
          merge-multiple: true
      - name: Evaluate frozen temporal OOS gate
        run: |
          python - <<'PY'
          import glob,json,collections
          xs=[json.load(open(p)) for p in glob.glob('gate-g-oos/*.json')]
          assert len(xs)==4, len(xs)
          rows=[]
          by=collections.defaultdict(list)
          for x in xs:
            assert x['authorization']=='RESEARCH_ONLY' and x['liveTrading'] is False and x['thresholdsFrozen'] is True
            assert x['eventDefinition']=={'obi10AbsMin':0.60,'micropriceDirectionalBpsMin':0.08,'sampleSeconds':1,'eventCooldownSeconds':60}
            passed=False; best=[]
            for side in ('long','short'):
              for h in ('10','30','60'):
                s=x['outcomes'][side][h]
                ok=s['n']>=20 and s['hitRate'] is not None and s['hitRate']>=0.54 and s['meanDirectionalBps'] is not None and s['meanDirectionalBps']>0
                if ok: best.append({'side':side,'horizonSec':int(h),**s})
                passed=passed or ok
            r={'symbol':x['symbol'],'date':x['date'],'pass':passed,'sampleCount':x['sampleCount'],'qualifying':best}
            rows.append(r);by[x['symbol']].append(passed)
          symbol_stability={s:(len(v)==2 and all(v)) for s,v in by.items()}
          final=len(symbol_stability)==2 and all(symbol_stability.values())
          out={'engine':'GATE_G_L2_TEMPORAL_OOS_V1','authorization':'RESEARCH_ONLY','liveTrading':False,'thresholdsFrozen':True,'oosDates':['2025-02-15','2025-03-15'],'informationGate':{'nMin':20,'hitRateMin':0.54,'meanDirectionalBpsPositive':True,'requiredDatesPerSymbol':2,'requiredSymbols':2},'rows':rows,'symbolStability':symbol_stability,'pass':final,'next':'PROMOTE_G_TO_ENTRY_FILTER_VALIDATION' if final else 'REJECT_OR_REDEFINE_GATE_G','note':'No thresholds were changed after the discovery-day test.'}
          open('gate-g-oos-result.json','w').write(json.dumps(out,indent=2))
          print(json.dumps({'pass':final,'next':out['next'],'symbolStability':symbol_stability,'rows':[{'symbol':r['symbol'],'date':r['date'],'pass':r['pass']} for r in rows]}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gate-g-l2-oos-result-v1
          path: gate-g-oos-result.json
