name: Derivatives Pressure Historical Backtest

on:
  workflow_dispatch:
  push:
    branches: [fix/unified-execution-parity]
    paths:
      - "research/backtest_derivatives_pressure.py"
      - ".github/workflows/derivatives-pressure-backtest.yml"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run historical derivatives pressure backtest
        run: python research/backtest_derivatives_pressure.py
      - name: Enforce research-only contract
        run: |
          python - <<'PY'
          import json, pathlib
          r=json.loads(pathlib.Path('validation/edges/derivatives-pressure-backtest.json').read_text())
          print(json.dumps(r,indent=2))
          if r.get('liveTrading') is not False:
              raise SystemExit('liveTrading must remain false')
          if r.get('authorization') != 'RESEARCH_ONLY':
              raise SystemExit('authorization must remain RESEARCH_ONLY')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: derivatives-pressure-backtest
          path: validation/edges/derivatives-pressure-backtest.json
          if-no-files-found: error
