name: Research Round22 Dual Horizon
on:
  workflow_dispatch:
  push:
    paths:
      - 'validation/evidence-gate-round22.json'
      - 'scripts/research-round22.mjs'
      - '.github/workflows/research-round22.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/research-round22.mjs
      - run: node scripts/research-round22.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: research-round22
          path: validation/round22.json
