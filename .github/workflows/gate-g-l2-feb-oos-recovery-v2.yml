name: Gate G L2 February OOS Recovery V2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gate-g-l2-feb-oos-recovery-v2.yml'
permissions: {contents: read}
jobs:
  sample:
    strategy:
      fail-fast: false
      matrix:
        symbol: [SOLUSDT, ETHUSDT]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy
      - name: Run frozen February OOS sampler
        run: |
          mkdir -p gate-g-feb
          python research/gate_g_l2_microstructure_v1.py \
            --symbol ${{ matrix.symbol }} \
            --date 2025-02-15 \
            --out gate-g-feb/${{ matrix.symbol }}-2025-02-15.json
      - uses: actions/upload-artifact@v4
        with:
          name: gate-g-feb-${{ matrix.symbol }}
          path: gate-g-feb/*.json
