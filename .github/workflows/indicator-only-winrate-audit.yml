name: Indicator-Only Win-Rate Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/indicator_only_winrate_audit.py'
      - 'ready_bot/indicator_config.json'
      - '.github/workflows/indicator-only-winrate-audit.yml'

permissions:
  contents: write

concurrency:
  group: indicator-only-winrate-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy pandas
      - run: python -m py_compile research/indicator_only_winrate_audit.py
      - run: PYTHONPATH=. python research/indicator_only_winrate_audit.py
      - name: Verify audit contract
        run: |
          python - <<'PY'
          import json
          x=json.load(open('validation/indicator-only-winrate-audit-latest.json'))
          assert x['authorization']=='AUDIT_ONLY'
          assert x['liveTrading'] is False
          assert x['runtimeEngine']=='INDICATOR_ONLY_V1'
          print(json.dumps({
            'pessimistic':x['pessimistic'],
            'optimisticUpperBound':x['optimisticUpperBound'],
            'unresolvedWithin7d':x['unresolvedWithin7d'],
            'claimSupported':x['claimSupported'],
            'symbolsAudited':len(x['symbolsAudited'])
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: indicator-only-winrate-audit
          path: validation/indicator-only-winrate-audit-latest.json
          retention-days: 14
      - name: Persist audit snapshot
        run: |
          cp validation/indicator-only-winrate-audit-latest.json /tmp/audit.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/audit.json validation/indicator-only-winrate-audit-latest.json
            git config user.name 'indicator-audit-bot'
            git config user.email 'indicator-audit-bot@users.noreply.github.com'
            git add validation/indicator-only-winrate-audit-latest.json
            git diff --cached --quiet && exit 0
            git commit -m 'Update indicator-only win-rate audit'
            git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
