name: Deploy Cloudflare Live Runtime
# Railway-free production deploy
# production diagnostic deploy trigger: 2026-09-23

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/edge-worker.js"
      - "src/buy-gateway-stable.js"
      - "api/binance-signed-relay.mjs"
      - "api/binance-account-passthrough.mjs"
      - "api/binance-crosspair-preflight.mjs"
      - "src/buy-gateway-time-monitor.js"
      - "src/buy-gateway-auth-wrapper.js"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install

      - name: Validate Railway-free active runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check src/edge-worker.js
          node --check src/buy-gateway-stable.js
          node --check src/buy-gateway-time-monitor.js
          node --check src/buy-gateway-auth-wrapper.js
          node --check api/binance-signed-relay.mjs
          node --check api/binance-account-passthrough.mjs
          node --check api/binance-crosspair-preflight.mjs
          grep -q '"main": "src/buy-gateway-auth-wrapper.js"' wrangler.jsonc
          grep -q 'from "./buy-gateway-stable.js"' src/buy-gateway-time-monitor.js
          grep -q 'CLOUDFLARE_SIGNED_VERCEL_TRANSPORT' src/buy-gateway-stable.js
          grep -q 'async function executionPriceGate' src/buy-gateway-stable.js
          grep -q 'STALE_PRICE_CHASE' src/buy-gateway-stable.js
          grep -q 'EXECUTION_SPREAD_TOO_WIDE' src/buy-gateway-stable.js
          grep -q 'PROTECTION_LEVEL_CALC_FAILED' src/buy-gateway-stable.js
          grep -q 'sendPromptForActive' src/buy-gateway-stable.js
          grep -q 'await scan(env,false)' src/edge-worker.js
          grep -q 'x-fast-ecdsa' src/buy-gateway-auth-wrapper.js
          grep -q 'VERCEL_BINANCE_CREDENTIALS_MISSING' api/binance-signed-relay.mjs
          grep -q 'HMAC_SHA256' api/binance-signed-relay.mjs
          grep -q 'RSA_SHA256' api/binance-signed-relay.mjs
          grep -q 'ED25519' api/binance-signed-relay.mjs
          grep -q 'MAX_BUY_QUOTE_USDT = 10' api/binance-signed-relay.mjs
          grep -q 'OPERATION_NOT_ALLOWED' api/binance-signed-relay.mjs
          grep -q 'WRITE_TRANSPORT_STATUS_UNKNOWN' api/binance-signed-relay.mjs
          grep -q 'PROTECTION_FAILED_EMERGENCY_CLOSED' src/buy-gateway-stable.js
          grep -q 'EXPECTED_TELEGRAM_WEBHOOK_URL' src/buy-gateway-stable.js
          grep -q 'TELEGRAM_WEBHOOK_OK' src/buy-gateway-stable.js
          if grep -Eq 'withdraw|fapi|leverage|margin' api/binance-signed-relay.mjs; then
            echo "Forbidden non-Spot capability found in Vercel relay"
            exit 1
          fi
          if grep -q 'buy-gateway-canonical.js' src/buy-gateway-time-monitor.js; then
            echo "Active time monitor still routes through Railway-era canonical gateway"
            exit 1
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify live Cloudflare/Vercel runtime
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 15); do
            curl --silent --show-error --max-time 20 -H 'cache-control: no-store'               "https://tst-spot-signal.nurhanne-tarek13.workers.dev/runtime-check?deploy=${GITHUB_SHA}&attempt=${attempt}&nonce=$(date +%s%N)"               -o /tmp/runtime.json || true
            cat /tmp/runtime.json 2>/dev/null || true
            echo
            if python - <<'PY'
          import json,sys
          try: r=json.load(open('/tmp/runtime.json'))
          except Exception: sys.exit(1)
          checks=[
            r.get('ok') is True,
            r.get('credentialMode') == 'LIVE',
            r.get('executionRoute') == 'CLOUDFLARE_SIGNED_VERCEL_TRANSPORT',
            r.get('telegramConfigured') is True,
            r.get('atomicConfirmClaim') is True,
            r.get('fastSignalIngest') is True,
            r.get('oneTapConfirm') is True,
            r.get('autoBuy') is False,
            r.get('noSecretValuesExposed') is True,
          ]
          sys.exit(0 if all(checks) else 1)
          PY
            then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1

      - name: Report Cloudflare direct Binance signer (read-only)
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 25             -H 'cache-control: no-store'             "https://tst-spot-signal.nurhanne-tarek13.workers.dev/direct-account-preflight?nonce=$(date +%s%N)"             -o /tmp/direct.json || true
          cat /tmp/direct.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/direct.json'))
          assert r.get('executionRoute') == 'CLOUDFLARE_DIRECT_READONLY_DIAGNOSTIC'
          assert r.get('tradingAction') == 'NONE'
          assert r.get('noBalanceValuesExposed') is True
          assert r.get('noSecretValuesExposed') is True
          print({
            'ok': r.get('ok'),
            'canTrade': r.get('canTrade'),
            'signerMode': r.get('signerMode'),
            'diagnosticCode': r.get('diagnosticCode'),
          })
          PY

      - name: Verify Cloudflare signature via Vercel read-only passthrough
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 20); do
            curl --silent --show-error --max-time 25               -H 'cache-control: no-store'               "https://tst-spot-signal.nurhanne-tarek13.workers.dev/signed-vercel-account-preflight?attempt=${attempt}&nonce=$(date +%s%N)"               -o /tmp/passthrough.json || true
            cat /tmp/passthrough.json 2>/dev/null || true
            echo
            if python - <<'PY'
          import json,sys
          try: r=json.load(open('/tmp/passthrough.json'))
          except Exception: sys.exit(1)
          required=[
            r.get('executionRoute') == 'CLOUDFLARE_SIGNED_VERCEL_READONLY_DIAGNOSTIC',
            r.get('tradingAction') == 'NONE',
            r.get('noBalanceValuesExposed') is True,
            r.get('noSecretValuesExposed') is True,
          ]
          if not all(required): sys.exit(1)
          print({
            'ok':r.get('ok'),
            'canTrade':r.get('canTrade'),
            'signerMode':r.get('signerMode'),
            'diagnosticCode':r.get('diagnosticCode'),
            'safeHttpStatus':r.get('safeHttpStatus'),
            'safeBinanceCode':r.get('safeBinanceCode'),
          })
          sys.exit(0)
          PY
            then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1

      - name: Report Binance cross-pair read-only diagnostic
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 30             -H 'cache-control: no-store'             "https://tst-spot-signal.nurhanne-tarek13.workers.dev/crosspair-account-preflight?nonce=$(date +%s%N)"             -o /tmp/crosspair.json
          cat /tmp/crosspair.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/crosspair.json'))
          assert r.get('ok') is True
          assert r.get('executionRoute') == 'BINANCE_CROSSPAIR_READONLY_DIAGNOSTIC'
          assert r.get('tradingAction') == 'NONE'
          assert r.get('noBalanceValuesExposed') is True
          assert r.get('noSecretValuesExposed') is True
          print({
            'cloudflareKeyVercelSecret': r.get('cloudflareKeyVercelSecret'),
            'vercelKeyCloudflareSecret': r.get('vercelKeyCloudflareSecret'),
          })
          PY

      - name: Report live execution readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 25 \
            -H 'cache-control: no-store' \
            "https://tst-spot-signal.nurhanne-tarek13.workers.dev/live-readiness?nonce=$(date +%s%N)" \
            -o /tmp/readiness.json
          cat /tmp/readiness.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/readiness.json'))
          assert r.get('ok') is True
          assert r.get('infrastructureReady') is True
          assert r.get('railwayDependency') is False
          assert r.get('userConfirmationRequired') is True
          assert r.get('autoBuy') is False
          assert r.get('noBalanceValuesExposed') is True
          assert r.get('noSecretValuesExposed') is True
          if not r.get('executionReady'):
              print("LIVE EXECUTION BLOCKED:", r.get('blocker'))
          PY

      - name: Verify Telegram callback webhook
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 -X POST             -H 'cache-control: no-store'             "https://tst-spot-signal.nurhanne-tarek13.workers.dev/telegram-webhook-check?nonce=$(date +%s%N)"             -o /tmp/webhook.json
          cat /tmp/webhook.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/webhook.json'))
          assert r.get('ok') is True
          assert r.get('status') == 'TELEGRAM_WEBHOOK_OK'
          assert r.get('urlMatches') is True
          assert r.get('callbackQueryAllowed') is True
          PY

      - name: Verify scanner cannot auto-buy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 40             -H 'cache-control: no-store'             "https://tst-spot-signal.nurhanne-tarek13.workers.dev/scanner-status?nonce=$(date +%s%N)"             -o /tmp/scanner.json
          cat /tmp/scanner.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/scanner.json'))
          assert r.get('ok') is True
          assert r.get('liveTrading') is False
          assert r.get('executorAllowed') is False
          PY
