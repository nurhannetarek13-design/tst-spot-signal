name: Deploy Cloudflare Minute Scheduler

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/edge-worker.js"
      - "src/buy-gateway.js"
      - "src/index.js"
      - "wrangler.jsonc"
      - "scripts/patch-binance-secret-aliases.py"
      - "scripts/patch-relay-diagnostics.py"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Materialize actionable Telegram runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path("src/edge-worker.js")
          s = p.read_text(encoding="utf-8")

          start = s.find("async function sendPeriodicScanDigest(env){")
          if start != -1:
              end = s.find("async function scan(env,sendAlert){", start)
              if end == -1:
                  raise SystemExit("scan() marker missing; refusing unsafe digest removal")
              s = s[:start] + s[end:]

          s = s.replace("return json(await scan(env,true));", "return json(await scan(env,false));")
          s = s.replace("await monitorUnifiedDerivative(env); await monitorPaper(env); await scan(env,true);", "await monitorUnifiedDerivative(env); await monitorPaper(env); await scan(env,false);")

          if "sendPeriodicScanDigest" in s:
              raise SystemExit("legacy periodic digest still present")
          if "scan(env,true)" in s:
              raise SystemExit("direct scanner Telegram alert path still present")
          if "await monitorUnifiedDerivative(env); await monitorPaper(env); await scan(env,false);" not in s:
              raise SystemExit("scheduled no-alert scanner path missing")

          p.write_text(s, encoding="utf-8")
          PY
          python scripts/patch-binance-secret-aliases.py
          python scripts/patch-relay-diagnostics.py

      - name: Validate runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check src/edge-worker.js
          node --check src/buy-gateway.js
          grep -q 'LIQUIDITY_CRASH_EXHAUSTION' src/edge-worker.js
          grep -q 'STOP_HUNT_REVERSAL' src/edge-worker.js
          grep -q 'PREP:' src/buy-gateway.js
          grep -q 'CONFIRM:' src/buy-gateway.js
          grep -q 'claimState' src/buy-gateway.js
          grep -q 'VERCEL_SIGNED_RELAY_URL' src/buy-gateway.js
          grep -q 'CLOUDFLARE_SIGNED_VERCEL_TRANSPORT' src/buy-gateway.js
          grep -q 'sendPromptForActive' src/buy-gateway.js
          grep -q '/runtime-check' src/buy-gateway.js
          grep -q '/balance-refresh' src/buy-gateway.js
          grep -q 'relayBodyPreview' src/buy-gateway.js
          grep -Eq 'autoBuy[[:space:]]*:[[:space:]]*false' src/buy-gateway.js
          grep -q 'await scan(env,false)' src/edge-worker.js
          grep -q 'url.pathname==="/claim"' src/edge-worker.js
          if grep -q 'sendPeriodicScanDigest' src/edge-worker.js; then
            echo "Legacy periodic scan digest still exists"
            exit 1
          fi
          if grep -q 'scan(env,true)' src/edge-worker.js; then
            echo "Scanner can still send a direct Telegram message"
            exit 1
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Inspect Worker secret names
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler secret list

      - name: Configure Telegram webhook when Actions secret exists
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ]; then
            curl --fail --silent --show-error -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
              -H 'content-type: application/json' \
              --data '{"url":"https://tst-spot-signal.nurhanne-tarek13.workers.dev/telegram-webhook","allowed_updates":["callback_query"]}'
          fi

      - name: Verify runtime bindings and execution guards
        run: |
          curl --fail --silent --show-error --max-time 60 \
            "https://tst-spot-signal.nurhanne-tarek13.workers.dev/runtime-check" \
            -o /tmp/runtime.json
          python - <<'PY'
          import json
          row=json.load(open('/tmp/runtime.json'))
          print(json.dumps(row,indent=2))
          assert row.get('ok') is True
          assert row.get('telegramConfigured') is True
          assert row.get('hasApiKey') is True
          assert row.get('hasApiSecret') is True
          assert row.get('noSecretValuesExposed') is True
          assert row.get('executionRoute') == 'CLOUDFLARE_SIGNED_VERCEL_TRANSPORT'
          assert row.get('atomicConfirmClaim') is True
          assert row.get('autoBuy') is False
          PY

      - name: Verify Binance balance path through signed relay
        shell: bash
        run: |
          set -euo pipefail
          http_code="$(curl --silent --show-error --max-time 60 \
            -w '%{http_code}' \
            "https://tst-spot-signal.nurhanne-tarek13.workers.dev/balance-refresh" \
            -o /tmp/balance.json)"
          echo "balance-refresh HTTP ${http_code}"
          cat /tmp/balance.json
          echo
          python - <<'PY'
          import json
          row=json.load(open('/tmp/balance.json'))
          print(json.dumps(row,indent=2))
          assert row.get('ok') is True
          assert row.get('autoBuy') is False
          assert row.get('executionRoute') == 'CLOUDFLARE_SIGNED_VERCEL_TRANSPORT'
          bal=row.get('balance') or {}
          assert bal.get('ok') is True
          assert bal.get('status') == 'ACCOUNT_BALANCE_OK'
          assert bal.get('source') == 'CLOUDFLARE_SIGNED_VERCEL_TRANSPORT'
          assert isinstance((bal.get('usdt') or {}).get('free'), (int,float))
          PY

      - name: Verify scanner runtime
        run: |
          curl --fail --silent --show-error --max-time 60 \
            "https://tst-spot-signal.nurhanne-tarek13.workers.dev/scanner-status" \
            -o /tmp/status.json
          python - <<'PY'
          import json
          row=json.load(open('/tmp/status.json'))
          print(json.dumps(row,indent=2))
          assert row.get('ok') is True
          assert row.get('liveTrading') is False
          assert row.get('executorAllowed') is False
          PY
