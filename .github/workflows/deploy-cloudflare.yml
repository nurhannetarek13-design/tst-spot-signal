name: Deploy Cloudflare Live Runtime
# Railway-free production deploy
# production diagnostic deploy trigger: 2026-09-26 signer recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/edge-worker.js"
      - "src/buy-gateway-stable.js"
      - "api/binance-signed-relay.mjs"
      - "src/buy-gateway-time-monitor.js"
      - "src/buy-gateway-auth-wrapper.js"
      - "src/ops-supervisor.js"
      - "src/bridge-auth.js"
      - "src/live-cutover-policy.js"
      - "src/make-live-client.js"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install

      - name: Validate Railway-free active runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check src/edge-worker.js
          node --check src/buy-gateway-stable.js
          node --check src/buy-gateway-time-monitor.js
          node --check src/buy-gateway-auth-wrapper.js
          node --check src/ops-supervisor.js
          node --check src/ops-state-machine.js
          node --check src/bridge-auth.js
          node --check src/live-cutover-policy.js
          node --check src/make-live-client.js
          grep -q 'id: "BUY_V2"' src/make-live-client.js
          grep -q 'id: "OCO_V2"' src/make-live-client.js
          grep -q 'r9cqpv68bbj2zb01jitfmzk8iqb2zh16' src/make-live-client.js
          grep -q 'yn7vndobsf378u5hbec7jfnuam25ulcj' src/make-live-client.js
          if grep -Eq 'soxizns5lax7zpfm84ve0mzblbw2h63h|uwcpj6oq39e1ddsau2zk07g3q78vlovs' src/make-live-client.js; then
            echo "Legacy Make execution webhook still present in active execution client"
            exit 1
          fi
          node scripts/test-ops-recovery.mjs
          node scripts/test-live-cutover-policy.mjs
          node scripts/test-binance-spot-filters.mjs
          node scripts/test-live-accounting.mjs
          node scripts/test-make-v2-manual-route.mjs
          node --check api/binance-signed-relay.mjs
          grep -q '"main": "src/ops-supervisor.js"' wrangler.jsonc
          grep -q 'autonomousExecution: false' src/ops-supervisor.js
          grep -q 'deadManMonitoring: true' src/ops-supervisor.js
          grep -q 'recoveryStateMachine: true' src/ops-supervisor.js
          grep -q 'from "./buy-gateway-stable.js"' src/buy-gateway-time-monitor.js
          grep -q 'CLOUDFLARE_HMAC_MAKE' src/buy-gateway-stable.js
          grep -q 'LEGACY_VERCEL_SIGNER_REVOKED' api/binance-signed-relay.mjs
          grep -q 'oldVercelFallback: false' src/buy-gateway-stable.js
          grep -q 'liveExecutionEnabled: false' src/live-cutover-policy.js
          grep -q 'autonomousEnabled: false' src/live-cutover-policy.js
          grep -q 'maxOrderUSDT: 5.5' src/live-cutover-policy.js
          grep -q 'maxOpenPositions: 1' src/live-cutover-policy.js
          grep -q 'dailyLossCapUSDT: 0.5' src/live-cutover-policy.js
          grep -q '"LIVE_EXECUTION_ENABLED": "true"' wrangler.jsonc
          grep -q '"AUTONOMOUS_ENABLED": "false"' wrangler.jsonc
          grep -q '"E2E_ARMED": "true"' wrangler.jsonc
          node scripts/test-make-v2-manual-route.mjs
          grep -q 'PROTECTION_FAILED_EMERGENCY_CLOSED' src/buy-gateway-stable.js
          grep -q 'EXPECTED_TELEGRAM_WEBHOOK_URL' src/buy-gateway-stable.js
          grep -q 'TELEGRAM_WEBHOOK_OK' src/buy-gateway-stable.js
          if grep -Eq 'withdraw|fapi|leverage|margin' api/binance-signed-relay.mjs; then
            echo "Forbidden non-Spot capability found in Vercel relay"
            exit 1
          fi
          if grep -q 'buy-gateway-canonical.js' src/buy-gateway-time-monitor.js; then
            echo "Active time monitor still routes through Railway-era canonical gateway"
            exit 1
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify live Cloudflare/Vercel runtime
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 15); do
            curl --silent --show-error --max-time 20 -H 'cache-control: no-store'               "https://tst-spot-signal.nurhanne-tarek13.workers.dev/runtime-check?deploy=${GITHUB_SHA}&attempt=${attempt}&nonce=$(date +%s%N)"               -o /tmp/runtime.json || true
            cat /tmp/runtime.json 2>/dev/null || true
            echo
            if python - <<'PY'
          import json,sys
          try: r=json.load(open('/tmp/runtime.json'))
          except Exception: sys.exit(1)
          checks=[
            r.get('ok') is True,
            r.get('credentialMode') == 'LIVE',
            r.get('executionRoute') == 'CLOUDFLARE_HMAC_MAKE',
            r.get('executorConfigured') is True,
            r.get('binanceCredentialOwner') == 'MAKE_CONNECTION',
            r.get('cloudflareBinanceCredentialsRequired') is False,
            r.get('telegramConfigured') is True,
            r.get('atomicConfirmClaim') is True,
            r.get('fastSignalIngest') is True,
            r.get('oneTapConfirm') is True,
            r.get('autoBuy') is False,
            r.get('noSecretValuesExposed') is True,
          ]
          sys.exit(0 if all(checks) else 1)
          PY
            then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1

      - name: Report live execution readiness
        shell: bash
        run: |
          set -euo pipefail

          # Refresh signed Make V2 route health before evaluating readiness.
          curl --fail --silent --show-error --max-time 35 -X POST \
            -H 'content-type: application/json' \
            --data '{}' \
            "https://tst-spot-signal.nurhanne-tarek13.workers.dev/make-v2-dry-probe?phase=pre-readiness&nonce=$(date +%s%N)" \
            -o /tmp/pre-readiness-v2.json
          cat /tmp/pre-readiness-v2.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/pre-readiness-v2.json'))
          assert r.get('ok') is True
          assert r.get('financialAction') is False
          assert r.get('buyVerified') is True
          assert r.get('ocoVerified') is True
          assert r.get('healthRefreshed') is True
          PY

          # Honor the recovery state machine instead of assuming health is immediate after deploy.
          ok=0
          for attempt in $(seq 1 30); do
            curl --silent --show-error --max-time 25 \
              -H 'cache-control: no-store' \
              "https://tst-spot-signal.nurhanne-tarek13.workers.dev/live-readiness?attempt=$attempt&nonce=$(date +%s%N)" \
              -o /tmp/readiness.json || true
            cat /tmp/readiness.json 2>/dev/null || true
            echo
            if python - <<'PY'
          import json,sys
          try:
              r=json.load(open('/tmp/readiness.json'))
          except Exception:
              sys.exit(1)
          checks=[
              r.get('ok') is True,
              r.get('infrastructureReady') is True,
              r.get('railwayDependency') is False,
              r.get('userConfirmationRequired') is True,
              r.get('autoBuy') is False,
              r.get('autonomousExecution') is False,
              r.get('executionRoute') == 'CLOUDFLARE_HMAC_MAKE',
              r.get('oldVercelFallback') is False,
              r.get('status') == 'MANUAL_LIVE_E2E_ARMED',
              r.get('executionReady') is True,
              r.get('blocker') is None,
              r.get('executorConfigured') is True,
              r.get('liveExecutionEnabled') is True,
              r.get('e2eArmed') is True,
              r.get('manualOnly') is True,
              r.get('noBalanceValuesExposed') is True,
              r.get('noSecretValuesExposed') is True,
          ]
          sys.exit(0 if all(checks) else 1)
          PY
            then ok=1; break; fi
            sleep 10
          done
          test "$ok" = 1

      - name: Verify Telegram callback webhook
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 -X POST             -H 'cache-control: no-store'             "https://tst-spot-signal.nurhanne-tarek13.workers.dev/telegram-webhook-check?nonce=$(date +%s%N)"             -o /tmp/webhook.json
          cat /tmp/webhook.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/webhook.json'))
          assert r.get('ok') is True
          assert r.get('status') == 'TELEGRAM_WEBHOOK_OK'
          assert r.get('urlMatches') is True
          assert r.get('callbackQueryAllowed') is True
          PY

      - name: Verify 24/7 fail-closed supervisor
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            -H 'cache-control: no-store' \
            "https://tst-spot-signal.nurhanne-tarek13.workers.dev/ops-status?nonce=$(date +%s%N)" \
            -o /tmp/ops.json
          cat /tmp/ops.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/ops.json'))
          assert r.get('ok') is True
          assert r.get('persistentScheduler') is True
          assert r.get('deadManMonitoring') is True
          assert r.get('recoveryStateMachine') is True
          assert r.get('alertEscalation') is True
          assert r.get('liveTrading') is False
          assert r.get('autonomousExecution') is False
          assert r.get('noSecretValuesExposed') is True
          PY

      - name: Verify Make V2 production binding without financial action
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 35 -X POST \
            -H 'content-type: application/json' \
            --data '{}' \
            "https://tst-spot-signal.nurhanne-tarek13.workers.dev/make-v2-dry-probe?nonce=$(date +%s%N)" \
            -o /tmp/v2-probe.json
          cat /tmp/v2-probe.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/v2-probe.json'))
          assert r.get('ok') is True
          assert r.get('status') == 'MAKE_V2_DRY_PROBE_DISPATCHED'
          assert r.get('routeVersion') == 'v2'
          assert r.get('financialAction') is False
          assert r.get('liveExecutionEnabled') is True
          assert r.get('autonomousEnabled') is False
          assert r.get('buyVerified') is True
          assert r.get('ocoVerified') is True
          assert r.get('healthRefreshed') is True
          assert r.get('buy',{}).get('routeId') == 'BUY_V2'
          assert r.get('oco',{}).get('routeId') == 'OCO_V2'
          assert r.get('buy',{}).get('first',{}).get('transportOk') is True
          assert r.get('buy',{}).get('replay',{}).get('transportOk') is True
          assert r.get('oco',{}).get('first',{}).get('transportOk') is True
          assert r.get('oco',{}).get('replay',{}).get('transportOk') is True
          PY

          ok=0
          for attempt in $(seq 1 15); do
            curl --fail --silent --show-error --max-time 20 \
              -H 'cache-control: no-store' \
              "https://tst-spot-signal.nurhanne-tarek13.workers.dev/make-v2-route-status?attempt=$attempt&nonce=$(date +%s%N)" \
              -o /tmp/v2-routes.json
            cat /tmp/v2-routes.json
            echo
            if python - <<'PY'
          import json,sys,time
          r=json.load(open('/tmp/v2-routes.json'))
          now=int(time.time()*1000)
          buy=r.get('buy') or {}
          oco=r.get('oco') or {}
          checks=[
            r.get('ok') is True,
            r.get('routeVersion') == 'v2',
            r.get('buyRouteId') == 'BUY_V2',
            r.get('ocoRouteId') == 'OCO_V2',
            r.get('legacyRoutesConfigured') is False,
            buy.get('lastStatus') == 'REPLAY_BLOCKED',
            oco.get('lastStatus') == 'REPLAY_BLOCKED',
            int(buy.get('acceptedAt') or 0) > 0,
            int(oco.get('acceptedAt') or 0) > 0,
            int(buy.get('replayBlockedAt') or 0) > 0,
            int(oco.get('replayBlockedAt') or 0) > 0,
            now-int(buy.get('acceptedAt') or 0) < 300000,
            now-int(oco.get('acceptedAt') or 0) < 300000,
            now-int(buy.get('replayBlockedAt') or 0) < 300000,
            now-int(oco.get('replayBlockedAt') or 0) < 300000,
          ]
          sys.exit(0 if all(checks) else 1)
          PY
            then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1

      - name: Verify HMAC bridge auth and replay protection
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 -X POST             -H 'content-type: application/json'             --data '{"signal_id":"deploycheck","symbol":"BTCUSDT"}'             "https://tst-spot-signal.nurhanne-tarek13.workers.dev/bridge-auth-selftest?nonce=$(date +%s%N)"             -o /tmp/bridge.json
          cat /tmp/bridge.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/bridge.json'))
          assert r.get('ok') is True
          assert r.get('first') == 'BRIDGE_AUTH_OK'
          assert r.get('replay') == 'REPLAY_BLOCKED'
          assert r.get('oldVercelFallback') is False
          PY

      - name: Verify production Go No-Go stays fail-closed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 10); do
            rm -f /tmp/gate.json
            curl --silent --show-error --max-time 20 \
              "https://tst-spot-signal.nurhanne-tarek13.workers.dev/go-no-go?attempt=${attempt}&nonce=$(date +%s%N)" \
              -o /tmp/gate.json || true
            cat /tmp/gate.json 2>/dev/null || true
            echo
            if python - <<'PY'
          import json,sys
          try: r=json.load(open('/tmp/gate.json'))
          except Exception: sys.exit(1)
          checks=[
            r.get('ok') is True,
            r.get('go') is True,
            r.get('activationAllowed') is False,
            'LIVE_EXECUTION_ENABLED' not in r.get('activationFailed', []),
            'AUTONOMOUS_ENABLED' in r.get('activationFailed', []),
            r.get('e2eArmed') is True,
            r.get('manualE2EComplete') is False,
            r.get('manualExecutionAllowed') is True,
            r.get('bridgeFresh') is True,
            r.get('executorOwnershipOk') is True,
            r.get('executionRoute') == 'CLOUDFLARE_HMAC_MAKE',
            r.get('executorConfigured') is True,
            r.get('checks',{}).get('EXECUTION_ROUTE_HEALTHY') is True,
            r.get('checks',{}).get('NO_UNKNOWN_ORDERS') is True,
            r.get('checks',{}).get('NO_UNPROTECTED_POSITIONS') is True,
            r.get('checks',{}).get('DAILY_RISK_AVAILABLE') is True,
          ]
          sys.exit(0 if all(checks) else 1)
          PY
            then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1

      - name: Verify scanner cannot auto-buy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 10); do
            rm -f /tmp/scanner.json
            curl --silent --show-error --max-time 40 \
              -H 'cache-control: no-store' \
              "https://tst-spot-signal.nurhanne-tarek13.workers.dev/scanner-status?attempt=${attempt}&nonce=$(date +%s%N)" \
              -o /tmp/scanner.json || true
            cat /tmp/scanner.json 2>/dev/null || true
            echo
            if python - <<'PY'
          import json,sys
          try: r=json.load(open('/tmp/scanner.json'))
          except Exception: sys.exit(1)
          checks=[
            r.get('ok') is True,
            r.get('liveTrading') is False,
            r.get('executorAllowed') is False,
          ]
          sys.exit(0 if all(checks) else 1)
          PY
            then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1
