name: Deploy Cloudflare Minute Scheduler

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/edge-worker.js"
      - "src/buy-gateway.js"
      - "src/index.js"
      - "wrangler.jsonc"
      - "scripts/patch-cloudflare-digest.py"
      - "scripts/patch-binance-public-api.py"
      - "scripts/patch-product-mode.py"
      - "scripts/patch-confirm-page.py"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Materialize and validate Cloudflare runtime
        run: |
          python scripts/patch-cloudflare-digest.py
          python scripts/patch-binance-public-api.py
          python scripts/patch-product-mode.py
          python scripts/patch-confirm-page.py
          node --check src/edge-worker.js
          node --check src/buy-gateway.js
          grep -q 'https://api.binance.com' src/edge-worker.js
          grep -q 'LIQUIDITY_CRASH_EXHAUSTION' src/edge-worker.js
          grep -q 'STOP_HUNT_REVERSAL' src/edge-worker.js
          grep -q 'const reversalStrategy=' src/edge-worker.js
          grep -q 'USER_CONFIRMATION_ONLY' src/buy-gateway.js
          grep -q 'renderConfirmPage' src/buy-gateway.js
          grep -q 'handleConfirmBuy' src/buy-gateway.js
          grep -q 'await scan(env,false)' src/edge-worker.js
          if grep -q 'await sendPeriodicScanDigest(env)' src/edge-worker.js; then
            echo "Periodic scan digest still enabled"
            exit 1
          fi
          if grep -q 'if(regime.state==="RISK_OFF") return' src/edge-worker.js; then
            echo "Unsafe global RISK_OFF abort still present"
            exit 1
          fi

      - name: Sync Worker secrets from GitHub Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          sync_secret() {
            local name="$1"
            local value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
              echo "$name synced"
            else
              echo "$name missing in GitHub Secrets; leaving existing Worker secret unchanged"
            fi
          }
          sync_secret TELEGRAM_BOT_TOKEN
          sync_secret TELEGRAM_CHAT_ID
          sync_secret BINANCE_API_KEY
          sync_secret BINANCE_API_SECRET

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Configure Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ]; then
            curl --fail --silent --show-error \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
              -H 'content-type: application/json' \
              --data '{"url":"https://tst-spot-signal.nurhanne-tarek13.workers.dev/telegram-webhook","allowed_updates":["callback_query"]}'
          else
            echo "TELEGRAM_BOT_TOKEN missing in GitHub Secrets; webhook not changed"
          fi

      - name: Verify Telegram connection
        run: |
          curl --fail --silent --show-error --max-time 60 "https://tst-spot-signal.nurhanne-tarek13.workers.dev/?test=telegram" -o /tmp/telegram.json
          python - <<'PY'
          import json
          row=json.load(open('/tmp/telegram.json'))
          print(row)
          assert row.get('ok') is True
          assert row.get('liveTrading') is False
          PY

      - name: Verify BUY gateway mode
        run: |
          curl --fail --silent --show-error --max-time 60 "https://tst-spot-signal.nurhanne-tarek13.workers.dev/buy-gateway-status" -o /tmp/buy.json
          python - <<'PY'
          import json
          row=json.load(open('/tmp/buy.json'))
          print(json.dumps(row,indent=2))
          assert row.get('ok') is True
          assert row.get('mode') == 'USER_CONFIRMATION_ONLY'
          assert row.get('autoBuy') is False
          PY

      - name: Verify deployed scanner runtime
        run: |
          curl --fail --silent --show-error --max-time 60 "https://tst-spot-signal.nurhanne-tarek13.workers.dev/scanner-status" -o /tmp/status.json
          python - <<'PY'
          import json
          row=json.load(open('/tmp/status.json'))
          print(json.dumps(row,indent=2))
          assert row.get('ok') is True
          assert row.get('liveTrading') is False
          assert row.get('executorAllowed') is False
          strategies=set(row.get('strategies') or [])
          assert 'LIQUIDITY_CRASH_EXHAUSTION' in strategies
          assert 'STOP_HUNT_REVERSAL' in strategies
          PY

      - name: Verify scanner remains paper-only
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --max-time 60 "https://tst-spot-signal.nurhanne-tarek13.workers.dev/scan-preview" -o /tmp/scan.json
          python - <<'PY'
          import json
          row=json.load(open('/tmp/scan.json'))
          print(json.dumps(row,indent=2))
          assert row.get('liveTrading') is False
          PY
