name: Deploy Cloudflare Minute Scheduler

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/edge-worker.js"
      - "src/buy-gateway.js"
      - "src/index.js"
      - "wrangler.jsonc"
      - "scripts/disable-periodic-digest.py"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Materialize notification runtime
        run: python scripts/disable-periodic-digest.py

      - name: Validate runtime
        run: |
          node --check src/edge-worker.js
          node --check src/buy-gateway.js
          grep -q 'LIQUIDITY_CRASH_EXHAUSTION' src/edge-worker.js
          grep -q 'STOP_HUNT_REVERSAL' src/edge-worker.js
          grep -q 'PREP:' src/buy-gateway.js
          grep -q 'CONFIRM:' src/buy-gateway.js
          grep -q '/runtime-check' src/buy-gateway.js
          grep -q '/balance-refresh' src/buy-gateway.js
          grep -q 'autoBuy:false' src/buy-gateway.js
          grep -q 'await scan(env,false)' src/edge-worker.js
          if grep -q 'await monitorUnifiedDerivative(env); await monitorPaper(env); await sendPeriodicScanDigest(env); await scan(env,true);' src/edge-worker.js; then
            echo "Periodic scan digest still scheduled"
            exit 1
          fi

      - name: Sync Worker secrets from GitHub Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          sync_secret() {
            local name="$1"
            local value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
              echo "$name synced"
            else
              echo "$name missing in GitHub Secrets; existing Worker secret left unchanged"
            fi
          }
          sync_secret TELEGRAM_BOT_TOKEN
          sync_secret TELEGRAM_CHAT_ID
          sync_secret BINANCE_API_KEY
          sync_secret BINANCE_API_SECRET

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Inspect Worker secret names
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list

      - name: Configure Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ]; then
            curl --fail --silent --show-error -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
              -H 'content-type: application/json' \
              --data '{"url":"https://tst-spot-signal.nurhanne-tarek13.workers.dev/telegram-webhook","allowed_updates":["callback_query"]}'
          fi

      - name: Verify runtime bindings
        run: |
          curl --fail --silent --show-error --max-time 60 \
            "https://tst-spot-signal.nurhanne-tarek13.workers.dev/runtime-check" \
            -o /tmp/runtime.json
          python - <<'PY'
          import json
          row=json.load(open('/tmp/runtime.json'))
          print(json.dumps(row,indent=2))
          assert row.get('ok') is True
          assert row.get('telegramConfigured') is True
          assert row.get('noSecretValuesExposed') is True
          PY

      - name: Verify Binance balance path
        continue-on-error: true
        run: |
          curl --silent --show-error --max-time 60 \
            "https://tst-spot-signal.nurhanne-tarek13.workers.dev/balance-refresh" \
            -o /tmp/balance.json
          cat /tmp/balance.json

      - name: Verify scanner runtime
        run: |
          curl --fail --silent --show-error --max-time 60 \
            "https://tst-spot-signal.nurhanne-tarek13.workers.dev/scanner-status" \
            -o /tmp/status.json
          python - <<'PY'
          import json
          row=json.load(open('/tmp/status.json'))
          print(json.dumps(row,indent=2))
          assert row.get('ok') is True
          assert row.get('liveTrading') is False
          assert row.get('executorAllowed') is False
          PY

