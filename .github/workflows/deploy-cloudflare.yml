name: Deploy Cloudflare Live Runtime
# Railway-free production deploy
# production diagnostic deploy trigger: 2026-09-26 signer recovery
# production sync trigger: 2026-09-28 supabase-only market path
# production sync trigger: 2026-09-28 Supabase Vault signing cutover
# Supabase V2 is the only permitted production financial provider.
# Supabase Vault signer cutover trigger: 2026-09-28

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/edge-worker.js"
      - "src/buy-gateway-stable.js"
      - "api/binance-signed-relay.mjs"
      - "src/buy-gateway-time-monitor.js"
      - "src/buy-gateway-auth-wrapper.js"
      - "src/ops-supervisor.js"
      - "src/bridge-auth.js"
      - "src/live-cutover-policy.js"
      - "src/make-live-client.js"
      - "src/live-execution-router.js"
      - "src/supabase-live-client.js"
      - "src/binance-spot-filters.js"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install

      - name: Validate Railway-free active runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check src/edge-worker.js
          node --check src/buy-gateway-stable.js
          node --check src/buy-gateway-time-monitor.js
          node --check src/buy-gateway-auth-wrapper.js
          node --check src/ops-supervisor.js
          node --check src/ops-state-machine.js
          node --check src/bridge-auth.js
          node --check src/live-cutover-policy.js
          node --check src/make-live-client.js
          node --check src/live-execution-router.js
          node --check src/supabase-live-client.js
          grep -q 'id: "BUY_V2"' src/make-live-client.js
          grep -q 'id: "OCO_V2"' src/make-live-client.js
          grep -q 'r9cqpv68bbj2zb01jitfmzk8iqb2zh16' src/make-live-client.js
          grep -q 'yn7vndobsf378u5hbec7jfnuam25ulcj' src/make-live-client.js
          if grep -Eq 'soxizns5lax7zpfm84ve0mzblbw2h63h|uwcpj6oq39e1ddsau2zk07g3q78vlovs' src/make-live-client.js; then
            echo "Legacy Make execution webhook still present in active execution client"
            exit 1
          fi
          node scripts/test-ops-recovery.mjs
          node scripts/test-live-cutover-policy.mjs
          node scripts/test-binance-spot-filters.mjs
          node scripts/test-binance-ed25519-signing.mjs
          node scripts/test-supabase-relay-core.mjs
          node scripts/test-live-accounting.mjs
          node scripts/test-make-v2-manual-route.mjs
          node --check api/binance-signed-relay.mjs
          grep -q '"main": "src/ops-supervisor.js"' wrangler.jsonc
          grep -q 'autonomousExecution: false' src/ops-supervisor.js
          grep -q 'deadManMonitoring: true' src/ops-supervisor.js
          grep -q 'recoveryStateMachine: true' src/ops-supervisor.js
          grep -q 'from "./buy-gateway-stable.js"' src/buy-gateway-time-monitor.js
          grep -q 'executionRoute(env)' src/buy-gateway-stable.js
          grep -q 'executionProvider(env)' src/buy-gateway-stable.js
          grep -q 'SUPABASE_V2' src/live-execution-router.js
          grep -q 'ED25519_SUPABASE_VAULT' supabase/functions/tst-binance-relay/index.ts
          grep -q 'tst_binance_ed25519_sign' supabase/functions/tst-binance-relay/index.ts
          if grep -q 'postgres from "npm:postgres' supabase/functions/tst-binance-relay/index.ts; then
            echo "Supabase relay must not open direct Postgres connections"
            exit 1
          fi
          if grep -Eq 'binanceCredentials\(|buildSignedBinanceQuery\(|getBinanceServerTime\(' src/supabase-live-client.js; then
            echo "Cloudflare Binance signing dependency returned"
            exit 1
          fi
          grep -q 'LEGACY_VERCEL_SIGNER_REVOKED' api/binance-signed-relay.mjs
          grep -q 'oldVercelFallback: false' src/buy-gateway-stable.js
          grep -q 'liveExecutionEnabled: false' src/live-cutover-policy.js
          grep -q 'autonomousEnabled: false' src/live-cutover-policy.js
          grep -q 'maxOrderUSDT: 25' src/live-cutover-policy.js
          grep -q 'maxOpenPositions: 1' src/live-cutover-policy.js
          grep -q 'dailyLossCapUSDT: 0.5' src/live-cutover-policy.js
          grep -q '"SUPABASE_EXECUTOR_READY": "true"' wrangler.jsonc
          grep -q '"AUTONOMOUS_ENABLED": "false"' wrangler.jsonc
          grep -q '"MANUAL_APPROVAL_ONLY": "true"' wrangler.jsonc
          grep -q '"E2E_ARMED": "false"' wrangler.jsonc
          grep -q '"MAKE_EXECUTOR_V2_READY": "false"' wrangler.jsonc
          grep -q '"EXECUTION_PROVIDER": "SUPABASE_V2"' wrangler.jsonc
          if grep -q '"AUTONOMOUS_ENABLED": "true"' wrangler.jsonc && ! grep -q '"LIVE_EXECUTION_ENABLED": "true"' wrangler.jsonc; then
            echo "AUTONOMOUS_ENABLED=true requires LIVE_EXECUTION_ENABLED=true"
            exit 1
          fi
          node scripts/test-make-v2-manual-route.mjs
          grep -q 'PROTECTION_FAILED_EMERGENCY_CLOSED' src/supabase-live-client.js
          grep -q 'OCO_SUBMISSION_UNKNOWN' src/supabase-live-client.js
          grep -q 'mayResend: false' src/supabase-live-client.js
          grep -q 'EXPECTED_TELEGRAM_WEBHOOK_URL' src/buy-gateway-stable.js
          grep -q 'TELEGRAM_WEBHOOK_OK' src/buy-gateway-stable.js
          if grep -Eq 'withdraw|fapi|leverage|margin' api/binance-signed-relay.mjs; then
            echo "Forbidden non-Spot capability found in Vercel relay"
            exit 1
          fi
          if grep -q 'buy-gateway-canonical.js' src/buy-gateway-time-monitor.js; then
            echo "Active time monitor still routes through Railway-era canonical gateway"
            exit 1
          fi

      - name: Verify Supabase manual-live runtime flags
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            "https://irinttijrhicxofsdplo.supabase.co/functions/v1/tst-binance-relay?nonce=$(date +%s%N)" \
            -o /tmp/supabase-flags.json
          cat /tmp/supabase-flags.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/supabase-flags.json'))
          assert r.get('ok') is True
          assert r.get('financialWritesEnabled') is True
          assert r.get('e2eTestMode') is False
          assert r.get('autonomousEnabled') is False
          assert r.get('financialAction') is False
          assert r.get('privateKeyExposed') is False
          PY

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify live Cloudflare/Vercel runtime
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 15); do
            curl --silent --show-error --max-time 20 -H 'cache-control: no-store'               "https://tst-spot-signal.nurhanne-tarek13.workers.dev/runtime-check?deploy=${GITHUB_SHA}&attempt=${attempt}&nonce=$(date +%s%N)"               -o /tmp/runtime.json || true
            cat /tmp/runtime.json 2>/dev/null || true
            echo
            if python - <<'PY'
          import json,sys
          try: r=json.load(open('/tmp/runtime.json'))
          except Exception: sys.exit(1)
          provider=r.get('executionProvider')
          expected_route={
            'MAKE_V2':'CLOUDFLARE_HMAC_MAKE',
            'SUPABASE_V2':'CLOUDFLARE_SIGNED_SUPABASE_BINANCE',
          }.get(provider)
          checks=[
            r.get('ok') is True,
            provider in {'MAKE_V2','SUPABASE_V2'},
            r.get('executionRoute') == expected_route,
            isinstance(r.get('executorConfigured'), bool),
            r.get('telegramConfigured') is True,
            r.get('atomicConfirmClaim') is True,
            r.get('fastSignalIngest') is True,
            r.get('oneTapConfirm') is True,
            r.get('autoBuy') is False,
            r.get('oldVercelFallback') is False,
            r.get('noSecretValuesExposed') is True,
          ]
          sys.exit(0 if all(checks) else 1)
          PY
            then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1

      - name: Report live execution readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 25 \
            -H 'cache-control: no-store' \
            "https://tst-spot-signal.nurhanne-tarek13.workers.dev/live-readiness?nonce=$(date +%s%N)" \
            -o /tmp/readiness.json
          cat /tmp/readiness.json
          EXPECTED_LIVE=$(sed -n 's/.*"LIVE_EXECUTION_ENABLED": "\(true\|false\)".*/\1/p' wrangler.jsonc | head -1)
          EXPECTED_AUTO=$(sed -n 's/.*"AUTONOMOUS_ENABLED": "\(true\|false\)".*/\1/p' wrangler.jsonc | head -1)
          export EXPECTED_LIVE EXPECTED_AUTO
          python - <<'PY'
          import json, os
          r=json.load(open('/tmp/readiness.json'))
          assert r.get('ok') is True
          assert r.get('executionProvider') == 'SUPABASE_V2'
          assert r.get('executionRoute') == 'CLOUDFLARE_SIGNED_SUPABASE_BINANCE'
          assert r.get('railwayDependency') is False
          assert r.get('oldVercelFallback') is False
          assert r.get('e2eArmed') is False
          assert r.get('liveExecutionEnabled') is (os.environ['EXPECTED_LIVE'] == 'true')
          assert r.get('autonomousExecution') is (os.environ['EXPECTED_AUTO'] == 'true')
          # This endpoint is the legacy manual-E2E readiness view. With E2E_ARMED=false
          # it must never report a manual test as execution-ready, even in Limited Live.
          assert r.get('executionReady') is False
          assert r.get('noBalanceValuesExposed') is True
          assert r.get('noSecretValuesExposed') is True
          PY

      - name: Verify Supabase V2 replay and intent idempotency
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 30 -X POST             -H 'cache-control: no-store'             "https://tst-spot-signal.nurhanne-tarek13.workers.dev/supabase-v2-auth-selftest?nonce=$(date +%s%N)"             -o /tmp/v2-auth-selftest.json || true
          cat /tmp/v2-auth-selftest.json 2>/dev/null || true
          curl --silent --show-error --max-time 20 -X POST             -H 'cache-control: no-store'             "https://tst-spot-signal.nurhanne-tarek13.workers.dev/supabase-v2-idempotency-selftest?nonce=$(date +%s%N)"             -o /tmp/v2-idempotency.json || true
          cat /tmp/v2-idempotency.json 2>/dev/null || true
          python - <<'PY'
          import json
          a=json.load(open('/tmp/v2-auth-selftest.json'))
          i=json.load(open('/tmp/v2-idempotency.json'))
          assert a.get('financialAction') is False
          assert a.get('noSecretValuesExposed') is True
          if a.get('status') != 'DIAGNOSTIC_THROTTLED':
              assert a.get('ok') is True
              assert (a.get('replay') or {}).get('status') == 'RELAY_REPLAY_BLOCKED'
              assert (a.get('stale') or {}).get('status') == 'RELAY_AUTH_STALE'
          else:
              print("SUPABASE_AUTH_SELFTEST_THROTTLED_DEDICATED_REPLAY_WORKFLOW_IS_AUTHORITATIVE")
          assert i.get('financialAction') is False
          assert i.get('noSecretValuesExposed') is True
          assert i.get('ok') is True
          assert i.get('firstClaim') is True
          assert i.get('secondClaim') is False
          print("SUPABASE_V2_REPLAY_AND_IDEMPOTENCY_PASS")
          PY

      - name: Probe Binance signing mode safely
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 35             -H 'cache-control: no-store'             "https://tst-spot-signal.nurhanne-tarek13.workers.dev/binance-signing-mode-probe?nonce=$(date +%s%N)"             -o /tmp/signing-mode.json || true
          cat /tmp/signing-mode.json 2>/dev/null || true
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('/tmp/signing-mode.json')
          if not p.exists() or not p.read_text().strip():
              print("BINANCE_SIGNING_PROBE=NO_RESPONSE")
              raise SystemExit(0)
          try: r=json.loads(p.read_text())
          except Exception:
              print("BINANCE_SIGNING_PROBE=NON_JSON")
              raise SystemExit(0)
          assert r.get('financialAction') is False
          assert r.get('noSecretValuesExposed') is True
          print("BINANCE_SIGNING_PROBE_OK=",r.get('ok'))
          print("BINANCE_SIGNING_PROBE_STATUS=",r.get('status'))
          print("BINANCE_SIGNING_MODE=",r.get('signingMode'))
          for x in r.get('results',[]):
              print("MODE_RESULT",x.get('mode'),x.get('ok'),x.get('httpStatus'),x.get('binanceCode'),x.get('status'))
          PY

      - name: Report production Supabase V2 dry run
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 40 -X POST             -H 'cache-control: no-store'             "https://tst-spot-signal.nurhanne-tarek13.workers.dev/production-v2-dry-run?nonce=$(date +%s%N)"             -o /tmp/v2-dryrun.json || true
          cat /tmp/v2-dryrun.json 2>/dev/null || true
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('/tmp/v2-dryrun.json')
          if not p.exists() or not p.read_text().strip():
              print("V2_DRYRUN_STATUS=NO_RESPONSE")
              raise SystemExit(0)
          try: r=json.loads(p.read_text())
          except Exception:
              print("V2_DRYRUN_STATUS=NON_JSON_RESPONSE")
              raise SystemExit(0)
          assert r.get('financialAction') is False
          print("V2_DRYRUN_OK=",r.get('ok'))
          print("V2_DRYRUN_STATUS=",r.get('status'))
          print("V2_DRYRUN_BINANCE_CODE=",r.get('binanceCode'))
          print("V2_DRYRUN_ROUTE=",r.get('route'))
          d=r.get('diagnostics') or {}
          print("V2_DRYRUN_CANONICAL=",d.get('unsignedCanonicalPayload'))
          print("V2_DRYRUN_TIMESTAMP_DELTA_MS=",d.get('timestampDeltaMs'))
          PY

      - name: Verify Telegram callback webhook
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 -X POST             -H 'cache-control: no-store'             "https://tst-spot-signal.nurhanne-tarek13.workers.dev/telegram-webhook-check?nonce=$(date +%s%N)"             -o /tmp/webhook.json
          cat /tmp/webhook.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/webhook.json'))
          assert r.get('ok') is True
          assert r.get('status') == 'TELEGRAM_WEBHOOK_OK'
          assert r.get('urlMatches') is True
          assert r.get('callbackQueryAllowed') is True
          PY

      - name: Verify 24/7 fail-closed supervisor
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            -H 'cache-control: no-store' \
            "https://tst-spot-signal.nurhanne-tarek13.workers.dev/ops-status?nonce=$(date +%s%N)" \
            -o /tmp/ops.json
          cat /tmp/ops.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/ops.json'))
          assert r.get('ok') is True
          assert r.get('persistentScheduler') is True
          assert r.get('deadManMonitoring') is True
          assert r.get('recoveryStateMachine') is True
          assert r.get('alertEscalation') is True
          assert isinstance(r.get('liveTrading'), bool)
          assert isinstance(r.get('autonomousExecution'), bool)
          assert r.get('noSecretValuesExposed') is True
          PY

      - name: Verify execution provider safety configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"SUPABASE_EXECUTOR_READY": "true"' wrangler.jsonc
          grep -q '"EXECUTION_PROVIDER": "SUPABASE_V2"' wrangler.jsonc
          grep -q '"AUTONOMOUS_ENABLED": "false"' wrangler.jsonc
          grep -q '"MANUAL_APPROVAL_ONLY": "true"' wrangler.jsonc
          grep -q '"E2E_ARMED": "false"' wrangler.jsonc
          grep -q '"MAKE_EXECUTOR_V2_READY": "false"' wrangler.jsonc
          # Source default stays fail-closed; production write permission is a runtime secret.
          grep -q 'const WRITES_ENABLED = false' supabase/functions/tst-binance-relay/index.ts
          grep -q 'id: "BUY_V2"' src/make-live-client.js
          grep -q 'id: "OCO_V2"' src/make-live-client.js
          if grep -q '"AUTONOMOUS_ENABLED": "true"' wrangler.jsonc && ! grep -q '"LIVE_EXECUTION_ENABLED": "true"' wrangler.jsonc; then
            echo "Invalid activation: autonomous requires live execution"
            exit 1
          fi
          echo "EXECUTION_PROVIDER_SAFETY_CONFIG_OK"

      - name: Verify legacy Make bridge is hard-disabled under Supabase V2
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --max-time 20 -o /tmp/bridge.json -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            --data '{"signal_id":"deploycheck","symbol":"BTCUSDT"}' \
            "https://tst-spot-signal.nurhanne-tarek13.workers.dev/bridge-auth-selftest?nonce=$(date +%s%N)")
          cat /tmp/bridge.json
          BRIDGE_CODE="$code" python - <<'PY'
          import json, os
          r=json.load(open('/tmp/bridge.json'))
          assert os.environ.get('BRIDGE_CODE') == '410'
          assert r.get('status') == 'LEGACY_EXECUTION_DISABLED'
          assert r.get('financialAction') is False
          assert r.get('oldVercelFallback') is False
          PY

      - name: Verify production limited-live readiness proof stays non-financial
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 2 --retry-all-errors --max-time 30 \
            -H 'cache-control: no-store' \
            "https://tst-spot-signal.nurhanne-tarek13.workers.dev/limited-live-readiness-proof?nonce=$(date +%s%N)" \
            -o /tmp/readiness-proof.json
          cat /tmp/readiness-proof.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/readiness-proof.json'))
          hb=r.get('heartbeats') or {}
          tg=r.get('telegramControls') or {}
          policy=r.get('policy') or {}
          assert r.get('ok') is True
          assert r.get('status') == 'LIMITED_LIVE_READINESS_PROOF'
          assert r.get('financialAction') is False
          assert r.get('noSecretValuesExposed') is True
          assert r.get('executorConfigured') is True
          assert r.get('supervisorState') == 'HEALTHY'
          assert r.get('stale') == []
          assert (hb.get('binanceReadonly') or {}).get('fresh') is True
          assert (hb.get('reconciler') or {}).get('fresh') is True
          assert (hb.get('protection') or {}).get('fresh') is True
          reconciliation=r.get('reconciliation') or {}
          assert reconciliation.get('ok') is True
          assert reconciliation.get('fresh') is True
          assert r.get('noUnknownOrders') is True
          assert r.get('noUnprotectedPositions') is True
          assert r.get('activeIntents') == 0
          assert r.get('realE2EV20Recognized') is True
          assert r.get('autonomousPathRecognizesV20') is True
          assert r.get('autonomousProofKey') == 'live:e2e-result-v20'
          assert r.get('manualApprovalOnly') is True
          assert r.get('automaticBuyBlocked') is True
          assert tg.get('pauseImplemented') is True
          assert tg.get('resumeImplemented') is True
          assert tg.get('pauseEnforcedByExecutionGate') is True
          assert tg.get('pauseCancelsExistingProtection') is False
          assert tg.get('resumeRequiresHealthySupervisor') is True
          assert tg.get('resumeRequiresFreshReconciliation') is True
          assert tg.get('resumeRequiresNoUnknownOrders') is True
          assert tg.get('resumeRequiresNoUnprotectedPositions') is True
          assert tg.get('resumeRequiresValidE2EV20') is True
          import pathlib, re
          cfg=pathlib.Path('wrangler.jsonc').read_text()
          expected_live=re.search(r'"LIVE_EXECUTION_ENABLED"\s*:\s*"(true|false)"',cfg).group(1)=='true'
          expected_auto=re.search(r'"AUTONOMOUS_ENABLED"\s*:\s*"(true|false)"',cfg).group(1)=='true'
          assert policy.get('liveExecutionEnabled') is expected_live
          assert expected_auto is False
          assert policy.get('autonomousEnabled') is False
          assert policy.get('e2eArmed') is False
          PY

      - name: Verify scanner cannot auto-buy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 10); do
            rm -f /tmp/scanner.json
            curl --silent --show-error --max-time 40 \
              -H 'cache-control: no-store' \
              "https://tst-spot-signal.nurhanne-tarek13.workers.dev/scanner-status?attempt=${attempt}&nonce=$(date +%s%N)" \
              -o /tmp/scanner.json || true
            cat /tmp/scanner.json 2>/dev/null || true
            echo
            if python - <<'PY'
          import json,sys
          try: r=json.load(open('/tmp/scanner.json'))
          except Exception: sys.exit(1)
          checks=[
            r.get('ok') is True,
            r.get('mode') == 'THESIS_SETUP_SHADOW_V1',
            r.get('decisionEngine') == 'SETUP_THESIS_CONFIRMATION',
            r.get('liveTrading') is False,
            r.get('executorAllowed') is False,
            r.get('decisionFlow') == [
              'MARKET_CONTEXT','STRUCTURAL_SETUP','THESIS','CONFIRMATION_VETO',
              'INVALIDATION','STRUCTURE_TARGETS','NET_RR','CALIBRATION'
            ],
          ]
          sys.exit(0 if all(checks) else 1)
          PY
            then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1
