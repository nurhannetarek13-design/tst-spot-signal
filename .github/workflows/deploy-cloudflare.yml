name: Deploy Cloudflare Minute Scheduler

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/edge-worker.js"
      - "src/buy-gateway-stable.js"
      - "src/buy-gateway-canonical.js"
      - "src/buy-gateway-time-monitor.js"
      - "src/buy-gateway-auth-wrapper.js"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Validate canonical Worker + monitor + auth wrapper
        shell: bash
        run: |
          set -euo pipefail
          node --check src/edge-worker.js
          node --check src/buy-gateway-stable.js
          node --check src/buy-gateway-canonical.js
          node --check src/buy-gateway-time-monitor.js
          node --check src/buy-gateway-auth-wrapper.js
          grep -q '"main": "src/buy-gateway-auth-wrapper.js"' wrangler.jsonc
          grep -q 'LIQUIDITY_CRASH_EXHAUSTION' src/edge-worker.js
          grep -q 'STOP_HUNT_REVERSAL' src/edge-worker.js
          grep -q 'await scan(env,false)' src/edge-worker.js
          grep -q 'url.pathname==="/claim"' src/edge-worker.js
          grep -q 'CLOUDFLARE_SIGNED_RAILWAY_MAKE_BINANCE' src/buy-gateway-canonical.js
          grep -q 'FAST_SIGNAL_DRYRUN_OK' src/buy-gateway-canonical.js
          grep -q 'executeBuyThenProtect' src/buy-gateway-canonical.js
          grep -q 'execution-lock:' src/buy-gateway-canonical.js
          grep -q '/telegram-webhook-check' src/buy-gateway-canonical.js
          grep -Eq 'autoBuy[[:space:]]*:[[:space:]]*false' src/buy-gateway-canonical.js
          grep -q 'REVIEW_45_MS' src/buy-gateway-time-monitor.js
          grep -q 'REVIEW_75_MS' src/buy-gateway-time-monitor.js
          grep -q 'HOLD30:' src/buy-gateway-time-monitor.js
          grep -q 'x-fast-ecdsa' src/buy-gateway-auth-wrapper.js
          grep -q 'ECDSA' src/buy-gateway-auth-wrapper.js
          if grep -q 'sendPeriodicScanDigest' src/edge-worker.js; then
            echo "Legacy periodic digest still exists"
            exit 1
          fi
          if grep -q 'scan(env,true)' src/edge-worker.js; then
            echo "Scanner can still send direct Telegram alerts"
            exit 1
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify Make-native runtime guards
        shell: bash
        run: |
          set -euo pipefail
          passed=0
          for attempt in $(seq 1 20); do
            curl --silent --show-error --max-time 20 \
              -H 'cache-control: no-store, no-cache, max-age=0' \
              "https://tst-spot-signal.nurhanne-tarek13.workers.dev/make-runtime-check?deploy=${GITHUB_SHA}&attempt=${attempt}&nonce=$(date +%s%N)" \
              -o /tmp/runtime.json || true
            cat /tmp/runtime.json 2>/dev/null || true
            echo
            if python - <<'PY'
          import json,sys
          try:
              row=json.load(open('/tmp/runtime.json'))
          except Exception:
              sys.exit(1)
          checks=[
              row.get('ok') is True,
              row.get('credentialMode') == 'MAKE_VERIFIED',
              row.get('executionRoute') == 'CLOUDFLARE_SIGNED_RAILWAY_MAKE_BINANCE',
              row.get('twoStepBuyOco') is True,
              row.get('actualFillProtection') is True,
              row.get('feeReserve') is True,
              row.get('atomicConfirmClaim') is True,
              row.get('userConfirmationRequired') is True,
              row.get('autoBuy') is False,
              row.get('telegramConfigured') is True,
              row.get('noSecretValuesExposed') is True,
          ]
          sys.exit(0 if all(checks) else 1)
          PY
            then
              passed=1
              break
            fi
            sleep 3
          done
          test "$passed" = "1"

      - name: Verify Telegram webhook through Worker secret
        shell: bash
        run: |
          set -euo pipefail
          passed=0
          for attempt in $(seq 1 5); do
            curl --silent --show-error --max-time 20 \
              -X POST \
              -H 'cache-control: no-store, no-cache, max-age=0' \
              "https://tst-spot-signal.nurhanne-tarek13.workers.dev/telegram-webhook-check?deploy=${GITHUB_SHA}&attempt=${attempt}&nonce=$(date +%s%N)" \
              -o /tmp/webhook.json || true
            cat /tmp/webhook.json 2>/dev/null || true
            echo
            if python - <<'PY'
          import json,sys
          try:
              row=json.load(open('/tmp/webhook.json'))
          except Exception:
              sys.exit(1)
          checks=[
              row.get('ok') is True,
              row.get('status') == 'TELEGRAM_WEBHOOK_OK',
              row.get('urlMatches') is True,
              row.get('callbackQueryAllowed') is True,
              row.get('noSecretValuesExposed') is True,
          ]
          sys.exit(0 if all(checks) else 1)
          PY
            then
              passed=1
              break
            fi
            sleep 2
          done
          test "$passed" = "1"

      - name: Verify scanner remains non-executing
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 60 \
            -X POST \
            -H 'cache-control: no-store, no-cache, max-age=0' \
            "https://tst-spot-signal.nurhanne-tarek13.workers.dev/scanner-status?deploy=${GITHUB_SHA}&nonce=$(date +%s%N)" \
            -o /tmp/status.json
          cat /tmp/status.json
          echo
          python - <<'PY'
          import json
          row=json.load(open('/tmp/status.json'))
          assert row.get('ok') is True
          assert row.get('liveTrading') is False
          assert row.get('executorAllowed') is False
          PY
