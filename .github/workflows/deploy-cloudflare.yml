name: Deploy Cloudflare Minute Scheduler
# Deploy production paper scanner, verify Telegram + health endpoints, then force a scan.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/edge-worker.js"
      - "src/index.js"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Syntax check adaptive worker
        run: node --check src/edge-worker.js

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify Telegram connection
        run: |
          curl --fail --silent --show-error --max-time 60             "https://tst-spot-signal.nurhanne-tarek13.workers.dev/?test=telegram"             -o /tmp/telegram.json
          python - <<'PY'
          import json
          row=json.load(open("/tmp/telegram.json"))
          print(row)
          assert row.get("ok") is True
          assert row.get("liveTrading") is False
          PY

      - name: Verify scanner endpoint
        run: |
          curl --fail --silent --show-error --max-time 60             "https://tst-spot-signal.nurhanne-tarek13.workers.dev/scan-preview"             -o /tmp/scan.json
          python - <<'PY'
          import json
          row=json.load(open("/tmp/scan.json"))
          print(json.dumps(row,indent=2))
          if row.get("ok") is not True:
              raise SystemExit(f"Scanner unhealthy: {row}")
          if row.get("liveTrading") is not False:
              raise SystemExit("Scanner must remain paper-only")
          PY

      - name: Verify derivatives context endpoint
        run: |
          curl --fail --silent --show-error --max-time 60             "https://tst-spot-signal.nurhanne-tarek13.workers.dev/derivatives-status?symbol=ENAUSDT"             -o /tmp/deriv.json
          python - <<'PY'
          import json
          row=json.load(open("/tmp/deriv.json"))
          print(json.dumps(row,indent=2))
          if row.get("status") not in {"OK","NO_FUTURES_DATA"}:
              raise SystemExit(f"Derivatives endpoint unhealthy: {row}")
          if row.get("liveTrading") is not False:
              raise SystemExit("Derivatives context must remain read-only")
          PY

      - name: Verify unified fusion gate endpoint
        run: |
          curl --fail --silent --show-error --max-time 60             "https://tst-spot-signal.nurhanne-tarek13.workers.dev/fusion-status?refresh=1"             -o /tmp/fusion.json
          python - <<'PY'
          import json
          row=json.load(open("/tmp/fusion.json"))
          print(json.dumps(row,indent=2))
          if row.get("ok") is not True:
              raise SystemExit(f"Fusion endpoint unhealthy: {row}")
          if row.get("liveTrading") is not False or row.get("executorAllowed") is not False:
              raise SystemExit("Fusion must remain fail-closed")
          PY

      - name: Trigger immediate opportunity scan
        run: |
          curl --fail --silent --show-error --max-time 60             "https://tst-spot-signal.nurhanne-tarek13.workers.dev/"             -o /tmp/immediate.json
          python - <<'PY'
          import json
          row=json.load(open("/tmp/immediate.json"))
          print(json.dumps(row,indent=2))
          if row.get("ok") is not True:
              raise SystemExit(f"Immediate scan failed: {row}")
          if row.get("liveTrading") is not False:
              raise SystemExit("Immediate scan must be paper-only")
          PY
