name: Deploy Cloudflare Minute Scheduler

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/edge-worker.js"
      - "src/buy-gateway-stable.js"
      - "src/buy-gateway-canonical.js"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Validate canonical Worker source
        shell: bash
        run: |
          set -euo pipefail
          node --check src/edge-worker.js
          node --check src/buy-gateway-stable.js
          node --check src/buy-gateway-canonical.js
          grep -q '"main": "src/buy-gateway-canonical.js"' wrangler.jsonc
          grep -q 'LIQUIDITY_CRASH_EXHAUSTION' src/edge-worker.js
          grep -q 'STOP_HUNT_REVERSAL' src/edge-worker.js
          grep -q 'await scan(env,false)' src/edge-worker.js
          grep -q 'url.pathname==="/claim"' src/edge-worker.js
          grep -q 'PREP:' src/buy-gateway-stable.js
          grep -q 'CONFIRM:' src/buy-gateway-stable.js
          grep -q 'claimState' src/buy-gateway-stable.js
          grep -q 'LIVE_CREDENTIALS_REQUIRED' src/buy-gateway-stable.js
          grep -q 'DEMO_EXECUTION_DISABLED' src/buy-gateway-stable.js
          grep -q 'CLOUDFLARE_SIGNED_VERCEL_DEMO_READONLY' src/buy-gateway-canonical.js
          grep -q 'network: "demo"' src/buy-gateway-canonical.js
          grep -q '/telegram-webhook-check' src/buy-gateway-canonical.js
          grep -q 'TELEGRAM_WEBHOOK_OK' src/buy-gateway-canonical.js
          grep -Eq 'autoBuy[[:space:]]*:[[:space:]]*false' src/buy-gateway-canonical.js
          if grep -q 'sendPeriodicScanDigest' src/edge-worker.js; then
            echo "Legacy periodic digest still exists"
            exit 1
          fi
          if grep -q 'scan(env,true)' src/edge-worker.js; then
            echo "Scanner can still send direct Telegram alerts"
            exit 1
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Inspect Worker secret names
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler secret list

      - name: Configure Telegram webhook when Actions secret exists
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ]; then
            curl --fail --silent --show-error -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
              -H 'content-type: application/json' \
              --data '{"url":"https://tst-spot-signal.nurhanne-tarek13.workers.dev/telegram-webhook","allowed_updates":["callback_query"]}'
          fi

      - name: Verify canonical runtime guards
        shell: bash
        run: |
          set -euo pipefail
          expected='CLOUDFLARE_SIGNED_VERCEL_DEMO_READONLY'
          matched=0
          for attempt in $(seq 1 20); do
            curl --silent --show-error --max-time 20 \
              -X POST \
              -H 'cache-control: no-store, no-cache, max-age=0' \
              "https://tst-spot-signal.nurhanne-tarek13.workers.dev/runtime-check?deploy=${GITHUB_SHA}&attempt=${attempt}&nonce=$(date +%s%N)" \
              -o /tmp/runtime.json || true
            cat /tmp/runtime.json 2>/dev/null || true
            echo
            if python - <<'PY'
          import json,sys
          try:
              row=json.load(open('/tmp/runtime.json'))
          except Exception:
              sys.exit(1)
          checks=[
              row.get('ok') is True,
              row.get('telegramConfigured') is True,
              row.get('hasApiKey') is True,
              row.get('hasApiSecret') is True,
              row.get('credentialMode') == 'DEMO',
              row.get('executionRoute') == 'CLOUDFLARE_SIGNED_VERCEL_DEMO_READONLY',
              row.get('atomicConfirmClaim') is True,
              row.get('demoExecutionDisabled') is True,
              row.get('autoBuy') is False,
              row.get('noSecretValuesExposed') is True,
          ]
          sys.exit(0 if all(checks) else 1)
          PY
            then
              matched=1
              break
            fi
            sleep 3
          done
          test "$matched" = "1"

      - name: Verify Telegram webhook through Worker secret
        shell: bash
        run: |
          set -euo pipefail
          passed=0
          for attempt in $(seq 1 5); do
            curl --silent --show-error --max-time 20 \
              -X POST \
              -H 'cache-control: no-store, no-cache, max-age=0' \
              "https://tst-spot-signal.nurhanne-tarek13.workers.dev/telegram-webhook-check?deploy=${GITHUB_SHA}&attempt=${attempt}&nonce=$(date +%s%N)" \
              -o /tmp/webhook.json || true
            cat /tmp/webhook.json 2>/dev/null || true
            echo
            if python - <<'PY'
          import json,sys
          try:
              row=json.load(open('/tmp/webhook.json'))
          except Exception:
              sys.exit(1)
          checks=[
              row.get('ok') is True,
              row.get('status') == 'TELEGRAM_WEBHOOK_OK',
              row.get('urlMatches') is True,
              row.get('callbackQueryAllowed') is True,
              row.get('noSecretValuesExposed') is True,
          ]
          sys.exit(0 if all(checks) else 1)
          PY
            then
              passed=1
              break
            fi
            sleep 2
          done
          test "$passed" = "1"

      - name: Verify Binance Spot Demo account read through Vercel relay
        shell: bash
        run: |
          set -euo pipefail
          passed=0
          for attempt in $(seq 1 24); do
            echo "balance attempt ${attempt}/24"
            curl --silent --show-error --max-time 25 \
              -X POST \
              -H 'cache-control: no-store, no-cache, max-age=0' \
              "https://tst-spot-signal.nurhanne-tarek13.workers.dev/balance-refresh?deploy=${GITHUB_SHA}&attempt=${attempt}&nonce=$(date +%s%N)" \
              -o /tmp/balance.json || true
            cat /tmp/balance.json 2>/dev/null || true
            echo
            if python - <<'PY'
          import json,sys
          try:
              row=json.load(open('/tmp/balance.json'))
          except Exception:
              sys.exit(1)
          if row.get('executionRoute') != 'CLOUDFLARE_SIGNED_VERCEL_DEMO_READONLY':
              sys.exit(1)
          if row.get('ok') is not True or row.get('autoBuy') is not False:
              sys.exit(1)
          bal=row.get('balance') or {}
          checks=[
              bal.get('ok') is True,
              bal.get('status') == 'ACCOUNT_BALANCE_OK',
              bal.get('source') == 'CLOUDFLARE_SIGNED_VERCEL_DEMO_READONLY',
              bal.get('network') == 'demo',
              bal.get('credentialMode') == 'DEMO',
              isinstance((bal.get('usdt') or {}).get('free'), (int,float)),
          ]
          sys.exit(0 if all(checks) else 1)
          PY
            then
              passed=1
              break
            fi
            sleep 3
          done
          if [ "$passed" != "1" ]; then
            echo "Demo account read did not pass. Final safe response:"
            cat /tmp/balance.json 2>/dev/null || true
            exit 1
          fi

      - name: Verify scanner remains non-executing
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 60 \
            -X POST \
            -H 'cache-control: no-store, no-cache, max-age=0' \
            "https://tst-spot-signal.nurhanne-tarek13.workers.dev/scanner-status?deploy=${GITHUB_SHA}&nonce=$(date +%s%N)" \
            -o /tmp/status.json
          cat /tmp/status.json
          echo
          python - <<'PY'
          import json
          row=json.load(open('/tmp/status.json'))
          assert row.get('ok') is True
          assert row.get('liveTrading') is False
          assert row.get('executorAllowed') is False
          PY
