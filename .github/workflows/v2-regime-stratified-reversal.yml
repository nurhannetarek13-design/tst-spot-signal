name: V2 Regime Stratified Reversal OOS

on:
  push:
    branches: [bot-v2-standalone]
    paths:
      - 'v2_bot/research/regime_stratified_reversal.py'
      - '.github/workflows/v2-regime-stratified-reversal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile validator
        run: python -m py_compile v2_bot/research/regime_stratified_reversal.py
      - name: Run frozen 365d regime validation
        env:
          V2_REGIME_REVERSAL_OUT: v2-regime-stratified-reversal.json
        run: python v2_bot/research/regime_stratified_reversal.py
      - name: Assert research-only safety contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('v2-regime-stratified-reversal.json'))
          assert p['liveTrading'] is False
          assert p['authorization'] in {'RESEARCH_ONLY','PAPER_CONSIDERATION_ONLY'}
          assert isinstance(p['acceptedRegimesForPaperConsideration'], list)
          print('acceptedRegimesForPaperConsideration=', p['acceptedRegimesForPaperConsideration'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v2-regime-stratified-reversal
          path: v2-regime-stratified-reversal.json
          retention-days: 14
