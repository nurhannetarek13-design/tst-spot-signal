name: Round 10 unseen-symbol replication
on:
  push:
    paths:
      - 'scripts/research-round10.mjs'
      - 'validation/evidence-gate-round10.json'
      - '.github/workflows/research-round10.yml'
  workflow_dispatch:
jobs:
  replication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check scripts/research-round10.mjs
      - run: node scripts/research-round10.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: round10-replication
          path: validation/round10-replication.json
