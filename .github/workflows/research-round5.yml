name: Round 5 momentum rotation
on:
  push:
    paths:
      - 'scripts/research-round5.mjs'
      - '.github/workflows/research-round5.yml'
  workflow_dispatch:
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/research-round5.mjs
      - run: node scripts/research-round5.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: round5-discovery
          path: validation/round5-discovery.json
