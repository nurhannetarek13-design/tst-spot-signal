name: Basis Premium Edge Scanner V1

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/basis_premium_edge_scanner_v1.py'
      - '.github/workflows/basis-premium-edge-scanner-v1.yml'

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy pandas
      - name: Syntax check
        run: python -m py_compile research/basis_premium_edge_scanner_v1.py
      - name: Run frozen Round 8 basis-premium discovery
        run: python research/basis_premium_edge_scanner_v1.py
      - name: Assert research-only contract
        run: |
          python - <<'PY'
          import json
          p='validation/edges/basis-premium-edge-scanner-v1-latest.json'
          x=json.load(open(p))
          assert x['engine']=='BASIS_PREMIUM_EDGE_SCANNER_V1'
          assert x['round']==8
          assert x['authorization']=='RESEARCH_ONLY'
          assert x['liveTrading'] is False and x['liveReady'] is False
          assert len(x['families'])==3
          assert x['multipleTesting']['method']=='Benjamini-Hochberg'
          assert x['robustnessGate']['positiveSymbolsMin']==4
          assert x['robustnessGate']['maxEventShare']==0.40
          assert all('robustness' in t and 'qValue' in t and 'pass' in t for t in x['tests'])
          print({'decision':x['decision'],'survivorCount':x['survivorCount']})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: basis-premium-edge-scanner-v1-report
          path: validation/edges/basis-premium-edge-scanner-v1-latest.json
          retention-days: 14
