name: OctoBot Signal Gateway

on:
  workflow_dispatch:
  push:
    branches:
      - fix/unified-execution-parity
    paths:
      - 'scripts/octobot-signal-gateway.mjs'
      - 'test/octobot-signal-gateway.test.mjs'
      - 'package.json'
      - '.github/workflows/octobot-signal-gateway.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: npm run check:octobot-gateway
      - name: Gateway tests
        run: node --test test/octobot-signal-gateway.test.mjs
