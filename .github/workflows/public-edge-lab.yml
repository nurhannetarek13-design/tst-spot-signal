name: Public Edge Lab

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"
  push:
    branches: [main]
    paths:
      - "research/public_edge_lab.py"
      - "scripts/build_candidate_manifest.py"
      - ".github/workflows/public-edge-lab.yml"

permissions:
  contents: write

concurrency:
  group: public-edge-lab
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check pandas numpy
      - name: Run public edge lab
        run: python research/public_edge_lab.py

      - name: Build unified candidate manifest
        run: python scripts/build_candidate_manifest.py
      - name: Commit research snapshot safely
        run: |
          cp validation/edges/public-edge-lab-latest.json /tmp/public-edge-lab-latest.json
          cp validation/fusion/candidate-manifest.json /tmp/candidate-manifest.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$(dirname validation/edges/public-edge-lab-latest.json)"
            cp /tmp/public-edge-lab-latest.json validation/edges/public-edge-lab-latest.json
            mkdir -p "$(dirname validation/fusion/candidate-manifest.json)"
            cp /tmp/candidate-manifest.json validation/fusion/candidate-manifest.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add validation/edges/public-edge-lab-latest.json validation/fusion/candidate-manifest.json
            git diff --cached --quiet && exit 0
            git commit -m "Update public edge lab and unified candidate [skip ci]"
            git push origin HEAD:main && exit 0
            sleep $((i * 2))
          done
          exit 1
