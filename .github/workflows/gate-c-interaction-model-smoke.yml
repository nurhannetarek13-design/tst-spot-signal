name: Gate C Interaction Model Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/gate-c-interaction-model-smoke.yml]
permissions: {contents: read}
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy pandas pyarrow scikit-learn
      - run: PYTHONPATH=. python research/gate_c_interaction_model_v1.py --days 15 --out validation/edges/gate-c-interaction-model-smoke.json
      - name: Assert diagnostic isolation
        run: |
          python - <<'PY'
          import json
          x=json.load(open('validation/edges/gate-c-interaction-model-smoke.json'))
          assert x['authorization']=='RESEARCH_ONLY' and x['liveTrading'] is False and x['mutatesGateA'] is False
          print(json.dumps({'summary':x['summary'],'researchGatePass':x['researchGatePass'],'next':x['next']},indent=2))
          PY
