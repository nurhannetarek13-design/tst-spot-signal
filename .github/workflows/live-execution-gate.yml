name: Live Execution Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "api/binance-signed-relay.mjs"
      - "src/buy-gateway-stable.js"
      - "src/ops-supervisor.js"
      - "src/bridge-auth.js"
      - "src/live-cutover-policy.js"
      - "src/make-live-client.js"
      - "src/binance-spot-filters.js"
      - "wrangler.jsonc"
      - ".github/workflows/live-execution-gate.yml"

permissions:
  contents: read

env:
  WORKER_URL: https://tst-spot-signal.nurhanne-tarek13.workers.dev

jobs:
  live-execution-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production manual-only Limited Live readiness
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 20); do
            rm -f /tmp/proof.json
            curl --silent --show-error --max-time 30 \
              -H 'cache-control: no-store' \
              "$WORKER_URL/limited-live-readiness-proof?attempt=${attempt}&nonce=$(date +%s%N)" -o /tmp/proof.json || true
            cat /tmp/proof.json 2>/dev/null || true
            echo
            if python - <<'PY'
          import json,sys
          try: r=json.load(open('/tmp/proof.json'))
          except Exception: sys.exit(1)
          hb=r.get('heartbeats') or {}
          tg=r.get('telegramControls') or {}
          policy=r.get('policy') or {}
          required=[
            r.get('ok') is True,
            r.get('status') == 'LIMITED_LIVE_READINESS_PROOF',
            r.get('supervisorState') == 'HEALTHY',
            r.get('stale') == [],
            r.get('executorConfigured') is True,
            (hb.get('binanceReadonly') or {}).get('fresh') is True,
            (hb.get('reconciler') or {}).get('fresh') is True,
            (hb.get('protection') or {}).get('fresh') is True,
            (r.get('reconciliation') or {}).get('ok') is True,
            (r.get('reconciliation') or {}).get('fresh') is True,
            r.get('noUnknownOrders') is True,
            r.get('noUnprotectedPositions') is True,
            r.get('activeIntents') == 0,
            r.get('realE2EV20Recognized') is True,
            r.get('manualApprovalOnly') is True,
            r.get('automaticBuyBlocked') is True,
            policy.get('liveExecutionEnabled') is True,
            policy.get('autonomousEnabled') is False,
            policy.get('e2eArmed') is False,
            tg.get('pauseImplemented') is True,
            tg.get('resumeImplemented') is True,
            tg.get('pauseEnforcedByExecutionGate') is True,
            r.get('financialAction') is False,
            r.get('noSecretValuesExposed') is True,
          ]
          sys.exit(0 if all(required) else 1)
          PY
            then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1
          echo "MANUAL_LIMITED_LIVE_READY"

      - name: Verify legacy Vercel signer is revoked
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 20 \
            -X POST \
            -H 'content-type: application/json' \
            --data '{}' \
            "https://tst-spot-signal.vercel.app/api/binance-signed-relay" \
            -o /tmp/legacy.json -w '%{http_code}' > /tmp/legacy.code
          cat /tmp/legacy.json
          python - <<'PY'
          import json
          code=open('/tmp/legacy.code').read().strip()
          r=json.load(open('/tmp/legacy.json'))
          assert code == '410'
          assert r.get('status') == 'LEGACY_VERCEL_SIGNER_REVOKED'
          assert r.get('fallbackAllowed') is False
          PY

      - name: Verify scanner remains confirmation-only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            "$WORKER_URL/scanner-status?nonce=$(date +%s%N)" -o /tmp/scanner.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/scanner.json'))
          assert r.get('ok') is True
          assert r.get('liveTrading') is False
          assert r.get('executorAllowed') is False
          PY
