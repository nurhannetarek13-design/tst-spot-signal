name: Live Execution Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "api/binance-signed-relay.mjs"
      - "src/buy-gateway-stable.js"
      - "src/ops-supervisor.js"
      - "src/bridge-auth.js"
      - "src/live-cutover-policy.js"
      - "src/make-live-client.js"
      - "src/binance-spot-filters.js"
      - "wrangler.jsonc"
      - ".github/workflows/live-execution-gate.yml"

permissions:
  contents: read

env:
  WORKER_URL: https://tst-spot-signal.nurhanne-tarek13.workers.dev

jobs:
  live-execution-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production operational Go No-Go
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 90); do
            rm -f /tmp/gate.json
            curl --silent --show-error --max-time 25 \
              -H 'cache-control: no-store' \
              "$WORKER_URL/go-no-go?attempt=${attempt}&nonce=$(date +%s%N)" -o /tmp/gate.json || true
            cat /tmp/gate.json 2>/dev/null || true
            echo
            if python - <<'PY'
          import json,sys
          try: r=json.load(open('/tmp/gate.json'))
          except Exception: sys.exit(1)
          required=[
            r.get('ok') is True,
            r.get('go') is True,
            r.get('status') == 'GO',
            r.get('activationAllowed') is False,
            'LIVE_EXECUTION_ENABLED' not in r.get('activationFailed', []),
            'AUTONOMOUS_ENABLED' in r.get('activationFailed', []),
            r.get('e2eArmed') is True,
            r.get('manualE2EComplete') is False,
            r.get('manualExecutionAllowed') is True,
            r.get('bridgeFresh') is True,
            r.get('executorOwnershipOk') is True,
            r.get('offsiteSnapshotFresh') is True,
            r.get('executionRoute') == 'CLOUDFLARE_HMAC_MAKE',
            r.get('executorConfigured') is True,
            r.get('checks',{}).get('SUPERVISOR_HEALTHY') is True,
            r.get('checks',{}).get('RECONCILIATION_OK') is True,
            r.get('checks',{}).get('SNAPSHOT_FRESH') is True,
            r.get('checks',{}).get('WATCHDOG_HEALTHY') is True,
            r.get('checks',{}).get('BINANCE_CONNECTION_OK') is True,
            r.get('checks',{}).get('EXECUTION_ROUTE_HEALTHY') is True,
            r.get('checks',{}).get('NO_UNKNOWN_ORDERS') is True,
            r.get('checks',{}).get('NO_UNPROTECTED_POSITIONS') is True,
            r.get('checks',{}).get('DAILY_RISK_AVAILABLE') is True,
            r.get('liveTrading') is True,
            r.get('autonomousExecution') is False,
            r.get('noSecretValuesExposed') is True,
          ]
          sys.exit(0 if all(required) else 1)
          PY
            then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1
          echo "OPERATIONAL_GO_V2_MANUAL_LIVE_E2E_ARMED"

      - name: Verify legacy Vercel signer is revoked
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 20 \
            -X POST \
            -H 'content-type: application/json' \
            --data '{}' \
            "https://tst-spot-signal.vercel.app/api/binance-signed-relay" \
            -o /tmp/legacy.json -w '%{http_code}' > /tmp/legacy.code
          cat /tmp/legacy.json
          python - <<'PY'
          import json
          code=open('/tmp/legacy.code').read().strip()
          r=json.load(open('/tmp/legacy.json'))
          assert code == '410'
          assert r.get('status') == 'LEGACY_VERCEL_SIGNER_REVOKED'
          assert r.get('fallbackAllowed') is False
          PY

      - name: Verify scanner remains confirmation-only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            "$WORKER_URL/scanner-status?nonce=$(date +%s%N)" -o /tmp/scanner.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/scanner.json'))
          assert r.get('ok') is True
          assert r.get('liveTrading') is False
          assert r.get('executorAllowed') is False
          PY
