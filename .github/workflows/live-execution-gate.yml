name: Live Execution Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "api/binance-signed-relay.mjs"
      - "src/buy-gateway-stable.js"
      - "src/ops-supervisor.js"
      - "src/bridge-auth.js"
      - "src/live-cutover-policy.js"
      - "src/make-live-client.js"
      - "src/binance-spot-filters.js"
      - ".github/workflows/live-execution-gate.yml"

permissions:
  contents: read

env:
  WORKER_URL: https://tst-spot-signal.nurhanne-tarek13.workers.dev

jobs:
  live-execution-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production operational Go No-Go
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 25 \
            -H 'cache-control: no-store' \
            "$WORKER_URL/go-no-go?nonce=$(date +%s%N)" -o /tmp/gate.json
          cat /tmp/gate.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/gate.json'))
          required=[
            r.get('ok') is True,
            r.get('go') is False,
            r.get('status') == 'NO_GO',
            r.get('activationAllowed') is False,
            'LIVE_EXECUTION_ENABLED' in r.get('activationFailed', []),
            'AUTONOMOUS_ENABLED' in r.get('activationFailed', []),
            r.get('bridgeFresh') is True,
            r.get('executorOwnershipOk') is True,
            r.get('offsiteSnapshotFresh') is True,
            r.get('executionRoute') == 'CLOUDFLARE_HMAC_MAKE',
            r.get('executorConfigured') is False,
            'EXECUTION_ROUTE_HEALTHY' in r.get('failed', []),
            r.get('liveTrading') is False,
            r.get('autonomousExecution') is False,
            r.get('noSecretValuesExposed') is True,
          ]
          if not all(required):
              raise SystemExit("OPERATIONAL_NO_GO: "+str(r.get('failed')))
          print("OPERATIONAL_NO_GO_EXECUTOR_V2_INCOMPLETE")
          PY

      - name: Verify legacy Vercel signer is revoked
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 20 \
            -X POST \
            -H 'content-type: application/json' \
            --data '{}' \
            "https://tst-spot-signal.vercel.app/api/binance-signed-relay" \
            -o /tmp/legacy.json -w '%{http_code}' > /tmp/legacy.code
          cat /tmp/legacy.json
          python - <<'PY'
          import json
          code=open('/tmp/legacy.code').read().strip()
          r=json.load(open('/tmp/legacy.json'))
          assert code == '410'
          assert r.get('status') == 'LEGACY_VERCEL_SIGNER_REVOKED'
          assert r.get('fallbackAllowed') is False
          PY

      - name: Verify scanner remains confirmation-only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            "$WORKER_URL/scanner-status?nonce=$(date +%s%N)" -o /tmp/scanner.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/scanner.json'))
          assert r.get('ok') is True
          assert r.get('liveTrading') is False
          assert r.get('executorAllowed') is False
          PY
