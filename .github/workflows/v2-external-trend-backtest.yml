name: V2 External Trend Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2-external-trend-backtest.yml'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v4
        with:
          ref: bot-v2-standalone

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r v2_bot/requirements.txt

      - name: Run conservative historical test
        run: python -m v2_bot.backtest_4h_sma200

      - name: Assert Live stays disabled
        shell: bash
        run: |
          test "${V2_LIVE_TRADING:-false}" != "true"
          test "${V2_PRIVATE_ADAPTER_ENABLED:-false}" != "true"
          test "${V2_LIVE_AUTHORIZED:-false}" != "true"
          test "${V2_LIVE_ENGINE_UNLOCK:-false}" != "true"
