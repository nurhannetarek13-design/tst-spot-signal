name: Systematic Edge Scanner V3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/systematic_edge_scanner_v3.py"
      - ".github/workflows/systematic-edge-scanner-v3.yml"

permissions:
  contents: read

concurrency:
  group: systematic-edge-scanner-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy pandas
      - name: Syntax check
        run: python -m py_compile research/systematic_edge_scanner_v3.py
      - name: Run point-in-time OOS discovery
        run: PYTHONPATH=. python research/systematic_edge_scanner_v3.py
      - name: Assert research methodology and fail-closed promotion
        run: |
          python - <<'PY'
          import json
          p='validation/edges/systematic-edge-scanner-v3-latest.json'
          x=json.load(open(p))
          assert x['authorization']=='RESEARCH_ONLY'
          assert x['liveTrading'] is False
          assert x['promotionAllowed'] is False
          assert x['liveEligibleCount']==0
          assert x['methodology']['futureLeakageFix'].startswith('NO_FULL_SAMPLE_QUANTILES')
          assert x['methodology']['multipleTesting']['method']=='Benjamini-Hochberg'
          assert x['methodology']['survivorshipBias']=='UNRESOLVED_CURRENT_LIQUIDITY_UNIVERSE'
          print('systematic scanner v3 fail-closed methodology assertions passed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: systematic-edge-scanner-v3-report
          path: validation/edges/systematic-edge-scanner-v3-latest.json
          retention-days: 21
