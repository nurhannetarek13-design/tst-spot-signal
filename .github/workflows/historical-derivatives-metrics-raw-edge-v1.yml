name: Historical Derivatives Metrics Spot Raw Edge V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/historical_derivatives_metrics_raw_edge_v1.py'
      - '.github/workflows/historical-derivatives-metrics-raw-edge-v1.yml'

permissions:
  contents: read

concurrency:
  group: historical-derivatives-metrics-spot-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT, DOGEUSDT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas
      - name: Run independent derivatives-metrics vs Spot discovery/OOS scan
        run: |
          python research/historical_derivatives_metrics_raw_edge_v1.py \
            --symbol '${{ matrix.symbol }}' \
            --start 2025-01-01 \
            --split 2025-01-15 \
            --end 2025-01-28 \
            --output-dir artifacts/${{ matrix.symbol }}
      - name: Enforce research-only contract
        run: |
          python - <<'PY'
          import glob,json,os
          p=glob.glob(f"artifacts/{os.environ['PAIR']}/*.json")[0]
          d=json.load(open(p))
          assert d['engine']=='HISTORICAL_DERIVATIVES_METRICS_SPOT_RAW_EDGE_V2'
          assert d['authorization']=='RESEARCH_ONLY'
          assert d['liveTrading'] is False
          assert d['automaticPromotion'] is False
          assert d['targetMarket']=='BINANCE_SPOT'
          assert d['featureMarket']=='BINANCE_USDM_FUTURES'
          assert d['frozenDefinition']['zTail']==2.0
          assert d['frozenDefinition']['priceAlignment']=='backward <=5m'
          assert len(d['tests'])==36
          assert d['alignedSpotRows']>0
          print(json.dumps({'symbol':d['symbol'],'survivorCount':d['survivorCount'],'survivors':d['survivors']},indent=2))
          PY
        env:
          PAIR: ${{ matrix.symbol }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: derivatives-metrics-spot-v2-${{ matrix.symbol }}
          path: artifacts/${{ matrix.symbol }}
          retention-days: 14
