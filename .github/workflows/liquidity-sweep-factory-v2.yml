name: Liquidity Sweep Factory V2

on:
  workflow_dispatch:
  push:
    branches:
      - research/liquidity-sweep-factory-v2
    paths:
      - "research/liquidity_sweep_factory_v2.py"
      - ".github/workflows/liquidity-sweep-factory-v2.yml"

permissions:
  contents: read

concurrency:
  group: liquidity-sweep-factory-v2
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy pandas
      - name: Run liquidity sweep factory
        run: |
          python research/liquidity_sweep_factory_v2.py \
            --symbols BTCUSDT ETHUSDT SOLUSDT BNBUSDT LINKUSDT \
            --start 2024-09-01 \
            --end 2026-09-01 \
            --output artifacts/liquidity-sweep-v2/report.json
      - name: Enforce research-only contract
        run: |
          python - <<'PY'
          import json
          p='artifacts/liquidity-sweep-v2/report.json'
          r=json.load(open(p))
          assert r['authorization']=='RESEARCH_ONLY'
          assert r['liveTrading'] is False
          assert r['promotionGate']['canEnableLiveTrading'] is False
          assert r['selectionProtocol']['oosUsedForSelection'] is False
          assert r['selectionProtocol']['nextBarExecution'] is True
          assert r['checksumVerification'] is True
          assert r['candidateCount']==72
          assert set(r['data'])=={'BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','LINKUSDT'}
          print(json.dumps({
            'engine':r['engine'],
            'candidateCount':r['candidateCount'],
            'discoveryEligible':r['discovery']['eligible'],
            'validationPassed':r['validation']['passed'],
            'frozenFinalists':r['validation']['frozenFinalists'],
            'oosPassed':r['oos']['passed'],
            'promotionGate':r['promotionGate'],
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liquidity-sweep-factory-v2-report
          path: artifacts/liquidity-sweep-v2/report.json
          retention-days: 14
