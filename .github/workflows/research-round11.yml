name: Round 11 low-turnover momentum
on:
  push:
    paths:
      - 'scripts/research-round11.mjs'
      - 'validation/evidence-gate-round11.json'
      - '.github/workflows/research-round11.yml'
  workflow_dispatch:
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check scripts/research-round11.mjs
      - run: node scripts/research-round11.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: round11-discovery
          path: validation/round11-discovery.json
