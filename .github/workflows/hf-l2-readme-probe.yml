name: HF L2 README Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/hf_l2_readme_probe.py'
      - '.github/workflows/hf-l2-readme-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/hf_l2_readme_probe.py
