name: Probe Binance Secret Pair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-binance-secret-pair.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KEY_A: ${{ secrets.BINANCE_API_KEY }}
      KEY_B: ${{ secrets.BINANCE_KEY }}
      KEY_C: ${{ secrets.BINANCE_APIKEY }}
      SEC_A: ${{ secrets.BINANCE_API_SECRET }}
      SEC_B: ${{ secrets.BINANCE_SECRET }}
      SEC_C: ${{ secrets.BINANCE_SECRET_KEY }}
    steps:
      - name: Probe secret aliases with read-only Binance account request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,time,hmac,hashlib,urllib.parse,urllib.request,json

          keys=[
            ("BINANCE_API_KEY",os.getenv("KEY_A","")),
            ("BINANCE_KEY",os.getenv("KEY_B","")),
            ("BINANCE_APIKEY",os.getenv("KEY_C","")),
          ]
          secs=[
            ("BINANCE_API_SECRET",os.getenv("SEC_A","")),
            ("BINANCE_SECRET",os.getenv("SEC_B","")),
            ("BINANCE_SECRET_KEY",os.getenv("SEC_C","")),
          ]
          keys=[x for x in keys if x[1]]
          secs=[x for x in secs if x[1]]

          print("KEY_ALIAS_COUNT=",len(keys))
          print("SECRET_ALIAS_COUNT=",len(secs))

          hosts=[
            "https://api-gcp.binance.com",
            "https://api1.binance.com",
            "https://api2.binance.com",
            "https://api3.binance.com",
            "https://api4.binance.com",
            "https://api.binance.com",
          ]
          found=None
          attempts=[]
          for ka,key in keys:
            for sa,sec in secs:
              for base in hosts:
                params={
                  "omitZeroBalances":"true",
                  "recvWindow":"5000",
                  "timestamp":str(int(time.time()*1000)),
                }
                qs=urllib.parse.urlencode(params)
                sig=hmac.new(sec.encode(),qs.encode(),hashlib.sha256).hexdigest()
                req=urllib.request.Request(
                  base+"/api/v3/account?"+qs+"&signature="+sig,
                  headers={"X-MBX-APIKEY":key,"User-Agent":"tst-secret-probe/1.0"},
                )
                try:
                  with urllib.request.urlopen(req,timeout=10) as r:
                    data=json.loads(r.read() or b"{}")
                    ok=bool(data.get("canTrade")) and not (isinstance(data.get("code"),int) and data["code"]<0)
                    attempts.append((ka,sa,base.split("//",1)[1],r.status,data.get("code"),ok))
                    if ok:
                      found=(ka,sa,base.split("//",1)[1],data.get("canTrade"),data.get("accountType"))
                      break
                except urllib.error.HTTPError as e:
                  try: data=json.loads(e.read() or b"{}")
                  except Exception: data={}
                  attempts.append((ka,sa,base.split("//",1)[1],e.code,data.get("code"),False))
                except Exception as e:
                  attempts.append((ka,sa,base.split("//",1)[1],0,type(e).__name__,False))
              if found: break
            if found: break

          if found:
            print("PAIR_OK=true")
            print("SELECTED_KEY_ALIAS="+found[0])
            print("SELECTED_SECRET_ALIAS="+found[1])
            print("SELECTED_HOST="+found[2])
            print("CAN_TRADE="+str(found[3]).lower())
            print("ACCOUNT_TYPE="+str(found[4]))
          else:
            print("PAIR_OK=false")
            print("ATTEMPT_COUNT=",len(attempts))
            for row in attempts[:18]:
              print("ATTEMPT",row[0],row[1],row[2],"HTTP",row[3],"CODE",row[4],"OK",row[5])
          PY
