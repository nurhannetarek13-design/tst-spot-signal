name: Tardis BBO Replay Validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/tardis_bbo_replay_validator.py'
      - '.github/workflows/tardis-bbo-replay-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay L2 and compare independent bookTicker BBO
        run: |
          mkdir -p artifacts/tardis-bbo/${{ matrix.symbol }}
          python research/tardis_bbo_replay_validator.py \
            --symbol '${{ matrix.symbol }}' --date '2021-09-01' --offset 0 \
            | tee artifacts/tardis-bbo/${{ matrix.symbol }}/result.json
      - name: Enforce BBO replay gate
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json, os
          p=f"artifacts/tardis-bbo/{os.environ['SYMBOL']}/result.json"
          d=json.load(open(p))
          assert d['authorization']=='RESEARCH_ONLY', d
          assert d['liveTrading'] is False, d
          assert d['status']=='PASS', d
          assert d['eventsApplied'] > 0, d
          assert d['continuityChecks'] > 0, d
          assert d['matchedUpdateIds'] > 0, d
          assert d['mismatchCount'] == 0, d
          assert d['canonicalBboReady'] is True, d
          print(json.dumps({k:d[k] for k in ['symbol','status','snapshotId','eventsApplied','continuityChecks','bookTickerMessages','matchedUpdateIds','mismatchCount','canonicalBboReady']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tardis-bbo-replay-${{ matrix.symbol }}
          path: artifacts/tardis-bbo/${{ matrix.symbol }}
          retention-days: 14
