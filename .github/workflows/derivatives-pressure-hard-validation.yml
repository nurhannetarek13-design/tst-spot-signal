name: Derivatives Pressure Hard Validation

on:
  workflow_dispatch:
  push:
    branches: [fix/unified-execution-parity]
    paths:
      - "research/validate_derivatives_pressure_edge.py"
      - ".github/workflows/derivatives-pressure-hard-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run hard validation
        run: python research/validate_derivatives_pressure_edge.py
      - name: Enforce research-only contract
        run: |
          python - <<'PY'
          import json, pathlib
          r=json.loads(pathlib.Path('validation/edges/derivatives-pressure-hard-validation.json').read_text())
          print(json.dumps({
            'strategyId':r.get('strategyId'),
            'discovery':r.get('discovery'),
            'holdout':r.get('holdout'),
            'all':r.get('all'),
            'validation':r.get('validation'),
            'liveTrading':r.get('liveTrading')
          },indent=2))
          if r.get('liveTrading') is not False:
              raise SystemExit('liveTrading must remain false')
          if r.get('authorization') != 'RESEARCH_ONLY':
              raise SystemExit('authorization must remain RESEARCH_ONLY')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: derivatives-pressure-hard-validation
          path: validation/edges/derivatives-pressure-hard-validation.json
          if-no-files-found: error
