name: Diagnose Premium Archive Boundary

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/diagnose_premium_archive_boundary.py'
      - '.github/workflows/diagnose-premium-archive-boundary.yml'

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - run: python research/diagnose_premium_archive_boundary.py
