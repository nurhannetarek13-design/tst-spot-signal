name: Round 9 cross-sectional reversal
on:
  push:
    paths:
      - 'scripts/research-round9.mjs'
      - 'validation/evidence-gate-round9.json'
      - '.github/workflows/research-round9.yml'
  workflow_dispatch:
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check scripts/research-round9.mjs
      - run: node scripts/research-round9.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: round9-discovery
          path: validation/round9-discovery.json
