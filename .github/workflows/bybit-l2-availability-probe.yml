name: Bybit L2 Availability Probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/bybit_l2_availability_probe.py'
      - '.github/workflows/bybit-l2-availability-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/bybit_l2_availability_probe.py
