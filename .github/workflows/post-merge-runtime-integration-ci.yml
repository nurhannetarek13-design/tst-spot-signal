name: Post Merge Runtime Integration CI
on:
  pull_request:
    paths:
      - 'freqtrade/front_proxy.py'
      - 'freqtrade/production_runtime_guard.py'
      - 'freqtrade/deep_readiness_runtime.py'
      - 'tests/test_post_merge_runtime_integration.py'
      - '.github/workflows/post-merge-runtime-integration-ci.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m py_compile freqtrade/front_proxy.py freqtrade/production_runtime_guard.py freqtrade/deep_readiness_runtime.py
      - run: pip install pytest
      - run: TST_RUNTIME_HARDENING_DIR=/tmp/runtime pytest -q tests/test_post_merge_runtime_integration.py
