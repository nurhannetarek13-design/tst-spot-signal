name: HF L2 Schema Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/hf_l2_schema_probe.py'
      - '.github/workflows/hf-l2-schema-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyarrow
      - name: Download and inspect SOL July full-L2 files
        run: python research/hf_l2_schema_probe.py | tee hf_l2_schema.json
      - uses: actions/upload-artifact@v4
        with:
          name: hf-l2-schema-probe
          path: hf_l2_schema.json
          retention-days: 7
