name: Kaggle L2 Quality Audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/kaggle_l2_quality.py'
      - '.github/workflows/kaggle-l2-quality.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/kaggle_l2_quality.py
