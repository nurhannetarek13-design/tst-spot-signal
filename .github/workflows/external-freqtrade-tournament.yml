name: External Freqtrade Strategy Tournament

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/freqtrade_external_tournament.py"
      - ".github/workflows/external-freqtrade-tournament.yml"

permissions:
  contents: read

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FT_IMAGE: freqtradeorg/freqtrade:stable
    steps:
      - uses: actions/checkout@v4

      - name: Pull Freqtrade
        run: docker pull "$FT_IMAGE"

      - name: Fetch external strategy packs
        run: |
          set -eux
          mkdir -p external tournament/user_data/strategies tournament/user_data/results
          git clone --depth=1 https://github.com/freqtrade/freqtrade-strategies.git external/official
          git clone --depth=1 https://github.com/iterativv/NostalgiaForInfinity.git external/nfi
          git clone --depth=1 --branch development https://github.com/Rikj000/MoniGoMani.git external/mgm || true

      - name: Build safe Spot candidate pool
        run: |
          python - <<'PY'
          import pathlib,re,shutil,json
          roots=[('official',pathlib.Path('external/official')),('nfi',pathlib.Path('external/nfi')),('mgm',pathlib.Path('external/mgm'))]
          out=pathlib.Path('tournament/user_data/strategies'); out.mkdir(parents=True,exist_ok=True)
          manifest=[]; rejected=[]; seen=set()
          class_re=re.compile(r'class\s+([A-Za-z_]\w*)\s*\([^\n)]*IStrategy[^\n)]*\)')
          for src,root in roots:
              if not root.exists(): continue
              for p in root.rglob('*.py'):
                  try: text=p.read_text(errors='ignore')
                  except Exception: continue
                  classes=class_re.findall(text)
                  if not classes: continue
                  reasons=[]
                  if re.search(r'\bcan_short\s*=\s*True\b',text): reasons.append('can_short')
                  if re.search(r'\bposition_adjustment_enable\s*=\s*True\b',text): reasons.append('position_adjustment/DCA')
                  if reasons:
                      rejected.append({'source':src,'file':str(p),'classes':classes,'reasons':reasons}); continue
                  for cls in classes:
                      key=(src,cls)
                      if key in seen: continue
                      seen.add(key)
                      dest=out/f'{src}__{p.name}'
                      # avoid basename collision inside same source
                      n=1
                      while dest.exists():
                          dest=out/f'{src}__{p.stem}_{n}.py'; n+=1
                      shutil.copy2(p,dest)
                      manifest.append({'source':src,'strategy':cls,'file':dest.name,'origin':str(p)})
          pathlib.Path('tournament/candidates.json').write_text(json.dumps(manifest,indent=2))
          pathlib.Path('tournament/static_rejections.json').write_text(json.dumps(rejected,indent=2))
          print('candidates',len(manifest),'static_rejections',len(rejected))
          print('\n'.join(f"{x['source']}::{x['strategy']}::{x['file']}" for x in manifest))
          PY

      - name: Create research config
        run: |
          cat > tournament/user_data/config.json <<'JSON'
          {
            "$schema":"https://schema.freqtrade.io/schema.json",
            "bot_name":"External Strategy Tournament",
            "dry_run":true,
            "dry_run_wallet":1000,
            "trading_mode":"spot",
            "margin_mode":"",
            "max_open_trades":3,
            "stake_currency":"USDT",
            "stake_amount":100,
            "tradable_balance_ratio":0.99,
            "exchange":{
              "name":"binance",
              "key":"",
              "secret":"",
              "ccxt_config":{"enableRateLimit":true,"options":{"defaultType":"spot"}},
              "ccxt_async_config":{"enableRateLimit":true,"options":{"defaultType":"spot"}},
              "pair_whitelist":["BTC/USDT","ETH/USDT","SOL/USDT"],
              "pair_blacklist":[]
            },
            "pairlists":[{"method":"StaticPairList"}],
            "entry_pricing":{"price_side":"same","use_order_book":false},
            "exit_pricing":{"price_side":"same","use_order_book":false},
            "order_types":{"entry":"limit","exit":"limit","emergency_exit":"market","force_entry":"market","force_exit":"market","stoploss":"market","stoploss_on_exchange":false}
          }
          JSON

      - name: Download common Binance Spot data - 120d
        run: |
          docker run --rm \
            -v "$PWD/tournament/user_data:/freqtrade/user_data" \
            "$FT_IMAGE" download-data \
            --config /freqtrade/user_data/config.json \
            --pairs BTC/USDT ETH/USDT SOL/USDT \
            --timeframes 5m 15m 30m 1h 2h 4h 6h 12h 1d \
            --days 120

      - name: Load screen and backtest candidates
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,re,os,time
          cands=json.loads(pathlib.Path('tournament/candidates.json').read_text())
          results=pathlib.Path('tournament/user_data/results'); results.mkdir(parents=True,exist_ok=True)
          # Keep initial tournament bounded; official gets broad coverage, NFI latest variants, MGM if loadable.
          official=[x for x in cands if x['source']=='official']
          nfi=[x for x in cands if x['source']=='nfi'][-4:]
          mgm=[x for x in cands if x['source']=='mgm'][:4]
          pool=official+nfi+mgm
          print('backtest_pool',len(pool),'official',len(official),'nfi',len(nfi),'mgm',len(mgm))
          for i,x in enumerate(pool,1):
              name=x['strategy']; src=x['source']; safe=re.sub(r'[^A-Za-z0-9_.-]+','_',f'{src}__{name}')
              out=f'/freqtrade/user_data/results/{safe}.json'
              base=['docker','run','--rm','-v',f"{os.getcwd()}/tournament/user_data:/freqtrade/user_data",os.environ['FT_IMAGE']]
              load=base+['list-strategies','--strategy-path','/freqtrade/user_data/strategies','--recursive-strategy-search']
              try:
                  lp=subprocess.run(load,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=90)
                  loaded=(lp.returncode==0 and re.search(rf'\b{re.escape(name)}\b',lp.stdout))
              except Exception as e:
                  loaded=False; lp=type('R',(),{'stdout':str(e),'returncode':124})()
              meta={'strategy':name,'source':src,'file':x['file'],'status':'failed','reason':'load_failed'}
              if loaded:
                  cmd=base+['backtesting','--config','/freqtrade/user_data/config.json','--strategy',name,'--strategy-path','/freqtrade/user_data/strategies','--timerange','-120d','--fee','0.001','--export','trades','--export-filename',out]
                  try:
                      r=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=300)
                      pathlib.Path(f'tournament/user_data/results/{safe}.log').write_text(r.stdout[-120000:])
                      host=pathlib.Path(f'tournament/user_data/results/{safe}.json')
                      if r.returncode==0 and host.exists():
                          meta.update(status='ok',reason='',result_file=host.name)
                      else:
                          meta['reason']=f'backtest_exit_{r.returncode}'
                  except subprocess.TimeoutExpired as e:
                      meta['reason']='backtest_timeout_300s'
                      pathlib.Path(f'tournament/user_data/results/{safe}.log').write_text((e.stdout or '') if isinstance(e.stdout,str) else '')
                  except Exception as e:
                      meta['reason']=f'backtest_exception:{type(e).__name__}:{e}'
              else:
                  pathlib.Path(f'tournament/user_data/results/{safe}.load.log').write_text(lp.stdout[-50000:])
              pathlib.Path(f'tournament/user_data/results/{safe}.meta.json').write_text(json.dumps(meta,indent=2))
              print(i,'/',len(pool),src,name,meta['status'],meta['reason'])
          PY

      - name: Rank tournament
        run: |
          python research/freqtrade_external_tournament.py tournament/user_data/results tournament/external-freqtrade-tournament-report.json | tee tournament/summary.log
          cat tournament/external-freqtrade-tournament-report.json

      - name: Upload tournament artifacts
        uses: actions/upload-artifact@v4
        with:
          name: external-freqtrade-tournament
          path: |
            tournament/external-freqtrade-tournament-report.json
            tournament/candidates.json
            tournament/static_rejections.json
            tournament/summary.log
            tournament/user_data/results/*.meta.json
            tournament/user_data/results/*.log
          retention-days: 14
