name: Round 19 ten-hybrid tournament
on:
  push:
    paths:
      - 'scripts/research-round19.mjs'
      - 'validation/evidence-gate-round19.json'
      - '.github/workflows/research-round19.yml'
  workflow_dispatch:
jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/research-round19.mjs
      - run: node scripts/research-round19.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: round19-tournament
          path: validation/round19-tournament.json
          if-no-files-found: error
