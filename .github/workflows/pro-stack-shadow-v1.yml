name: Pro Stack Shadow V1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - research/pro_stack_feature_store.py
      - research/pro_stack_edge_model.py
      - research/pro_stack_shadow_trader.py
      - .github/workflows/pro-stack-shadow-v1.yml
permissions: {contents: read}
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy pandas
      - run: python -m py_compile research/pro_stack_feature_store.py research/pro_stack_edge_model.py research/pro_stack_shadow_trader.py
      - run: python research/pro_stack_feature_store.py
      - run: python research/pro_stack_edge_model.py
      - run: python research/pro_stack_shadow_trader.py
      - name: Enforce shadow-only contract
        run: |
          python - <<'PY'
          import json
          for p in ['validation/pro_stack/feature_store.json','validation/pro_stack/edge_scores.json','validation/pro_stack/shadow_decisions.json']:
              x=json.load(open(p)); assert x['authorization']=='RESEARCH_ONLY'; assert x['liveTrading'] is False
          y=json.load(open('validation/pro_stack/shadow_decisions.json'))
          assert y['maxDailyLossUSDT']==2.0 and y['maxOpenPositions']==3
          print(json.dumps(y,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pro-stack-shadow-v1
          path: validation/pro_stack/*.json
          retention-days: 14
