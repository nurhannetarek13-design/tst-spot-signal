name: Reversal edge validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/backtest_reversal_edges.py'
      - '.github/workflows/reversal-edge-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen Binance Spot reversal backtest
        run: python scripts/backtest_reversal_edges.py
      - name: Print validation summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('validation/reversal/latest.json')
          r = json.loads(p.read_text())
          print(json.dumps({
            'base_all': r['base']['all'],
            'base_by_strategy': r['base']['byStrategy'],
            'symbol_holdout': r['base']['symbolHoldout'],
            'chronological_oos': r['base']['chronologicalOOS'],
            'positive_folds': r['base']['positiveFolds'],
            'stress_all': r['stress']['all'],
            'gate': r['gate'],
          }, indent=2))
          PY
      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: reversal-validation
          path: validation/reversal/
          retention-days: 14
