name: Reversal edge validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/backtest_reversal_edges.py'
      - '.github/workflows/reversal-edge-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen Binance Spot reversal backtest
        run: python scripts/backtest_reversal_edges.py
      - name: Save latest validation to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/reversal/latest.json validation/reversal/latest.md
          if git diff --cached --quiet; then
            echo 'No validation changes to commit.'
          else
            git commit -m 'Update reversal historical validation'
            git push
          fi
      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: reversal-validation
          path: validation/reversal/
