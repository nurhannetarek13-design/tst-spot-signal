name: Nautilus Execution Validator
# validates the latest VectorBT-selected candidate

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Public Edge Lab"]
    types: [completed]
  schedule:
    - cron: "50 3 * * *"
  push:
    branches: [main]
    paths:
      - "validation/fusion/candidate-manifest.json"
      - "research/nautilus_validator.py"
      - ".github/workflows/nautilus-validator.yml"

permissions:
  contents: write

concurrency:
  group: nautilus-validator
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NautilusTrader
        run: pip install --disable-pip-version-check nautilus_trader pandas numpy

      - name: Run event-driven execution validation
        run: python research/nautilus_validator.py

      - name: Commit Nautilus snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/fusion/nautilus-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Update unified Nautilus candidate validation"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 2))
          done
          exit 1
