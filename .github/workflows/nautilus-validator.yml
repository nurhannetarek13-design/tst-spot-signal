name: Nautilus Execution Validator
# validates the latest VectorBT-selected candidate

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Public Edge Lab"]
    types: [completed]
  schedule:
    - cron: "50 3 * * *"
  push:
    branches: [main]
    paths:
      - "validation/fusion/candidate-manifest.json"
      - "research/nautilus_validator.py"
      - ".github/workflows/nautilus-validator.yml"

permissions:
  contents: write

concurrency:
  group: nautilus-validator
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read candidate presence
        run: |
          python - <<'PY'
          import json, pathlib, os, datetime
          m=json.loads(pathlib.Path("validation/fusion/candidate-manifest.json").read_text())
          has=bool(m.get("candidateFingerprint"))
          with open(os.environ["GITHUB_ENV"],"a") as f: f.write("HAS_CANDIDATE="+str(has).lower()+"\n")
          if not has:
              out={"engine":"NAUTILUS_TRADER","strategyId":"TST_CANDIDATE_NAUTILUS_VALIDATOR_V1","status":"NO_CANDIDATE","pass":False,"candidateId":None,"candidateFingerprint":None,"authorization":"RESEARCH_ONLY","liveTrading":False,"generatedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),"notes":"No unified candidate; Nautilus install and execution validation skipped."}
              pathlib.Path("validation/fusion/nautilus-latest.json").write_text(json.dumps(out,indent=2))
          PY

      - name: Install NautilusTrader
        if: env.HAS_CANDIDATE == 'true'
        run: pip install --disable-pip-version-check nautilus_trader pandas numpy

      - name: Run event-driven execution validation
        if: env.HAS_CANDIDATE == 'true'
        run: python research/nautilus_validator.py

      - name: Commit Nautilus snapshot safely
        run: |
          cp validation/fusion/nautilus-latest.json /tmp/nautilus-latest.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$(dirname validation/fusion/nautilus-latest.json)"
            cp /tmp/nautilus-latest.json validation/fusion/nautilus-latest.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add validation/fusion/nautilus-latest.json
            git diff --cached --quiet && exit 0
            git commit -m "Update unified Nautilus candidate validation [skip ci]"
            git push origin HEAD:main && exit 0
            sleep $((i * 2))
          done
          exit 1
