name: Verify Supabase V2 Replay Protection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-supabase-v2-replay.yml"
      - "src/supabase-live-client.js"
      - "src/ops-supervisor.js"
      - "supabase/functions/tst-binance-relay/**"

permissions:
  contents: read

env:
  WORKER_URL: https://tst-spot-signal.nurhanne-tarek13.workers.dev

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove Supabase relay rejects identical nonce replay
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 35 -X POST \
            -H 'cache-control: no-store' \
            "$WORKER_URL/supabase-v2-auth-selftest?nonce=$(date +%s%N)" \
            -o /tmp/replay.json
          cat /tmp/replay.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/replay.json'))
          assert r.get('ok') is True
          assert r.get('status') == 'SUPABASE_RELAY_AUTH_SELFTEST_PASS'
          assert r.get('financialAction') is False
          assert r.get('replay',{}).get('status') == 'RELAY_REPLAY_BLOCKED'
          assert r.get('replay',{}).get('httpStatus') == 401
          assert r.get('stale',{}).get('status') == 'RELAY_AUTH_STALE'
          assert r.get('stale',{}).get('httpStatus') == 401
          assert r.get('noSecretValuesExposed') is True
          PY
