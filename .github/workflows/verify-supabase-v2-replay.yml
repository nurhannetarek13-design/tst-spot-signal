name: Verify Supabase V2 Replay Protection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-supabase-v2-replay.yml"
      - "src/supabase-live-client.js"
      - "src/ops-supervisor.js"
      - "supabase/functions/tst-binance-relay/**"

permissions:
  contents: read

env:
  WORKER_URL: https://tst-spot-signal.nurhanne-tarek13.workers.dev

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove Supabase relay rejects identical nonce replay
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors --max-time 60 -X POST \
            -H 'cache-control: no-store' \
            "$WORKER_URL/supabase-v2-auth-selftest?nonce=$(date +%s%N)" \
            -o /tmp/replay.json
          cat /tmp/replay.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/replay.json'))
          assert r.get('ok') is True
          assert r.get('status') == 'SUPABASE_RELAY_AUTH_SELFTEST_PASS'
          assert r.get('financialAction') is False
          assert r.get('replay',{}).get('status') == 'RELAY_REPLAY_BLOCKED'
          assert r.get('replay',{}).get('httpStatus') == 401
          assert r.get('stale',{}).get('status') == 'RELAY_AUTH_STALE'
          assert r.get('stale',{}).get('httpStatus') == 401
          assert r.get('noSecretValuesExposed') is True
          PY

      - name: Verify Supabase Vault Binance signer health
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 35             -H 'cache-control: no-store'             "$WORKER_URL/binance-api-key-only-probe?nonce=$(date +%s%N)"             -o /tmp/api-key.json || true
          cat /tmp/api-key.json 2>/dev/null || true
          python - <<'PY'
          import json
          r=json.load(open('/tmp/api-key.json'))
          assert r.get('financialAction') is False
          assert r.get('noSecretValuesExposed') is True
          print("SUPABASE_VAULT_SIGNER_OK=",r.get('ok'))
          print("SUPABASE_VAULT_SIGNER_STATUS=",r.get('status'))
          print("SUPABASE_PRIVATE_KEY_PRESENT=",r.get('privateKeyPresent'))
          print("SUPABASE_API_KEY_PRESENT=",r.get('apiKeyPresent'))
          print("SUPABASE_API_KEY_SOURCE=",r.get('apiKeySource'))
          assert r.get('privateKeyPresent') is True
          PY
