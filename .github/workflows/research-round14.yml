name: Round 14 low-volatility factor
on:
  push:
    paths:
      - 'scripts/research-round14.mjs'
      - 'validation/evidence-gate-round14.json'
      - '.github/workflows/research-round14.yml'
  workflow_dispatch:
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check scripts/research-round14.mjs
      - run: node scripts/research-round14.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: round14-discovery
          path: validation/round14-discovery.json
