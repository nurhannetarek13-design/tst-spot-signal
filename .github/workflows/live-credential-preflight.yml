name: Live Credential Preflight — No Orders

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  WORKER_URL: https://tst-spot-signal.nurhanne-tarek13.workers.dev

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify Make V2 execution architecture
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20             -H 'cache-control: no-store'             "$WORKER_URL/runtime-check?nonce=$(date +%s%N)" -o /tmp/runtime.json
          cat /tmp/runtime.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/runtime.json'))
          assert r.get('ok') is True
          assert r.get('credentialMode') == 'LIVE'
          assert r.get('executionRoute') == 'CLOUDFLARE_HMAC_MAKE'
          assert r.get('binanceCredentialOwner') == 'MAKE_CONNECTION'
          assert r.get('cloudflareBinanceCredentialsRequired') is False
          assert r.get('executorConfigured') is True
          assert r.get('telegramConfigured') is True
          assert r.get('autoBuy') is False
          assert r.get('noSecretValuesExposed') is True
          PY

      - name: Verify BUY and OCO V2 read-only path
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 35 -X POST             -H 'content-type: application/json'             --data '{}'             "$WORKER_URL/make-v2-dry-probe?nonce=$(date +%s%N)" -o /tmp/probe.json
          cat /tmp/probe.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/probe.json'))
          assert r.get('ok') is True
          assert r.get('routeVersion') == 'v2'
          assert r.get('financialAction') is False
          assert r.get('buyVerified') is True
          assert r.get('ocoVerified') is True
          assert r.get('healthRefreshed') is True
          assert r.get('buy',{}).get('routeId') == 'BUY_V2'
          assert r.get('oco',{}).get('routeId') == 'OCO_V2'
          PY

      - name: Verify manual-live readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 25             -H 'cache-control: no-store'             "$WORKER_URL/live-readiness?nonce=$(date +%s%N)" -o /tmp/ready.json
          curl --fail --silent --show-error --max-time 25             -H 'cache-control: no-store'             "$WORKER_URL/go-no-go?nonce=$(date +%s%N)" -o /tmp/gate.json
          cat /tmp/ready.json
          cat /tmp/gate.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/ready.json'))
          g=json.load(open('/tmp/gate.json'))
          assert r.get('ok') is True
          assert r.get('status') == 'MANUAL_LIVE_E2E_ARMED'
          assert r.get('infrastructureReady') is True
          assert r.get('executionReady') is True
          assert r.get('blocker') is None
          assert r.get('liveExecutionEnabled') is True
          assert r.get('e2eArmed') is True
          assert r.get('autonomousExecution') is False
          assert r.get('manualOnly') is True
          assert r.get('userConfirmationRequired') is True
          assert r.get('autoBuy') is False
          assert r.get('binanceCredentialOwner') == 'MAKE_CONNECTION'
          assert r.get('cloudflareBinanceCredentialsRequired') is False
          assert g.get('ok') is True
          assert g.get('go') is True
          assert g.get('failed') == []
          assert g.get('manualExecutionAllowed') is True
          assert g.get('e2eArmed') is True
          assert g.get('manualE2EComplete') is False
          assert g.get('activationAllowed') is False
          assert 'LIVE_EXECUTION_ENABLED' not in g.get('activationFailed', [])
          assert 'AUTONOMOUS_ENABLED' in g.get('activationFailed', [])
          PY

      - name: Verify legacy signer is unreachable
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --max-time 20             -X POST -H 'content-type: application/json' --data '{}'             -o /tmp/legacy.json -w '%{http_code}'             "https://tst-spot-signal.vercel.app/api/binance-signed-relay")
          cat /tmp/legacy.json
          test "$code" = "410"
          python - <<'PY'
          import json
          r=json.load(open('/tmp/legacy.json'))
          assert r.get('status') == 'LEGACY_VERCEL_SIGNER_REVOKED'
          assert r.get('fallbackAllowed') is False
          PY

      - name: Verify scanner remains non-autonomous
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30             "$WORKER_URL/scanner-status?nonce=$(date +%s%N)" -o /tmp/scanner.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/scanner.json'))
          assert r.get('ok') is True
          assert r.get('liveTrading') is False
          assert r.get('executorAllowed') is False
          PY

      - name: Confirm no order was placed by this preflight
        shell: bash
        run: |
          echo "READ-ONLY MAKE V2 PREFLIGHT COMPLETE — no financial order endpoint is called by this workflow."
