name: Live Credential Preflight — No Orders

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  WORKER_URL: https://tst-spot-signal.nurhanne-tarek13.workers.dev

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Vercel-only execution architecture
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20             -H 'cache-control: no-store'             "$WORKER_URL/runtime-check?nonce=$(date +%s%N)" -o /tmp/runtime.json
          cat /tmp/runtime.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/runtime.json'))
          assert r.get('ok') is True
          assert r.get('credentialMode') == 'LIVE'
          assert r.get('executionRoute') == 'CLOUDFLARE_SIGNED_VERCEL_TRANSPORT'
          assert r.get('binanceCredentialOwner') == 'VERCEL_ONLY'
          assert r.get('cloudflareBinanceCredentialsRequired') is False
          assert r.get('telegramConfigured') is True
          assert r.get('autoBuy') is False
          assert r.get('noSecretValuesExposed') is True
          PY

      - name: Verify Binance account and Spot trading permission
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 25             -H 'cache-control: no-store'             "$WORKER_URL/balance-refresh?nonce=$(date +%s%N)" -o /tmp/account.json
          cat /tmp/account.json
          python - <<'PY'
          import json,sys
          r=json.load(open('/tmp/account.json'))
          if not (r.get('ok') is True and r.get('canTrade') is True and r.get('accountSafetyOk') is True):
              print("CREDENTIAL_PREFLIGHT_BLOCKED:", r.get('diagnosticCode'), r.get('accountSafetyReasons'))
              sys.exit(1)
          assert r.get('accountSafetyReasons') == []
          assert r.get('credentialMode') == 'LIVE'
          assert r.get('executionRoute') == 'CLOUDFLARE_SIGNED_VERCEL_TRANSPORT'
          assert r.get('noBalanceValuesExposed') is True
          PY

      - name: Verify live execution safety gates
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 25             -H 'cache-control: no-store'             "$WORKER_URL/live-readiness?nonce=$(date +%s%N)" -o /tmp/ready.json
          cat /tmp/ready.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/ready.json'))
          assert r.get('ok') is True
          assert r.get('infrastructureReady') is True
          assert r.get('executionReady') is True
          assert r.get('accountSafetyOk') is True
          assert r.get('accountSafetyReasons') == []
          assert r.get('blocker') is None
          assert r.get('railwayDependency') is False
          assert r.get('binanceCredentialOwner') == 'VERCEL_ONLY'
          assert r.get('cloudflareBinanceCredentialsRequired') is False
          assert r.get('userConfirmationRequired') is True
          assert r.get('autoBuy') is False
          assert abs(float(r.get('maxRiskUSDT')) - 0.20) < 1e-9
          assert abs(float(r.get('maxBuyUSDT')) - 10.0) < 1e-9
          assert r.get('noBalanceValuesExposed') is True
          assert r.get('noSecretValuesExposed') is True
          PY

      - name: Verify Telegram callback ownership
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 -X POST             "$WORKER_URL/telegram-webhook-check?nonce=$(date +%s%N)" -o /tmp/tg.json
          cat /tmp/tg.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/tg.json'))
          assert r.get('ok') is True
          assert r.get('status') == 'TELEGRAM_WEBHOOK_OK'
          assert r.get('urlMatches') is True
          assert r.get('callbackQueryAllowed') is True
          PY

      - name: Verify scanner remains non-autonomous
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30             "$WORKER_URL/scanner-status?nonce=$(date +%s%N)" -o /tmp/scanner.json
          cat /tmp/scanner.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/scanner.json'))
          assert r.get('ok') is True
          assert r.get('liveTrading') is False
          assert r.get('executorAllowed') is False
          PY

      - name: Confirm no order was placed by this preflight
        shell: bash
        run: |
          echo "READ-ONLY PREFLIGHT COMPLETE — this workflow contains no order endpoint calls."
