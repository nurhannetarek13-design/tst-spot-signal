name: Nautilus Derivatives Pressure Smoke

on:
  push:
    branches:
      - fix/unified-execution-parity
    paths:
      - 'research/nautilus_derivatives_pressure_smoke.py'
      - '.github/workflows/nautilus-derivatives-pressure-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NautilusTrader 2.x
        run: python -m pip install --upgrade pip && python -m pip install --pre 'nautilus_trader>=2.0.0rc0'
      - name: Run Nautilus smoke harness
        run: python research/nautilus_derivatives_pressure_smoke.py
      - name: Enforce research-only contract
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('validation/engines/nautilus-derivatives-pressure-smoke.json')
          r=json.loads(p.read_text())
          c=r['contract']
          assert r['engineBootstrapPassed'] is True
          assert c['liveTrading'] is False
          assert c['authorization'] == 'RESEARCH_ONLY'
          assert c['venue'] == 'BINANCE'
          assert c['accountType'] == 'CASH'
          assert c['execution']['maxConcurrentPositions'] == 3
          assert c['execution']['canonicalHoldHours'] == 48
          print(json.dumps(r, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nautilus-derivatives-pressure-smoke
          path: validation/engines/nautilus-derivatives-pressure-smoke.json
          if-no-files-found: error
