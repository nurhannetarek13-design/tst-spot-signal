name: Gate B Derivatives Ablation V1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - research/gate_b_derivatives_ablation_v1.py
      - research/binance_vision_historical_feature_layer.py
      - .github/workflows/gate-b-derivatives-ablation-v1.yml
permissions: {contents: read}
jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy pandas pyarrow scikit-learn
      - name: Run isolated Gate B ablation
        run: PYTHONPATH=. python research/gate_b_derivatives_ablation_v1.py --days 30
      - name: Enforce isolation and research-only contract
        run: |
          python - <<'PY'
          import json
          x=json.load(open('validation/edges/gate-b-derivatives-ablation-v1.json'))
          assert x['authorization']=='RESEARCH_ONLY' and x['liveTrading'] is False
          assert x['mutatesGateA'] is False
          print(json.dumps({'base':x['base'],'extended':x['extended'],'improvement':x['improvement'],'researchGatePass':x['researchGatePass'],'next':x['next']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gate-b-derivatives-ablation-v1
          path: validation/edges/gate-b-derivatives-ablation-v1.json
          retention-days: 14
