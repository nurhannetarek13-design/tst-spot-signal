name: L2 Sequence Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/l2_sequence_audit.py'
      - '.github/workflows/l2-sequence-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyarrow
      - run: python research/l2_sequence_audit.py
