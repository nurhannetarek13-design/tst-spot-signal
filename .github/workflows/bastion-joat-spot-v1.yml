name: Bastion JOAT Spot V1

on:
  workflow_dispatch:
  push:
    paths:
      - 'freqtrade/user_data/strategies/BastionJOATSpotV1.py'
      - 'freqtrade/user_data/strategies/BastionJOATSpotV2.py'
      - 'research/candidates/BastionJOAT_source_review.md'
      - '.github/workflows/bastion-joat-spot-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile freqtrade/user_data/strategies/BastionJOATSpotV1.py freqtrade/user_data/strategies/BastionJOATSpotV2.py
      - name: Enforce Spot-only research contract
        run: |
          python - <<'PY'
          import pathlib
          base=pathlib.Path('freqtrade/user_data/strategies/BastionJOATSpotV1.py').read_text()
          exits=pathlib.Path('freqtrade/user_data/strategies/BastionJOATSpotV2.py').read_text()
          both=base+'\n'+exits
          assert 'can_short = False' in base
          assert 'timeframe = "15m"' in base
          assert 'JOAT_LONG' in base
          assert 'strategy.short' not in both
          assert 'enter_short' not in both
          assert 'position_adjustment_enable' not in both
          assert 'adjust_trade_position' not in both
          required=['regime_bull','struct_trend','mom_bull','cvd_bull','bull_pattern','bull_disp','session_ok','is_squeeze','atr']
          assert not [x for x in required if x not in base]
          assert 'use_custom_stoploss = True' in exits
          assert 'stoploss_from_absolute' in exits
          assert 'joat_2r_tp' in exits
          assert 'joat_eod_close' in exits
          print({'candidate':'BastionJOATSpotV2','spotOnly':True,'shorts':False,'dca':False,'atrStop':True,'twoRTarget':True,'atrTrail':True,'liveReady':False})
          PY
      - name: Load strategy in current Freqtrade container
        run: |
          docker run --rm \
            -v "$PWD/freqtrade/user_data:/freqtrade/user_data" \
            freqtradeorg/freqtrade:stable \
            list-strategies --strategy-path /freqtrade/user_data/strategies | tee /tmp/strategies.txt
          grep -q 'BastionJOATSpotV2' /tmp/strategies.txt
      - name: License/source intake check
        run: |
          grep -q 'MPL-2.0' research/candidates/BastionJOAT_source_review.md
          grep -q 'ACCEPT_SOURCE_FOR_PORTING_ONLY' research/candidates/BastionJOAT_source_review.md
