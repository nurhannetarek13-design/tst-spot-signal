name: External NFI validation v3

on:
  workflow_dispatch:
  push:
    branches: [fix/unified-execution-parity]
    paths:
      - '.github/workflows/external-nfi-validation-v3.yml'

permissions:
  contents: read

jobs:
  nfi-x7-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Prepare pinned NFI runtime
        run: |
          set -euo pipefail
          git clone https://github.com/iterativv/NostalgiaForInfinity.git external/NostalgiaForInfinity
          git -C external/NostalgiaForInfinity checkout da50440bd5f8a829af9dc768822fa31cfe4b7867
          cp freqtrade/user_data/config-external-pack.json external/NostalgiaForInfinity/user_data/tst-config.json
          mkdir -p validation/external-nfi-v3 external/NostalgiaForInfinity/user_data/backtest_results
          git -C external/NostalgiaForInfinity rev-parse HEAD | tee validation/external-nfi-v3/upstream-sha.txt
          sha256sum external/NostalgiaForInfinity/NostalgiaForInfinityX7.py | tee validation/external-nfi-v3/strategy-sha256.txt
          cat > external/NostalgiaForInfinity/run-pinned.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          mounts=()
          for f in NostalgiaForInfinityX*.py; do mounts+=( -v "$PWD/$f:/freqtrade/$f:ro" ); done
          exec docker run --rm \
            "${mounts[@]}" \
            -v "$PWD/legacy:/freqtrade/legacy:ro" \
            -v "$PWD/user_data:/freqtrade/user_data" \
            nfi-x7-pinned "$@"
          SH
          chmod +x external/NostalgiaForInfinity/run-pinned.sh

      - name: Build official NFI image
        working-directory: external/NostalgiaForInfinity
        run: docker build -t nfi-x7-pinned -f docker/Dockerfile.custom .

      - name: Download Binance Spot data
        working-directory: external/NostalgiaForInfinity
        run: |
          set -euo pipefail
          ./run-pinned.sh download-data \
            --config /freqtrade/user_data/tst-config.json \
            --pairs BTC/USDT ETH/USDT SOL/USDT \
            --timeframes 1m 5m 15m 1h 4h 1d \
            --timerange 20250101-20260905

      - name: Baseline backtest
        working-directory: external/NostalgiaForInfinity
        run: |
          set +e
          ./run-pinned.sh backtesting --config /freqtrade/user_data/tst-config.json \
            --strategy NostalgiaForInfinityX7 --strategy-path /freqtrade \
            --timerange 20250101-20260905 --fee 0.001 --export trades \
            --export-filename /freqtrade/user_data/backtest_results/nfi-base.json \
            > ../../validation/external-nfi-v3/base.log 2>&1
          echo $? > ../../validation/external-nfi-v3/base-exit-code.txt
          tail -n 160 ../../validation/external-nfi-v3/base.log
          exit 0

      - name: OOS backtest
        working-directory: external/NostalgiaForInfinity
        run: |
          set +e
          ./run-pinned.sh backtesting --config /freqtrade/user_data/tst-config.json \
            --strategy NostalgiaForInfinityX7 --strategy-path /freqtrade \
            --timerange 20260101-20260905 --fee 0.001 --export trades \
            --export-filename /freqtrade/user_data/backtest_results/nfi-oos.json \
            > ../../validation/external-nfi-v3/oos.log 2>&1
          echo $? > ../../validation/external-nfi-v3/oos-exit-code.txt
          tail -n 160 ../../validation/external-nfi-v3/oos.log
          exit 0

      - name: Stress backtest 2x fee
        working-directory: external/NostalgiaForInfinity
        run: |
          set +e
          ./run-pinned.sh backtesting --config /freqtrade/user_data/tst-config.json \
            --strategy NostalgiaForInfinityX7 --strategy-path /freqtrade \
            --timerange 20250101-20260905 --fee 0.002 --export trades \
            --export-filename /freqtrade/user_data/backtest_results/nfi-stress.json \
            > ../../validation/external-nfi-v3/stress.log 2>&1
          echo $? > ../../validation/external-nfi-v3/stress-exit-code.txt
          tail -n 160 ../../validation/external-nfi-v3/stress.log
          exit 0

      - name: Lookahead analysis
        working-directory: external/NostalgiaForInfinity
        run: |
          set +e
          ./run-pinned.sh lookahead-analysis --config /freqtrade/user_data/tst-config.json \
            --strategy NostalgiaForInfinityX7 --strategy-path /freqtrade \
            --timerange 20250101-20260905 --fee 0.001 \
            --minimum-trade-amount 20 --targeted-trade-amount 100 \
            > ../../validation/external-nfi-v3/lookahead.log 2>&1
          echo $? > ../../validation/external-nfi-v3/lookahead-exit-code.txt
          tail -n 120 ../../validation/external-nfi-v3/lookahead.log
          exit 0

      - name: Build gate
        run: |
          python - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('validation/external-nfi-v3')
          def code(n):
            try:return int((root/f'{n}-exit-code.txt').read_text().strip())
            except:return 999
          def parse(n):
            t=(root/f'{n}.log').read_text(errors='ignore') if (root/f'{n}.log').exists() else ''
            def g(p,typ=float):
              m=re.search(p,t,re.I)
              if not m:return None
              try:return typ(m.group(1).replace(',','').strip())
              except:return None
            tr=g(r'Total/Daily Avg Trades\s*│\s*(\d+)',int)
            if tr is None: tr=g(r'│\s*TOTAL\s*│\s*(\d+)',int)
            return {'exitCode':code(n),'trades':tr,'profitFactor':g(r'Profit factor\s*│\s*([-+0-9.]+)'),'absoluteProfit':g(r'Absolute profit\s*│\s*([-+0-9.]+)'),'maxDrawdownPct':g(r'Max % of account underwater\s*│\s*([-+0-9.]+)')}
          b,o,s=parse('base'),parse('oos'),parse('stress')
          lt=(root/'lookahead.log').read_text(errors='ignore') if (root/'lookahead.log').exists() else ''
          la={'exitCode':code('lookahead'),'biasDetected':bool(re.search(r'has bias\s*│\s*true|biased\s*[:=]\s*true',lt,re.I))}
          reasons=[]
          for n,r,minpf in [('base',b,1.15),('oos',o,1.05),('stress',s,1.00)]:
            if r['exitCode']!=0: reasons.append(f'{n}:BACKTEST_ERROR')
            if r['trades'] is None or r['trades']<20: reasons.append(f'{n}:LT_20_TRADES')
            if r['profitFactor'] is None or r['profitFactor']<minpf: reasons.append(f'{n}:PF_GATE_FAIL')
            if r['absoluteProfit'] is None or r['absoluteProfit']<=0: reasons.append(f'{n}:PROFIT_GATE_FAIL')
          if la['exitCode']!=0: reasons.append('lookahead:ANALYSIS_ERROR')
          if la['biasDetected']: reasons.append('lookahead:BIAS_DETECTED')
          out={'engine':'NFI_X7_SPOT_GATE_V3','strategy':'NostalgiaForInfinityX7','upstreamSha':(root/'upstream-sha.txt').read_text().strip(),'strategySha256':(root/'strategy-sha256.txt').read_text().split()[0],'base':b,'oos':o,'stress':s,'lookahead':la,'pass':not reasons,'status':'PASS' if not reasons else 'FAIL','authorization':'DRY_RUN_AND_SIGNAL_ONLY' if not reasons else 'RESEARCH_ONLY','liveTrading':False,'reasons':reasons}
          (root/'gate.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-nfi-validation-v3
          path: |
            validation/external-nfi-v3/**
            external/NostalgiaForInfinity/user_data/backtest_results/**

      - name: Enforce gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('validation/external-nfi-v3/gate.json'))
          if not r['pass']: raise SystemExit('NFI_GATE_FAIL: '+', '.join(r['reasons']))
          print('NFI_GATE_PASS')
          PY
