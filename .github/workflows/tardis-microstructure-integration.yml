name: Tardis Microstructure Integration

on:
  push:
    paths:
      - 'research/tardis_l2_replay.py'
      - 'research/tardis_microstructure_features.py'
      - 'research/tardis_microstructure_scan.py'
      - 'research/tardis_microstructure_range.py'
      - '.github/workflows/tardis-microstructure-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - symbol: BTCUSDT
            minutes: 10
            suffix: M0000-M0009
          - symbol: ETHUSDT
            minutes: 1
            suffix: M0000-M0000
          - symbol: SOLUSDT
            minutes: 5
            suffix: M0000-M0004
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay bounded canonical smoke window
        run: |
          mkdir -p research/results/tardis_microstructure
          python -m research.tardis_microstructure_range \
            --symbol '${{ matrix.symbol }}' \
            --date '2021-09-01' \
            --start-offset 0 \
            --minutes '${{ matrix.minutes }}' \
            --output 'research/results/tardis_microstructure/${{ matrix.symbol }}-${{ matrix.suffix }}.json' \
            --assert-ready
      - name: Enforce research-only integrity invariants
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('research/results/tardis_microstructure/${{ matrix.symbol }}-${{ matrix.suffix }}.json')
          d=json.loads(p.read_text())
          v=d['validation']
          assert d['authorization']=='RESEARCH_ONLY'
          assert d['liveTrading'] is False
          assert d['status']=='PASS'
          assert d['canonicalReplayReady'] is True
          assert v['depthIntegrity'] is True
          assert v['tickerMismatches'] <= 5
          assert v['matchRate'] >= 0.999
          assert d['summary']['featureEvents'] > 0
          assert d['summary']['sampledSeconds'] > 0
          print(json.dumps({
            'symbol': d['symbol'],
            'minutes': d['minutes'],
            'featureEvents': d['summary']['featureEvents'],
            'sampledSeconds': d['summary']['sampledSeconds'],
            'tickerComparable': v['tickerComparable'],
            'tickerExact': v['tickerExact'],
            'tickerMismatches': v['tickerMismatches'],
            'matchRate': v['matchRate'],
            'gateGEventCounts': d['gateG']['eventCounts'],
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tardis-microstructure-${{ matrix.symbol }}
          path: research/results/tardis_microstructure/${{ matrix.symbol }}-${{ matrix.suffix }}.json
          if-no-files-found: error

  aggregate:
    needs: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tardis-microstructure-*
          path: downloaded
          merge-multiple: true
      - name: Aggregate diagnostics without edge promotion
        run: |
          python - <<'PY'
          import json, pathlib
          files=sorted(pathlib.Path('downloaded').glob('*.json'))
          cells=[json.loads(p.read_text()) for p in files]
          horizons=('10','30','60')
          side_counts={side:sum(int(c['gateG']['eventCounts'][side]) for c in cells) for side in ('long','short')}
          aggregate={}
          for side in ('long','short'):
              aggregate[side]={}
              for h in horizons:
                  weighted_sum=0.0
                  positive_weight=0.0
                  n=0
                  for c in cells:
                      o=c['gateG']['outcomes'][side][h]
                      k=int(o['n'])
                      if k:
                          weighted_sum += float(o['meanDirectionalBps']) * k
                          positive_weight += float(o['hitRate']) * k
                          n += k
                  aggregate[side][h]={
                      'n': n,
                      'meanDirectionalBps': (weighted_sum/n if n else None),
                      'hitRate': (positive_weight/n if n else None),
                  }
          payload={
              'authorization':'RESEARCH_ONLY',
              'liveTrading':False,
              'purpose':'CI_INTEGRITY_SMOKE_ONLY',
              'windows':{c['symbol']:c['minutes'] for c in cells},
              'frozenDefinition': cells[0]['gateG']['eventDefinition'] if cells else None,
              'parityPolicy':{'maxTickerMismatches':5,'minTickerMatchRate':0.999},
              'cells':len(cells),
              'sideEventCounts':side_counts,
              'totalSampledSeconds':sum(int(c['summary']['sampledSeconds']) for c in cells),
              'totalFeatureEvents':sum(int(c['summary']['featureEvents']) for c in cells),
              'aggregateDiagnostics':aggregate,
              'decision':'DIAGNOSTIC_ONLY_NOT_EDGE_APPROVAL',
          }
          pathlib.Path('tardis-microstructure-aggregate.json').write_text(json.dumps(payload,indent=2,sort_keys=True))
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tardis-microstructure-aggregate
          path: tardis-microstructure-aggregate.json
          if-no-files-found: error
