name: Tardis Microstructure Integration

on:
  push:
    paths:
      - 'research/tardis_l2_replay.py'
      - 'research/tardis_microstructure_features.py'
      - 'research/tardis_microstructure_scan.py'
      - '.github/workflows/tardis-microstructure-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {symbol: BTCUSDT, slot: H00, from: '2021-09-01T00:00:00Z'}
          - {symbol: BTCUSDT, slot: H04, from: '2021-09-01T04:00:00Z'}
          - {symbol: BTCUSDT, slot: H08, from: '2021-09-01T08:00:00Z'}
          - {symbol: BTCUSDT, slot: H12, from: '2021-09-01T12:00:00Z'}
          - {symbol: BTCUSDT, slot: H16, from: '2021-09-01T16:00:00Z'}
          - {symbol: BTCUSDT, slot: H20, from: '2021-09-01T20:00:00Z'}
          - {symbol: ETHUSDT, slot: H00, from: '2021-09-01T00:00:00Z'}
          - {symbol: ETHUSDT, slot: H04, from: '2021-09-01T04:00:00Z'}
          - {symbol: ETHUSDT, slot: H08, from: '2021-09-01T08:00:00Z'}
          - {symbol: ETHUSDT, slot: H12, from: '2021-09-01T12:00:00Z'}
          - {symbol: ETHUSDT, slot: H16, from: '2021-09-01T16:00:00Z'}
          - {symbol: ETHUSDT, slot: H20, from: '2021-09-01T20:00:00Z'}
          - {symbol: SOLUSDT, slot: H00, from: '2021-09-01T00:00:00Z'}
          - {symbol: SOLUSDT, slot: H04, from: '2021-09-01T04:00:00Z'}
          - {symbol: SOLUSDT, slot: H08, from: '2021-09-01T08:00:00Z'}
          - {symbol: SOLUSDT, slot: H12, from: '2021-09-01T12:00:00Z'}
          - {symbol: SOLUSDT, slot: H16, from: '2021-09-01T16:00:00Z'}
          - {symbol: SOLUSDT, slot: H20, from: '2021-09-01T20:00:00Z'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run canonical Tardis microstructure scan
        run: |
          mkdir -p research/results/tardis_microstructure
          python -m research.tardis_microstructure_scan \
            --symbol '${{ matrix.symbol }}' \
            --date '${{ matrix.from }}' \
            --offset 0 \
            --output 'research/results/tardis_microstructure/${{ matrix.symbol }}-${{ matrix.slot }}.json' \
            --assert-ready
      - name: Enforce research-only invariants
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('research/results/tardis_microstructure/${{ matrix.symbol }}-${{ matrix.slot }}.json')
          d=json.loads(p.read_text())
          assert d['authorization']=='RESEARCH_ONLY'
          assert d['liveTrading'] is False
          assert d['status']=='PASS'
          assert d['canonicalReplayReady'] is True
          assert d['summary']['featureEvents'] > 0
          assert d['summary']['sampledSeconds'] > 0
          assert d['validation']['tickerMismatches'] == 0
          print(json.dumps({
            'symbol': d['symbol'],
            'from': d['date'],
            'featureEvents': d['summary']['featureEvents'],
            'sampledSeconds': d['summary']['sampledSeconds'],
            'tickerExact': d['validation']['tickerExact'],
            'tickerMismatches': d['validation']['tickerMismatches'],
            'gateGEventCounts': d['gateG']['eventCounts'],
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tardis-microstructure-${{ matrix.symbol }}-${{ matrix.slot }}
          path: research/results/tardis_microstructure/${{ matrix.symbol }}-${{ matrix.slot }}.json
          if-no-files-found: error

  aggregate:
    needs: integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tardis-microstructure-*
          path: downloaded
          merge-multiple: true
      - name: Aggregate frozen Gate G evidence
        run: |
          python - <<'PY'
          import json, pathlib, statistics
          files=sorted(pathlib.Path('downloaded').glob('*.json'))
          cells=[]
          for p in files:
              d=json.loads(p.read_text())
              cells.append(d)
          horizons=('10','30','60')
          aggregate={}
          total_events=0
          for side in ('long','short'):
              aggregate[side]={}
              total_events += sum(int(c['gateG']['eventCounts'][side]) for c in cells)
              for h in horizons:
                  weighted=[]
                  hits=0
                  n=0
                  for c in cells:
                      o=c['gateG']['outcomes'][side][h]
                      k=int(o['n'])
                      if k and o['meanDirectionalBps'] is not None:
                          weighted.extend([float(o['meanDirectionalBps'])]*k)
                          hits += round(float(o['hitRate'])*k)
                          n += k
                  aggregate[side][h]={
                      'n': n,
                      'meanDirectionalBpsApprox': (sum(weighted)/len(weighted) if weighted else None),
                      'hitRateApprox': (hits/n if n else None),
                  }
          payload={
              'authorization':'RESEARCH_ONLY',
              'liveTrading':False,
              'frozenDefinition': cells[0]['gateG']['eventDefinition'] if cells else None,
              'cells':len(cells),
              'totalSampledSeconds':sum(int(c['summary']['sampledSeconds']) for c in cells),
              'totalFeatureEvents':sum(int(c['summary']['featureEvents']) for c in cells),
              'totalGateGEvents':total_events,
              'informationSufficient': total_events >= 30,
              'aggregate':aggregate,
              'decision':'EVALUATE_EDGE' if total_events >= 30 else 'INSUFFICIENT_INFORMATION',
          }
          pathlib.Path('tardis-microstructure-aggregate.json').write_text(json.dumps(payload,indent=2,sort_keys=True))
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tardis-microstructure-aggregate
          path: tardis-microstructure-aggregate.json
          if-no-files-found: error
