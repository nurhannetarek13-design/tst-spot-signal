name: Tardis Microstructure Integration

on:
  push:
    paths:
      - 'research/tardis_l2_replay.py'
      - 'research/tardis_microstructure_features.py'
      - 'research/tardis_microstructure_scan.py'
      - '.github/workflows/tardis-microstructure-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {symbol: BTCUSDT, slot: M0000, offset: 0}
          - {symbol: BTCUSDT, slot: M0240, offset: 240}
          - {symbol: BTCUSDT, slot: M0480, offset: 480}
          - {symbol: BTCUSDT, slot: M0720, offset: 720}
          - {symbol: BTCUSDT, slot: M0960, offset: 960}
          - {symbol: BTCUSDT, slot: M1200, offset: 1200}
          - {symbol: ETHUSDT, slot: M0000, offset: 0}
          - {symbol: ETHUSDT, slot: M0240, offset: 240}
          - {symbol: ETHUSDT, slot: M0480, offset: 480}
          - {symbol: ETHUSDT, slot: M0720, offset: 720}
          - {symbol: ETHUSDT, slot: M0960, offset: 960}
          - {symbol: ETHUSDT, slot: M1200, offset: 1200}
          - {symbol: SOLUSDT, slot: M0000, offset: 0}
          - {symbol: SOLUSDT, slot: M0240, offset: 240}
          - {symbol: SOLUSDT, slot: M0480, offset: 480}
          - {symbol: SOLUSDT, slot: M0720, offset: 720}
          - {symbol: SOLUSDT, slot: M0960, offset: 960}
          - {symbol: SOLUSDT, slot: M1200, offset: 1200}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run canonical Tardis microstructure scan
        run: |
          mkdir -p research/results/tardis_microstructure
          python -m research.tardis_microstructure_scan \
            --symbol '${{ matrix.symbol }}' \
            --date '2021-09-01' \
            --offset '${{ matrix.offset }}' \
            --output 'research/results/tardis_microstructure/${{ matrix.symbol }}-${{ matrix.slot }}.json' \
            --assert-ready
      - name: Enforce research-only invariants
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('research/results/tardis_microstructure/${{ matrix.symbol }}-${{ matrix.slot }}.json')
          d=json.loads(p.read_text())
          assert d['authorization']=='RESEARCH_ONLY'
          assert d['liveTrading'] is False
          assert d['status']=='PASS'
          assert d['canonicalReplayReady'] is True
          assert d['summary']['featureEvents'] > 0
          assert d['summary']['sampledSeconds'] > 0
          assert d['validation']['tickerMismatches'] == 0
          print(json.dumps({
            'symbol': d['symbol'],
            'offset': d['offset'],
            'featureEvents': d['summary']['featureEvents'],
            'sampledSeconds': d['summary']['sampledSeconds'],
            'tickerExact': d['validation']['tickerExact'],
            'tickerMismatches': d['validation']['tickerMismatches'],
            'gateGEventCounts': d['gateG']['eventCounts'],
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tardis-microstructure-${{ matrix.symbol }}-${{ matrix.slot }}
          path: research/results/tardis_microstructure/${{ matrix.symbol }}-${{ matrix.slot }}.json
          if-no-files-found: error

  aggregate:
    needs: integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tardis-microstructure-*
          path: downloaded
          merge-multiple: true
      - name: Aggregate frozen Gate G evidence
        run: |
          python - <<'PY'
          import json, pathlib
          files=sorted(pathlib.Path('downloaded').glob('*.json'))
          cells=[json.loads(p.read_text()) for p in files]
          horizons=('10','30','60')
          aggregate={}
          total_events=0
          for side in ('long','short'):
              aggregate[side]={}
              total_events += sum(int(c['gateG']['eventCounts'][side]) for c in cells)
              for h in horizons:
                  weighted_sum=0.0
                  hits=0.0
                  n=0
                  medians=[]
                  for c in cells:
                      o=c['gateG']['outcomes'][side][h]
                      k=int(o['n'])
                      if k:
                          weighted_sum += float(o['meanDirectionalBps']) * k
                          hits += float(o['hitRate']) * k
                          n += k
                          if o['medianDirectionalBps'] is not None:
                              medians.extend([float(o['medianDirectionalBps'])] * k)
                  aggregate[side][h]={
                      'n': n,
                      'meanDirectionalBps': (weighted_sum/n if n else None),
                      'hitRate': (hits/n if n else None),
                      'medianDirectionalBpsApprox': (sorted(medians)[len(medians)//2] if medians else None),
                  }
          payload={
              'authorization':'RESEARCH_ONLY',
              'liveTrading':False,
              'frozenDefinition': cells[0]['gateG']['eventDefinition'] if cells else None,
              'cells':len(cells),
              'totalSampledSeconds':sum(int(c['summary']['sampledSeconds']) for c in cells),
              'totalFeatureEvents':sum(int(c['summary']['featureEvents']) for c in cells),
              'totalGateGEvents':total_events,
              'informationSufficient': total_events >= 30,
              'aggregate':aggregate,
              'decision':'EVALUATE_EDGE' if total_events >= 30 else 'INSUFFICIENT_INFORMATION',
          }
          pathlib.Path('tardis-microstructure-aggregate.json').write_text(json.dumps(payload,indent=2,sort_keys=True))
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tardis-microstructure-aggregate
          path: tardis-microstructure-aggregate.json
          if-no-files-found: error
