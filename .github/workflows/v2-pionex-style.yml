name: V2 Grid DCA Breakout - real-data paper simulation
# Public Binance market data only; no private API credentials or real order routes.
# Immutable V2 SHA: reviewed and tested in PRs #12 and #13.
on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/v2-pionex-style.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-grid-dca-breakout-virtual-ledger
  cancel-in-progress: false
jobs:
  paper_shelf:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      V2_MODE: shadow
      V2_LIVE_TRADING: 'false'
      V2_PRIVATE_ADAPTER_ENABLED: 'false'
      V2_LIVE_AUTHORIZED: 'false'
    steps:
      - name: Checkout reviewed immutable V2 commit without retaining token
        uses: actions/checkout@v4
        with:
          ref: 98ec511a923214de2d7c002c108dd6ce7ab9c0c9
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore 50-USDT isolated virtual portfolios
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .v2-pionex
          key: v2-pionex-shelf-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: v2-pionex-shelf-
      - name: Validate ledger continuity and run strategy plus integrity regression tests
        env:
          CACHE_KEY: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          assert os.environ['V2_MODE'] == 'shadow' and os.environ['V2_LIVE_TRADING'] == 'false'
          assert not any(os.getenv(k) for k in ('BINANCE_API_KEY','BINANCE_API_SECRET','V2_BINANCE_API_KEY','V2_BINANCE_API_SECRET'))
          require_continuity = os.environ['GITHUB_EVENT_NAME'] == 'schedule' or int(os.environ['GITHUB_RUN_NUMBER']) > 3
          state_found = Path('.v2-pionex/state.json').is_file()
          if require_continuity:
              assert os.getenv('CACHE_KEY') and state_found, 'Lost virtual ledger: halt instead of fabricated PnL'
          print('VIRTUAL_LEDGER_RESTORED', state_found)
          PY
          pip install -r v2_bot/requirements.txt
          python -m unittest v2_bot.tests.test_pionex_style v2_bot.tests.test_pionex_integrity -v
      - name: Execute three independent paper strategies on real Binance Spot market data
        run: |
          set -o pipefail
          python -m v2_bot.pionex_run --once --symbol BTCUSDT --budget 50 | tee v2_pionex_report.json
      - name: Verify virtual accounting, no real orders and identical-bar idempotence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from v2_bot.pionex_ledger_guard import validate_ledger
          row=json.loads(Path('v2_pionex_report.json').read_text())
          state=json.loads(Path('.v2-pionex/state.json').read_text())
          validate_ledger(state['strategies'], symbol='BTCUSDT', budget=50)
          assert row['real_orders']==0 and row['live_trading'] is False
          assert row['virtual_budget_per_scenario']==50
          assert row['virtual_scenarios_are_independent_not_additive'] is True
          assert set(row['strategies'])=={'spot_grid','fixed_dca','trend_breakout'}
          assert all(v['actual_orders']==0 and v['live_trading'] is False for v in row['strategies'].values())
          assert all(abs(v['equity_usdt']-v['virtual_budget_usdt']-v['total_pnl_including_unrealized_usdt'])<0.00001 for v in row['strategies'].values())
          print('THREE_PAPER_STRATEGIES_LEDGER_VALID; LIVE=OFF')
          PY
          python -m v2_bot.pionex_run --once --symbol BTCUSDT --budget 50 > v2_repeat_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          first=json.loads(Path('v2_pionex_report.json').read_text())
          repeat=json.loads(Path('v2_repeat_report.json').read_text())
          for mode, original in first['strategies'].items():
              expected = ('missed_closed_candle_halted_manual_reconciliation'
                          if original['action']=='missed_closed_candle_halted_manual_reconciliation'
                          else 'duplicate_bar_no_action')
              assert repeat['strategies'][mode]['action']==expected, (mode, expected)
              assert repeat['strategies'][mode]['trades']==original['trades']
          print('VIRTUAL_FILL_DEDUPLICATION_OR_HALT_IDEMPOTENCE_PASS')
          PY
      - name: Save verified paper-only state for subsequent scans
        uses: actions/cache/save@v4
        with:
          path: .v2-pionex
          key: v2-pionex-shelf-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish actual virtual holdings and fee-aware PnL
        uses: actions/upload-artifact@v4
        with:
          name: grid-dca-breakout-paper-results
          path: v2_pionex_report.json
          retention-days: 7
