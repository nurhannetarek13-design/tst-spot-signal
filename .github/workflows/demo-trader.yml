name: Spot Signal Manual Fallback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/demo-trader.yml"

concurrency:
  group: spot-signal-scheduler
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trigger-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel Spot scanner
        env:
          SCAN_URL: https://tst-spot-signal.vercel.app/cron/scan
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          AUTH_ARGS=()
          if [ -n "${CRON_SECRET:-}" ]; then
            AUTH_ARGS=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi

          RESPONSE=$(curl             --silent             --show-error             --fail-with-body             --retry 3             --retry-delay 5             --max-time 120             "${AUTH_ARGS[@]}"             "${SCAN_URL}")

          echo "${RESPONSE}"
          echo "${RESPONSE}" | grep -q '"ok":true'
