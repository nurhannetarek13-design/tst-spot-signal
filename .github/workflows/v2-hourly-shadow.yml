name: V2 15m Spot shadow monitor - no real orders

# Public-data simulation only; no exchange credentials or execution permissions.
# GitHub scheduled runs execute only the workflow on the default branch main.
on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/v2-hourly-shadow-runtime-20260917
    paths:
      - '.github/workflows/v2-hourly-shadow.yml'

permissions:
  contents: read

concurrency:
  group: v2-15m-shadow-state
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      V2_MODE: shadow
      V2_LIVE_TRADING: 'false'
      V2_PRIVATE_ADAPTER_ENABLED: 'false'
      V2_LIVE_AUTHORIZED: 'false'
      V2_LIVE_ENGINE_UNLOCK: 'false'
      V2_EMERGENCY_FLATTEN_VERIFIED: 'false'
      V2_STATE_BACKEND: sqlite
      V2_PERSISTENT_STATE: 'true'
      V2_STATE_DB: .v2-shadow/v2_state.sqlite3
      V2_DEPLOY_REV: gh-${{ github.run_id }}-${{ github.run_attempt }}
      V2_STARTUP_ALERT: 'false'
      V2_UNIVERSE_LIMIT: '8'
      V2_TRADE_SIZE_USDT: '10'
      V2_MAX_DAILY_LOSS_USDT: '2'
      V2_MAX_OPEN_POSITIONS: '1'
      V2_SCAN_INTERVAL_SECONDS: '900'
    steps:
      - name: Checkout audited immutable V2 commit without storing GitHub credentials
        uses: actions/checkout@v4
        with:
          ref: a68974207233c8f8cd6bc8690cf806d110227c54
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore last successful simulated-trade ledger
        id: previous
        uses: actions/cache/restore@v4
        with:
          path: .v2-shadow
          key: v2-15m-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            v2-15m-shadow-
      - name: Verify persistent state and install public-data dependencies
        env:
          MATCHED_CACHE: ${{ steps.previous.outputs.cache-matched-key }}
        run: |
          mkdir -p .v2-shadow
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          old = Path(os.environ['V2_STATE_DB']).is_file()
          if os.environ['GITHUB_REF'] == 'refs/heads/fix/v2-hourly-shadow-runtime-20260917' and int(os.environ['GITHUB_RUN_NUMBER']) > 1:
              assert old and os.environ.get('MATCHED_CACHE'), 'Cannot demonstrate cross-run state continuity'
          if os.environ['GITHUB_REF'] == 'refs/heads/main' and os.environ['GITHUB_EVENT_NAME'] == 'schedule':
              assert old and os.environ.get('MATCHED_CACHE'), 'Scheduled run lost last state: manual bootstrap required; do not fabricate outcomes'
          assert os.environ['V2_MODE'] == 'shadow' and os.environ['V2_LIVE_TRADING'] == 'false'
          assert not any(os.environ.get(name) for name in ('BINANCE_API_KEY','BINANCE_API_SECRET','V2_BINANCE_API_KEY','V2_BINANCE_API_SECRET'))
          print(json.dumps({'previous_ledger_restored':old,'private_exchange_api_used':False,'real_orders':False},sort_keys=True))
          PY
          pip install -r v2_bot/requirements.txt
      - name: Run one actual V2 Spot shadow scan using public Binance data
        run: |
          set -o pipefail
          python -m v2_bot.main --once | tee v2_shadow_scan.jsonl
      - name: Check runtime, SQLite integrity, signal recency and no-order status
        env:
          MATCHED_CACHE: ${{ steps.previous.outputs.cache-matched-key }}
        run: |
          python - <<'PY'
          import json, os, sqlite3, time
          from datetime import datetime, timezone
          from pathlib import Path
          rows = [json.loads(line) for line in Path('v2_shadow_scan.jsonl').read_text().splitlines() if line.strip()]
          start = next((row for row in rows if row.get('event') == 'startup'), None)
          scans = [row for row in rows if 'shadow_tournament' in row]
          assert start and start.get('mode') == 'shadow' and start.get('live_trading') is False
          assert start.get('private_credentials_present') is False
          assert start.get('persistent_state') is True and start.get('state_backend') == 'sqlite'
          assert scans, 'Strategy-aware scan summary absent'
          scan = scans[-1]
          assert scan.get('mode') == 'shadow' and scan.get('live_trading') is False
          assert scan.get('shadow_tournament',{}).get('live_trading') is False
          assert scan.get('evaluated',0) > 0 and scan.get('errors') == []
          assert not scan.get('action') or scan['action'].get('event') not in ('live_buy','live_order')
          candles = [row.get('signal_open_time') for row in scan.get('top',[]) if row.get('signal_open_time')]
          assert candles and 0 <= time.time()*1000 - max(candles) <= 2*3600*1000, 'Market history is stale or in the future'
          if os.environ['GITHUB_REF'] == 'refs/heads/fix/v2-hourly-shadow-runtime-20260917' and int(os.environ['GITHUB_RUN_NUMBER']) > 1:
              assert start.get('persistence_proven') is True, 'Prior evidence did not survive a different deployment revision'
          if os.environ['GITHUB_REF'] == 'refs/heads/main' and os.environ['GITHUB_EVENT_NAME'] == 'schedule':
              assert start.get('persistence_proven') is True, 'Scheduled evidence persistence unproven'
          path = Path(os.environ['V2_STATE_DB'])
          assert path.is_file() and path.stat().st_size > 0
          with sqlite3.connect(path) as db:
              assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
              db.execute('PRAGMA wal_checkpoint(TRUNCATE)').fetchone()
          report = {'checked_at_utc':datetime.now(timezone.utc).isoformat(),
                    'status':'SHADOW_ONLY_NOT_LIVE_APPROVAL',
                    'ledger_restored':bool(os.environ.get('MATCHED_CACHE')),
                    'persistence_proven':start.get('persistence_proven'),
                    'evaluated':scan['evaluated'],'eligible':scan.get('eligible'),
                    'shadow_stats':scan.get('shadow_stats'),
                    'shadow_tournament':scan.get('shadow_tournament'),
                    'external_research_status':scan.get('external_btc_edge',{}).get('status'),
                    'live_trading':False,'real_orders_sent':0}
          Path('v2_shadow_report.json').write_text(json.dumps(report,indent=2,sort_keys=True))
          print(json.dumps({'status':'SHADOW_SCAN_PASSED','evaluated':scan['evaluated'],
                            'ledger_restored':report['ledger_restored'],
                            'persistence_proven':report['persistence_proven'],
                            'eligible':scan.get('eligible'),'live_trading':False},sort_keys=True))
          PY
      - name: Save research-only ledger for next cycle
        uses: actions/cache/save@v4
        with:
          path: .v2-shadow
          key: v2-15m-shadow-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish status report for inspection
        uses: actions/upload-artifact@v4
        with:
          name: v2-shadow-status
          path: v2_shadow_report.json
          retention-days: 7
