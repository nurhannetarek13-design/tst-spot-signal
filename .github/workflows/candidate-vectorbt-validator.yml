name: Unified Candidate VectorBT Validator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "validation/fusion/candidate-manifest.json"
      - "research/candidate_vectorbt_validator.py"
      - ".github/workflows/candidate-vectorbt-validator.yml"

permissions:
  contents: write

concurrency:
  group: unified-candidate-vectorbt
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --disable-pip-version-check 'plotly<7' vectorbt pandas numpy
      - run: python research/candidate_vectorbt_validator.py
      - name: Commit snapshot
        run: |
          cp validation/fusion/vectorbt-candidate-latest.json /tmp/vectorbt-candidate-latest.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p validation/fusion
          cp /tmp/vectorbt-candidate-latest.json validation/fusion/vectorbt-candidate-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/fusion/vectorbt-candidate-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Update unified VectorBT candidate validation"
          git push
