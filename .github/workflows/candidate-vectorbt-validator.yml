name: Unified Candidate VectorBT Validator

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Public Edge Lab"]
    types: [completed]
  schedule:
    - cron: "35 2 * * *"
  push:
    branches: [main]
    paths:
      - "validation/fusion/candidate-manifest.json"
      - "research/candidate_vectorbt_validator.py"
      - ".github/workflows/candidate-vectorbt-validator.yml"

permissions:
  contents: write

concurrency:
  group: unified-candidate-vectorbt
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --disable-pip-version-check 'plotly<7' vectorbt pandas numpy
      - run: python research/candidate_vectorbt_validator.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/fusion/vectorbt-candidate-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Update unified VectorBT candidate validation"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 2))
          done
          exit 1
