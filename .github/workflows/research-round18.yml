name: Round 18 twenty-strategy tournament
on:
  push:
    paths:
      - 'scripts/research-round18.mjs'
      - 'validation/evidence-gate-round18.json'
      - '.github/workflows/research-round18.yml'
  workflow_dispatch:
jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/research-round18.mjs
      - run: node scripts/research-round18.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: round18-tournament
          path: validation/round18-tournament.json
          if-no-files-found: error
