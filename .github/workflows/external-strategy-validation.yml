name: External strategy validation

on:
  workflow_dispatch:
  push:
    branches: [fix/unified-execution-parity]
    paths:
      - 'scripts/validate-external-strategies.mjs'
      - 'production/strategies/**'
      - '.github/workflows/external-strategy-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate BEC external strategies on Binance public data
        run: node scripts/validate-external-strategies.mjs
      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: external-strategy-validation
          path: validation/external-strategies/latest.json
