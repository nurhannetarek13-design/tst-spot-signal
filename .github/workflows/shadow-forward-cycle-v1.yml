name: Shadow Forward Cycle V1
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - research/pro_stack_feature_store.py
      - research/pro_stack_edge_model.py
      - research/pro_stack_shadow_trader.py
      - research/shadow_labeler.py
      - research/shadow_performance_gate.py
      - research/shadow_forward_state.py
      - .github/workflows/shadow-forward-cycle-v1.yml
permissions: {contents: read}
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore shadow state
        uses: actions/cache/restore@v4
        with:
          path: validation/pro_stack/state
          key: shadow-state-${{ github.run_id }}
          restore-keys: |
            shadow-state-
      - run: pip install numpy pandas
      - name: Build live public feature snapshot
        run: python research/pro_stack_feature_store.py
      - name: Score snapshot
        run: python research/pro_stack_edge_model.py
      - name: Produce shadow decisions only
        run: python research/pro_stack_shadow_trader.py
      - name: Update persistent paper trades and labels
        run: PYTHONPATH=. python research/shadow_forward_state.py
      - name: Labeler and performance-gate contracts
        run: |
          python research/shadow_labeler.py --selftest
          python research/shadow_performance_gate.py --selftest
      - name: Assert research-only contract
        run: |
          python - <<'PY'
          import json
          for p in ['validation/pro_stack/feature_store.json','validation/pro_stack/edge_scores.json','validation/pro_stack/shadow_decisions.json','validation/pro_stack/state/performance.json']:
              x=json.load(open(p)); assert x['authorization']=='RESEARCH_ONLY'; assert x['liveTrading'] is False
          assert json.load(open('validation/pro_stack/state/performance.json'))['gate']['liveAuthorized'] is False
          print('RESEARCH_ONLY_PASS')
          PY
      - name: Save shadow state
        uses: actions/cache/save@v4
        with:
          path: validation/pro_stack/state
          key: shadow-state-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: shadow-forward-cycle-v1-${{ github.run_number }}
          path: validation/pro_stack/
          retention-days: 14
