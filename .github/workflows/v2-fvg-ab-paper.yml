name: V2 FVG vs Crash Retest - matched-data paper comparison
# Public Binance Spot 15m candles / current bid-ask only; six alternative virtual accounts.
# Hypothesis is unproven. NEVER wire private exchange credentials or real orders.
# Immutable V2 source commit; deliberate review needed for any future source update.
on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/v2-fvg-ab-paper.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fvg-ab-isolated-six-paper-ledgers
  cancel-in-progress: false
jobs:
  forward_comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      V2_MODE: shadow
      V2_LIVE_TRADING: 'false'
      V2_PRIVATE_ADAPTER_ENABLED: 'false'
      V2_LIVE_AUTHORIZED: 'false'
      V2_LIVE_ENGINE_UNLOCK: 'false'
      V2_EMERGENCY_FLATTEN_VERIFIED: 'false'
    steps:
      - name: Checkout immutable V2 code without retained credentials
        uses: actions/checkout@v4
        with:
          ref: 317ebf74b3da86e440e06afae5b222e3b1dc98d4
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore FVG comparison ledgers without touching other strategies
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .v2-fvg-ab
          key: fvg-ab-six-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fvg-ab-six-
      - name: Fail closed on lost or partial ledger, enforce paper-only flags and tests
        env:
          CACHE_KEY: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          assert os.getenv('V2_MODE') == 'shadow'
          assert all(os.getenv(k) == 'false' for k in (
              'V2_LIVE_TRADING','V2_PRIVATE_ADAPTER_ENABLED','V2_LIVE_AUTHORIZED',
              'V2_LIVE_ENGINE_UNLOCK','V2_EMERGENCY_FLATTEN_VERIFIED'))
          assert not any(os.getenv(k) for k in (
              'BINANCE_API_KEY','BINANCE_API_SECRET','V2_BINANCE_API_KEY','V2_BINANCE_API_SECRET'))
          files=[Path('.v2-fvg-ab') / f'{symbol}_{mode}.json'
                 for symbol in ('btcusdt','ethusdt','solusdt')
                 for mode in ('baseline','fvg')]
          existing=[p.is_file() for p in files]
          assert all(existing) or not any(existing), 'Partially missing A/B ledgers: halt, never reset'
          bootstrap=(os.getenv('GITHUB_RUN_NUMBER') == '1'
                     and os.getenv('GITHUB_RUN_ATTEMPT') == '1'
                     and os.getenv('GITHUB_EVENT_NAME') == 'push')
          if not bootstrap:
              assert os.getenv('CACHE_KEY') and all(existing), 'Lost historical A/B ledgers: halt'
          print('PRIOR_SIX_AB_LEDGERS_RESTORED=', all(existing))
          PY
          pip install -r v2_bot/requirements.txt
          python -m unittest v2_bot.tests.test_fvg_ab_paper v2_bot.tests.test_crash_reversal_retest -v
      - name: Execute three pairs times two alternative paper modes on same snapshots
        run: |
          set -o pipefail
          python -m v2_bot.fvg_ab_paper --once --budget 50 | tee fvg_ab_report.json
      - name: Validate six accounts, prices, fees and replay idempotence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from v2_bot import crash_reversal_retest as baseline
          from v2_bot.fvg_ab_paper import SYMBOLS, state_path, validate
          result=json.loads(Path('fvg_ab_report.json').read_text())
          assert result['real_orders']==0 and result['live_trading'] is False
          assert result['status']=='UNPROVEN_PAPER_COMPARISON_NOT_PROFIT_APPROVAL'
          assert result['six_independent_alternative_scenarios_do_not_sum_capital']
          assert set(result['by_symbol'])==set(SYMBOLS)
          for symbol in SYMBOLS:
              b=result['by_symbol'][symbol]['baseline']
              f=result['by_symbol'][symbol]['fvg']
              b_state=json.loads(Path(state_path('.v2-fvg-ab',symbol,'baseline')).read_text())
              f_state=json.loads(Path(state_path('.v2-fvg-ab',symbol,'fvg')).read_text())
              baseline.validate(b_state,symbol=symbol,budget=50.)
              validate(f_state,symbol=symbol,budget=50.)
              assert b['last_closed_bar']==f['last_closed_bar']==result['last_closed_bar']
              for item in (b,f):
                  assert item['actual_orders']==0 and item['live_trading'] is False
                  assert abs(item['equity_usdt']-50.-item['total_pnl_including_unrealized_usdt'])<.00001
          print('SIX_MATCHED_SNAPSHOT_PAPER_ACCOUNTS_VALID; REAL_ORDERS=0')
          PY
          python -m v2_bot.fvg_ab_paper --once --budget 50 > fvg_ab_repeat.json
          python - <<'PY'
          import json
          from pathlib import Path
          first=json.loads(Path('fvg_ab_report.json').read_text())
          second=json.loads(Path('fvg_ab_repeat.json').read_text())
          for symbol, pair in first['by_symbol'].items():
              for variant in ('baseline','fvg'):
                  original=pair[variant]
                  replay=second['by_symbol'][symbol][variant]
                  expected=('exposed_gap_halted_no_invented_fill'
                            if original['action']=='exposed_gap_halted_no_invented_fill'
                            else 'duplicate_bar_no_action')
                  assert replay['action']==expected,(symbol,variant,replay['action'])
                  assert replay['trades']==original['trades']
                  assert replay['fees_paid_usdt']==original['fees_paid_usdt']
                  assert replay['realized_pnl_after_fees_usdt']==original['realized_pnl_after_fees_usdt']
          print('SIX_VARIANTS_DEDUPLICATED_NO_EXTRA_VIRTUAL_FILLS')
          PY
      - name: Save verified isolated ledgers for next scheduled run
        uses: actions/cache/save@v4
        with:
          path: .v2-fvg-ab
          key: fvg-ab-six-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish readable A/B scoreboard and export per-signal audit
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from v2_bot.fvg_ab_paper import SYMBOLS,state_path
          report=json.loads(Path('fvg_ab_report.json').read_text())
          lines=['## Crash Retest vs FVG Retest: matched-snapshot forward-paper only',
                 '**Not proof of profit.** Each $50 virtual account is a separate alternative, NOT funded or additive.',
                 '| Spot pair | Variant | Last action | Virtual equity | Total PnL incl unrealized | Realized net PnL | Fees | Fills | Halt |',
                 '|---|---|---|---:|---:|---:|---:|---:|---|']
          audit={}
          for symbol in SYMBOLS:
              audit[symbol]={}
              for mode in ('baseline','fvg'):
                  s=report['by_symbol'][symbol][mode]
                  ledger=json.loads(Path(state_path('.v2-fvg-ab',symbol,mode)).read_text())
                  audit[symbol][mode]={'events':ledger['events'],'open_lots':ledger['lots'],
                      'stop':ledger['stop'],'target':ledger['target'],
                      'realized_net_pnl_usdt':ledger['realized_pnl'],
                      'fees_paid_usdt':ledger['fees_paid'],'virtual_cash_usdt':ledger['cash']}
                  lines.append(f"| {symbol} | {mode} | {s['action']} | {s['equity_usdt']:.4f} | {s['total_pnl_including_unrealized_usdt']:+.4f} | {s['realized_pnl_after_fees_usdt']:+.4f} | {s['fees_paid_usdt']:.4f} | {s['trades']} | {s['halted']} |")
              difference=report['by_symbol'][symbol]['descriptive_pnl_difference_usdt_not_edge']
              lines.append(f'**{symbol} descriptive FVG − baseline PnL: {difference:+.4f} USDT; NOT an edge claim.**')
          lines.append('**Real orders: 0. Live: OFF.** Paper fills are next-observable-book simulations; exchange orders/stop protection not installed.')
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines)+'\n')
          Path('fvg_ab_audit.json').write_text(json.dumps({
              'status':'UNPROVEN_PAPER_ONLY','real_orders':0,'accounts':audit},
              sort_keys=True,allow_nan=False))
          PY
      - name: Archive comparison and auditable entry exit reasons
        uses: actions/upload-artifact@v4
        with:
          name: fvg-ab-six-account-same-snapshot-paper
          path: |
            fvg_ab_report.json
            fvg_ab_audit.json
          retention-days: 7
