name: Public Edge Forward Paper

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/forward-paper-public-edges.mjs"
      - "validation/fusion/candidate-manifest.json"
      - ".github/workflows/forward-paper-public-edges.yml"

permissions:
  contents: write

concurrency:
  group: public-edge-forward-paper
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TG_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check scripts/forward-paper-public-edges.mjs
      - run: node scripts/forward-paper-public-edges.mjs
      - name: Persist edge paper ledger
        run: |
          if ! git diff --quiet -- paper/public-edge-forward-ledger.json validation/fusion/forward-latest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add paper/public-edge-forward-ledger.json validation/fusion/forward-latest.json
            git commit -m "chore: update public edge forward ledger [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: public-edge-forward-paper
          path: artifacts/public-edge-forward.json
