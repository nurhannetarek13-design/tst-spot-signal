name: Unified Candidate Rotation

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Unified Fusion Gate"]
    types: [completed]
  schedule:
    - cron: "12,27,42,57 * * * *"

permissions:
  contents: write

concurrency:
  group: unified-candidate-rotation-${{ github.ref_name }}
  cancel-in-progress: true

env:
  TARGET_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluate candidate rotation
        id: rotate
        run: |
          python scripts/rotate_candidate.py | tee /tmp/rotation-result.json
          python - <<'PY'
          import json, os
          row=json.load(open("/tmp/rotation-result.json"))
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("changed="+str(bool(row.get("changed"))).lower()+"\n")
              f.write("next_candidate="+str(row.get("next") or "")+"\n")
          print(row)
          PY
      - name: Persist rotation safely
        if: steps.rotate.outputs.changed == 'true'
        run: |
          cp validation/fusion/candidate-manifest.json /tmp/candidate-manifest.json
          cp validation/fusion/rejected-candidates.json /tmp/rejected-candidates.json
          cp validation/fusion/forward-latest.json /tmp/forward-latest.json
          cp paper/public-edge-forward-ledger.json /tmp/public-edge-forward-ledger.json
          for i in 1 2 3 4 5; do
            git fetch origin "$TARGET_REF"
            git reset --hard "origin/$TARGET_REF"
            mkdir -p validation/fusion
            cp /tmp/candidate-manifest.json validation/fusion/candidate-manifest.json
            cp /tmp/rejected-candidates.json validation/fusion/rejected-candidates.json
            cp /tmp/forward-latest.json validation/fusion/forward-latest.json
            mkdir -p paper
            cp /tmp/public-edge-forward-ledger.json paper/public-edge-forward-ledger.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add validation/fusion/candidate-manifest.json validation/fusion/rejected-candidates.json validation/fusion/forward-latest.json paper/public-edge-forward-ledger.json
            git diff --cached --quiet && exit 0
            git commit -m "Rotate rejected unified candidate"
            git push origin "HEAD:$TARGET_REF" && exit 0
            sleep $((i * 2))
          done
          exit 1

      - name: Dispatch validators for rotated candidate
        if: steps.rotate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for wf in \
            candidate-vectorbt-validator.yml \
            fusion-freqtrade-validator.yml \
            fusion-jesse-validator.yml \
            nautilus-validator.yml \
            forward-paper-public-edges.yml; do
            gh workflow run "$wf" --ref "$TARGET_REF"
          done
          echo "Dispatched all unified validators for: ${{ steps.rotate.outputs.next_candidate }} on $TARGET_REF"
