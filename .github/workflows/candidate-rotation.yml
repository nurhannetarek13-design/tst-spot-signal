name: Unified Candidate Rotation

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Unified Fusion Gate"]
    types: [completed]
  schedule:
    - cron: "12,27,42,57 * * * *"

permissions:
  contents: write

concurrency:
  group: unified-candidate-rotation
  cancel-in-progress: true

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/rotate_candidate.py
      - name: Persist rotation safely
        run: |
          cp validation/fusion/candidate-manifest.json /tmp/candidate-manifest.json
          cp validation/fusion/rejected-candidates.json /tmp/rejected-candidates.json
          cp validation/fusion/forward-latest.json /tmp/forward-latest.json
          cp paper/public-edge-forward-ledger.json /tmp/public-edge-forward-ledger.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p validation/fusion
            cp /tmp/candidate-manifest.json validation/fusion/candidate-manifest.json
            cp /tmp/rejected-candidates.json validation/fusion/rejected-candidates.json
            cp /tmp/forward-latest.json validation/fusion/forward-latest.json
            mkdir -p paper
            cp /tmp/public-edge-forward-ledger.json paper/public-edge-forward-ledger.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add validation/fusion/candidate-manifest.json validation/fusion/rejected-candidates.json validation/fusion/forward-latest.json paper/public-edge-forward-ledger.json
            git diff --cached --quiet && exit 0
            git commit -m "Rotate rejected unified candidate"
            git push origin HEAD:main && exit 0
            sleep $((i * 2))
          done
          exit 1
