name: Mid Momentum Continuation V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/mid_momentum_continuation_v1.py"
      - ".github/workflows/mid-momentum-continuation-v1.yml"

permissions:
  contents: read

concurrency:
  group: mid-momentum-continuation-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check numpy pandas
      - name: Syntax check
        run: python -m py_compile research/mid_momentum_continuation_v1.py
      - name: Run mid-momentum continuation research
        run: PYTHONPATH=. python research/mid_momentum_continuation_v1.py
      - name: Assert fail-closed output
        run: |
          python - <<'PY'
          import json
          p='validation/edges/mid-momentum-continuation-v1-latest.json'
          x=json.load(open(p))
          assert x['authorization']=='RESEARCH_ONLY'
          assert x['liveTrading'] is False
          assert x['automaticPromotion'] is False
          assert x['productionPromotionBlocked'] is True
          assert x['validationDesign']['entryTiming']=='NEXT_15M_OPEN'
          assert x['validationDesign']['sameBarTpSlResolution']=='SL_FIRST_PESSIMISTIC'
          print('mid-momentum v1 fail-closed assertions passed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mid-momentum-continuation-v1-report
          path: validation/edges/mid-momentum-continuation-v1-latest.json
          retention-days: 14
