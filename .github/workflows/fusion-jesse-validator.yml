name: Fusion Jesse Validator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "validation/fusion/candidate-manifest.json"
      - "jesse/run_fusion_validator.py"
      - "jesse/strategies/UnifiedCandidateValidator/**"
      - ".github/workflows/fusion-jesse-validator.yml"

permissions:
  contents: write

concurrency:
  group: unified-candidate-jesse
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read exact canonical candidate
        run: |
          python - <<'PY'
          import json, pathlib, os, datetime
          m=json.loads(pathlib.Path("validation/fusion/candidate-manifest.json").read_text())
          has=bool(m.get("candidateId") and m.get("candidateFingerprint"))
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write("HAS_CANDIDATE="+str(has).lower()+"\n")
              f.write("EXPECTED_CANDIDATE_ID="+str(m.get("candidateId") or "")+"\n")
              f.write("EXPECTED_CANDIDATE_FP="+str(m.get("candidateFingerprint") or "")+"\n")
          if not has:
              out={"engine":"JESSE","strategyId":"TST_CANDIDATE_JESSE_VALIDATOR_V1","status":"NO_CANDIDATE","pass":False,"candidateId":None,"candidateFingerprint":None,"candidateStatus":m.get("status"),"authorization":"RESEARCH_ONLY","liveTrading":False,"generatedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),"notes":"No unified candidate; Jesse install and market download skipped."}
              pathlib.Path("validation/fusion/jesse-latest.json").write_text(json.dumps(out,indent=2))
          PY

      - name: Install Jesse
        if: env.HAS_CANDIDATE == 'true'
        run: pip install --disable-pip-version-check jesse

      - name: Run independent Jesse backtest
        id: jesse_run
        if: env.HAS_CANDIDATE == 'true'
        continue-on-error: true
        env:
          PYTHONPATH: jesse
        run: python jesse/run_fusion_validator.py

      - name: Prove result belongs to checked-out candidate
        if: env.HAS_CANDIDATE == 'true' && always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path("validation/fusion/jesse-latest.json")
          assert p.exists(), "Jesse must always persist a fail-closed snapshot"
          row=json.load(open(p))
          assert row.get("candidateId") == os.environ["EXPECTED_CANDIDATE_ID"]
          assert row.get("candidateFingerprint") == os.environ["EXPECTED_CANDIDATE_FP"]
          assert row.get("strategyId") == "TST_CANDIDATE_JESSE_VALIDATOR_V1"
          assert row.get("liveTrading") is False
          print("Jesse exact-candidate identity verified")
          PY

      - name: Commit Jesse snapshot safely
        if: always()
        run: |
          test -f validation/fusion/jesse-latest.json
          cp validation/fusion/jesse-latest.json /tmp/jesse-latest.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$(dirname validation/fusion/jesse-latest.json)"
            cp /tmp/jesse-latest.json validation/fusion/jesse-latest.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add validation/fusion/jesse-latest.json
            git diff --cached --quiet && exit 0
            git commit -m "Update unified Jesse candidate validation"
            git push origin HEAD:main && exit 0
            sleep $((i * 2))
          done
          exit 1

      - name: Surface Jesse infrastructure failure
        if: env.HAS_CANDIDATE == 'true' && steps.jesse_run.outcome == 'failure'
        run: exit 1
