name: Fusion Jesse Validator

on:
  workflow_dispatch:
  push:
    branches: [fix/unified-execution-parity]
    paths:
      - "jesse/**"
      - "validation/fusion/frozen-parity-candidate.json"
      - "validation/fusion/execution-parity-fixture.json"
      - ".github/workflows/fusion-jesse-validator.yml"

permissions:
  contents: write

concurrency:
  group: unified-candidate-jesse-parity
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unified-execution-parity
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read frozen parity candidate
        run: |
          python - <<'PY'
          import json, pathlib, os, datetime
          m=json.loads(pathlib.Path("validation/fusion/frozen-parity-candidate.json").read_text())
          has=bool(m.get("candidateFingerprint"))
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write("HAS_CANDIDATE="+str(has).lower()+"\n")
          if not has:
              out={"engine":"JESSE","strategyId":"TST_CANDIDATE_JESSE_VALIDATOR_V1","status":"NO_CANDIDATE","pass":False,"candidateId":None,"candidateFingerprint":None,"authorization":"RESEARCH_ONLY","liveTrading":False,"generatedAt":datetime.datetime.now(datetime.timezone.utc).isoformat()}
              pathlib.Path("validation/fusion/jesse-latest.json").write_text(json.dumps(out,indent=2))
          PY

      - name: Install Jesse
        if: env.HAS_CANDIDATE == 'true'
        run: pip install --disable-pip-version-check jesse

      - name: Run independent Jesse backtest
        if: env.HAS_CANDIDATE == 'true'
        env:
          PYTHONPATH: jesse
        run: python jesse/run_fusion_validator.py

      - name: Commit Jesse parity snapshot safely
        run: |
          cp validation/fusion/jesse-latest.json /tmp/jesse-latest.json
          for i in 1 2 3 4 5; do
            git fetch origin fix/unified-execution-parity
            git reset --hard origin/fix/unified-execution-parity
            mkdir -p validation/fusion
            cp /tmp/jesse-latest.json validation/fusion/jesse-latest.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add validation/fusion/jesse-latest.json
            git diff --cached --quiet && exit 0
            git commit -m "Update parity Jesse validation"
            git push origin HEAD:fix/unified-execution-parity && exit 0
            sleep $((i * 2))
          done
          exit 1
