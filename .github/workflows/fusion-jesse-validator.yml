name: Fusion Jesse Validator

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Public Edge Lab"]
    types: [completed]
  schedule:
    - cron: "20 3 * * *"
  push:
    branches: [main]
    paths:
      - "jesse/**"
      - "validation/fusion/candidate-manifest.json"
      - ".github/workflows/fusion-jesse-validator.yml"

permissions:
  contents: write

concurrency:
  group: unified-candidate-jesse
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Jesse
        run: pip install --disable-pip-version-check jesse

      - name: Run independent Jesse backtest
        env:
          PYTHONPATH: jesse
        run: python jesse/run_fusion_validator.py

      - name: Commit Jesse snapshot safely
        run: |
          cp validation/fusion/jesse-latest.json /tmp/jesse-latest.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$(dirname validation/fusion/jesse-latest.json)"
            cp /tmp/jesse-latest.json validation/fusion/jesse-latest.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add validation/fusion/jesse-latest.json
            git diff --cached --quiet && exit 0
            git commit -m "Update unified Jesse candidate validation [skip ci]"
            git push origin HEAD:main && exit 0
            sleep $((i * 2))
          done
          exit 1
