name: BinHV45 Regime 5m Gate V2

on:
  workflow_dispatch:
  push:
    branches: [research/nfi-ready-strategy-v1]
    paths:
      - '.github/workflows/external-binhv45-regime-v1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch strategy and pin source
        run: |
          set -euo pipefail
          mkdir -p external/binhv45 user_data/strategies validation/external-binhv45-regime-v1
          git clone --depth 1 https://github.com/zevrichards/freqtrade-strategies.git external/binhv45
          git -C external/binhv45 rev-parse HEAD | tee validation/external-binhv45-regime-v1/upstream-sha.txt
          cp external/binhv45/BinHV45_Regime_5m.py user_data/strategies/BinHV45_Regime_5m.py

      - name: Prepare Freqtrade and contract config
        run: |
          set -euo pipefail
          docker pull freqtradeorg/freqtrade:stable
          python - <<'PY'
          import json, pathlib
          pairs=['BTC/USDT','ETH/USDT','SOL/USDT','BNB/USDT','XRP/USDT','ADA/USDT','DOGE/USDT','LINK/USDT','AVAX/USDT','DOT/USDT','UNI/USDT','LDO/USDT','NEAR/USDT','AAVE/USDT','LTC/USDT','ATOM/USDT','TRX/USDT','SUI/USDT','BCH/USDT','ETC/USDT']
          cfg={
            '$schema':'https://schema.freqtrade.io/schema.json','bot_name':'TST BinHV45 Regime Gate V2',
            'stake_currency':'USDT','stake_amount':10,'max_open_trades':3,'dry_run_wallet':50,
            'tradable_balance_ratio':0.90,'fiat_display_currency':'USD','dry_run':True,
            'trading_mode':'spot','margin_mode':'','timeframe':'5m','process_only_new_candles':True,
            'exchange':{
              'name':'binance','key':'','secret':'',
              'ccxt_config':{
                'enableRateLimit':True,
                'urls':{'api':{
                  'public':'https://data-api.binance.vision/api/v3',
                  'private':'https://api.binance.com/api',
                  'sapi':'https://api.binance.com/sapi'
                }},
                'options':{'defaultType':'spot','fetchMarkets':['spot']}
              },
              'pair_whitelist':pairs,
              'pair_blacklist':['.*(UP|DOWN|BULL|BEAR)/USDT']
            },
            'pairlists':[{'method':'StaticPairList'}],
            'entry_pricing':{'price_side':'other','use_order_book':False,'price_last_balance':0.0},
            'exit_pricing':{'price_side':'other','use_order_book':False},
            'order_types':{'entry':'market','exit':'market','emergency_exit':'market','force_entry':'market','force_exit':'market','stoploss':'market','stoploss_on_exchange':False},
            'unfilledtimeout':{'entry':5,'exit':5,'exit_timeout_count':0,'unit':'minutes'},
            'telegram':{'enabled':False,'token':'','chat_id':''},
            'api_server':{'enabled':False,'listen_ip_address':'127.0.0.1','listen_port':8080,'username':'research','password':'research-only','jwt_secret_key':'researchOnlyJwtSecretKey1234567890123456'},
            'internals':{'process_throttle_secs':5}
          }
          pathlib.Path('user_data').mkdir(exist_ok=True)
          pathlib.Path('user_data/config.json').write_text(json.dumps(cfg,indent=2))
          pathlib.Path('validation/external-binhv45-regime-v1/pairs.json').write_text(json.dumps(pairs,indent=2))
          PY

      - name: Smoke-load exact strategy
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/user_data:/freqtrade/user_data" freqtradeorg/freqtrade:stable list-strategies \
            --config /freqtrade/user_data/config.json \
            2>&1 | tee validation/external-binhv45-regime-v1/list-strategies.log
          grep -q 'BinHV45_Regime_5m' validation/external-binhv45-regime-v1/list-strategies.log
          if grep -E 'BinHV45_Regime_5m.*(LOAD FAILED|DUPLICATE NAME)|(LOAD FAILED|DUPLICATE NAME).*BinHV45_Regime_5m' validation/external-binhv45-regime-v1/list-strategies.log; then exit 31; fi

      - name: Download Binance Spot data
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/user_data:/freqtrade/user_data" freqtradeorg/freqtrade:stable download-data \
            --config /freqtrade/user_data/config.json --timeframes 5m 30m 1h --timerange 20250101-20260910 \
            | tee validation/external-binhv45-regime-v1/download.log

      - name: Backtest base and stress
        run: |
          set -euo pipefail
          OUT=validation/external-binhv45-regime-v1
          run_bt() {
            tag="$1"; timerange="$2"; fee="$3"
            set +e
            docker run --rm -v "$PWD/user_data:/freqtrade/user_data" freqtradeorg/freqtrade:stable backtesting \
              --config /freqtrade/user_data/config.json --strategy BinHV45_Regime_5m \
              --timerange "$timerange" --fee "$fee" --enable-protections --export trades \
              --export-filename "/freqtrade/user_data/backtest_results/${tag}.json" > "$OUT/${tag}.log" 2>&1
            code=$?
            set -e
            echo "$code" > "$OUT/${tag}-exit-code.txt"
            tail -n 35 "$OUT/${tag}.log" || true
          }
          run_bt 2025_base040 20250101-20251231 0.002
          run_bt 2026_base040 20260101-20260910 0.002
          run_bt 2026_stress100 20260101-20260910 0.005

      - name: Lookahead analysis
        run: |
          set +e
          docker run --rm -v "$PWD/user_data:/freqtrade/user_data" freqtradeorg/freqtrade:stable lookahead-analysis \
            --config /freqtrade/user_data/config.json --strategy BinHV45_Regime_5m \
            --timerange 20260101-20260910 --minimum-trade-amount 20 --targeted-trade-amount 50 --enable-protections \
            > validation/external-binhv45-regime-v1/lookahead.log 2>&1
          echo "$?" > validation/external-binhv45-regime-v1/lookahead-exit-code.txt
          set -e

      - name: Build fail-closed verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('validation/external-binhv45-regime-v1')
          def parse(tag):
              text=(root/f'{tag}.log').read_text(errors='ignore') if (root/f'{tag}.log').exists() else ''
              try: code=int((root/f'{tag}-exit-code.txt').read_text().strip())
              except: code=999
              def g(pat,cast=float):
                  m=re.search(pat,text,re.I)
                  if not m:return None
                  try:return cast(m.group(1).replace(',','').strip())
                  except:return None
              trades=g(r'Total/Daily Avg Trades\s*│\s*(\d+)',int)
              if trades is None: trades=g(r'│\s*TOTAL\s*│\s*(\d+)',int)
              return {'exitCode':code,'trades':trades,'profitFactor':g(r'Profit factor\s*│\s*([-+0-9.]+)'),'totalProfitPct':g(r'Total profit %\s*│\s*([-+0-9.]+)'),'absoluteProfit':g(r'Absolute profit\s*│\s*([-+0-9.]+)'),'maxBalanceDrawdownPct':g(r'Max % of account underwater \(balance\)\s*│\s*([-+0-9.]+)'),'worstDayUSDT':g(r'Worst day\s*│\s*([-+0-9.]+)\s+USDT'),'worstTradePct':g(r'Worst trade\s*│\s*[^\n│]*?([-+]\d+(?:\.\d+)?)%')}
          rows={'2025_base040':parse('2025_base040'),'2026_base040':parse('2026_base040'),'2026_stress100':parse('2026_stress100')}
          reasons=[]
          for name,r in rows.items():
              if r['exitCode']!=0: reasons.append(f'{name}:INFRA_ERROR_{r["exitCode"]}'); continue
              if (r['trades'] or 0)<20: reasons.append(f'{name}:LT_20_TRADES')
              if r['absoluteProfit'] is None or r['absoluteProfit']<=0: reasons.append(f'{name}:NONPOSITIVE')
              floor=1.05 if 'stress' in name else 1.15
              if (r['profitFactor'] or 0)<floor: reasons.append(f'{name}:PF_LT_{floor:.2f}')
              if r['maxBalanceDrawdownPct'] is None or r['maxBalanceDrawdownPct']>15: reasons.append(f'{name}:DD_GT_15')
              if r['worstDayUSDT'] is None or r['worstDayUSDT'] < -2: reasons.append(f'{name}:WORST_DAY_GT_2USDT')
              if r['worstTradePct'] is None: reasons.append(f'{name}:WORST_TRADE_UNVERIFIED')
              elif r['worstTradePct'] < -4.5: reasons.append(f'{name}:HARD_STOP_NOT_ENFORCED')
          look=(root/'lookahead.log').read_text(errors='ignore') if (root/'lookahead.log').exists() else ''
          try: lookcode=int((root/'lookahead-exit-code.txt').read_text().strip())
          except: lookcode=999
          lookahead_bias=bool(re.search(r'(?i)(bias detected|yes\s*│)',look))
          if lookcode!=0: reasons.append(f'LOOKAHEAD_INFRA_{lookcode}')
          if lookahead_bias: reasons.append('LOOKAHEAD_BIAS_DETECTED')
          complete=all(r['exitCode']==0 for r in rows.values()) and lookcode==0
          passed=complete and not reasons
          result={'engine':'BINHV45_REGIME_5M_GATE_V2','researchOnly':True,'liveAuthorization':False,'upstreamSha':(root/'upstream-sha.txt').read_text().strip() if (root/'upstream-sha.txt').exists() else None,'contract':{'walletUSDT':50,'stakeUSDT':10,'maxOpenTrades':3,'noDCA':True,'hardStopPct':-3,'spotOnly':True},'rows':rows,'lookaheadExitCode':lookcode,'lookaheadBiasDetected':lookahead_bias,'pass':passed,'reasons':reasons,'status':'PASS_TO_OOS' if passed else ('TEST_INFRA_FAILURE' if not complete else 'REJECT'),'nextGate':'chronological walk-forward + unseen-symbol OOS + forward shadow' if passed else 'do not wire live'}
          (root/'verdict.json').write_text(json.dumps(result,indent=2)); print(json.dumps(result,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binhv45-regime-v2
          path: validation/external-binhv45-regime-v1/**
          if-no-files-found: error
