name: Production Safety Kernel CI
on:
  pull_request:
    paths:
      - 'freqtrade/production_safety_kernel.py'
      - 'freqtrade/independent_watchdog.py'
      - 'tests/test_production_safety_kernel.py'
      - '.github/workflows/production-safety-kernel-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip pytest
      - name: Compile
        run: python -m py_compile freqtrade/production_safety_kernel.py freqtrade/independent_watchdog.py
      - name: Safety kernel tests
        run: python -m pytest -q tests/test_production_safety_kernel.py
      - name: Existing execution state-machine regression
        run: cd freqtrade && python test_execution_state_machine.py
