name: Derivatives Metrics Edge Scanner V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/derivatives_metrics_edge_scanner_v1.py"
      - "research/run_derivatives_metrics_edge_scanner_v1.py"
      - ".github/workflows/derivatives-metrics-edge-scanner-v1.yml"

permissions:
  contents: read

concurrency:
  group: derivatives-metrics-edge-scanner-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy pandas
      - name: Syntax check
        run: python -m py_compile research/derivatives_metrics_edge_scanner_v1.py research/run_derivatives_metrics_edge_scanner_v1.py
      - name: Run frozen Round 7 derivatives discovery
        run: python research/run_derivatives_metrics_edge_scanner_v1.py
      - name: Assert research-only contract
        run: |
          python - <<'PY'
          import json
          p='validation/edges/derivatives-metrics-edge-scanner-v1-latest.json'
          x=json.load(open(p))
          assert x['engine']=='DERIVATIVES_METRICS_EDGE_SCANNER_V1'
          assert x['round']==7
          assert x['authorization']=='RESEARCH_ONLY'
          assert x['liveTrading'] is False and x['liveReady'] is False
          assert x['fdrQ']==0.05
          assert all('qValue' in t and 'pass' in t for t in x['tests'])
          assert len(x['families'])==4
          assert x['dataQualityGate']['missingValues']=='NO_SIGNAL_NO_FILL'
          print('Round 7 research-only assertions passed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: derivatives-metrics-edge-scanner-v1-report
          path: validation/edges/derivatives-metrics-edge-scanner-v1-latest.json
          retention-days: 14
