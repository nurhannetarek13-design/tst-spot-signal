name: Safety gates
on:
  push:
  pull_request:

concurrency:
  group: safety-gates-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - name: Report runtime npm audit
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/npm-audit-runtime.json || true
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/npm-audit-runtime.json','utf8'));
          const v=r.metadata?.vulnerabilities||{};
          console.log('RUNTIME_AUDIT',JSON.stringify(v));
          const advisories=Object.entries(r.vulnerabilities||{}).map(([name,row])=>({
            name,severity:row.severity,isDirect:row.isDirect,via:(row.via||[]).map(x=>typeof x==='string'?x:{title:x.title,url:x.url,severity:x.severity}),fixAvailable:row.fixAvailable
          }));
          console.log('RUNTIME_ADVISORIES',JSON.stringify(advisories));
          NODE
      - run: npm test
      - run: node --check server.mjs
      - run: node --check src/index.js
      - run: node --check src/edge-worker.js
      - run: node --check src/thesis-engine.js
      - run: node scripts/test-thesis-engine.mjs
      - run: node scripts/test-supabase-relay-core.mjs
      - run: node scripts/test-v2-intent-router-guards.mjs
      - run: node --check src/supabase-live-client.js
      - name: Assert execution provider cutover is not Make-hardcoded
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'executionProvider(env)' src/ops-supervisor.js
          grep -q 'executionRoute(env)' src/ops-supervisor.js
          grep -q 'executorConfigured(env)' src/ops-supervisor.js
          grep -q 'executionReadOnlyHeartbeat(env)' src/ops-supervisor.js
          grep -q 'recordReconciliation(env' src/ops-supervisor.js
          grep -q 'data-api.binance.vision' src/binance-spot-filters.js
          if grep -q 'const executorConfigured = String(env.MAKE_EXECUTOR_V2_READY' src/ops-supervisor.js; then
            echo "Go/No-Go regressed to Make-only configuration"
            exit 1
          fi
          if grep -q 'executionRoute: "CLOUDFLARE_HMAC_MAKE"' src/ops-supervisor.js; then
            echo "Go/No-Go regressed to hardcoded Make execution route"
            exit 1
          fi
          if grep -q 'signedBinance(' src/buy-gateway-stable.js; then
            echo "Active buy gateway must not call legacy signedBinance helper"
            exit 1
          fi
      - name: Assert Supabase V2 execution safety invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SUPABASE_EXECUTOR_READY' src/supabase-live-client.js
          grep -q 'BUY_SUBMISSION_UNKNOWN' src/supabase-live-client.js
          grep -q 'OCO_SUBMISSION_UNKNOWN' src/supabase-live-client.js
          grep -q 'mayResend: false' src/supabase-live-client.js
          grep -q 'reconciliationConfirmedAbsent' src/supabase-live-client.js
          grep -q 'PROTECTION_FAILED_EMERGENCY_CLOSED' src/supabase-live-client.js
          grep -q 'const WRITES_ENABLED = false' supabase/functions/tst-binance-relay/index.ts
          grep -q 'RELAY_PUBLIC_KEY_PEM' supabase/functions/tst-binance-relay/index.ts
          grep -q 'verifyRelayAuth' supabase/functions/tst-binance-relay/index.ts
          grep -q 'RELAY_REPLAY_BLOCKED' supabase/functions/tst-binance-relay/index.ts
          grep -q 'tst_relay_nonces' supabase/functions/tst-binance-relay/index.ts
          if grep -q 'ALLOWED_API_KEY_SHA256' supabase/functions/tst-binance-relay/index.ts; then
            echo "Static Binance API-key fingerprint pinning must not return"
            exit 1
          fi
          if grep -Eq 'BINANCE_API_SECRET|BINANCE_SECRET_KEY|BINANCE_SECRET' supabase/functions/tst-binance-relay/index.ts; then
            echo "Supabase relay must not depend on a Binance HMAC secret"
            exit 1
          fi
          grep -q 'ED25519_SUPABASE_VAULT' supabase/functions/tst-binance-relay/index.ts
          grep -q 'tst_binance_ed25519_sign' supabase/functions/tst-binance-relay/index.ts
          if grep -q 'postgres from "npm:postgres' supabase/functions/tst-binance-relay/index.ts; then
            echo "Supabase relay must not open direct Postgres connections"
            exit 1
          fi
          grep -q 'CALLER_SECURITY_PARAM_BLOCKED' supabase/functions/tst-binance-relay/relay-core.mjs
          if grep -Eq 'binanceCredentials\(|buildSignedBinanceQuery\(|getBinanceServerTime\(' src/supabase-live-client.js; then
            echo "Cloudflare must not sign Binance requests"
            exit 1
          fi
      - name: Assert thesis engine owns scanner decisions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'const setup=detectThesisSetup(c15)' src/edge-worker.js
          grep -q 'calibration=calibrationBySetup' src/edge-worker.js
          grep -q 'thesis.confirmations.required.rr=netRR2>=rrFloor' src/edge-worker.js
          if grep -q 'const candidate = chooseStrategy' src/edge-worker.js; then
            echo "Legacy indicator-led chooseStrategy returned to active analyze path"
            exit 1
          fi
          grep -q 'No probability shown until >=30 same-setup paper trades' src/edge-worker.js
      - run: node --check src/buy-gateway-stable.js
      - run: node scripts/test-make-v2-manual-route.mjs
      - run: node --check scripts/forward-paper-public-edges.mjs
      - run: npm run check:render

      - name: Compile research and gate Python
        run: |
          python -m py_compile             research/public_edge_lab.py             research/derivatives_pressure.py             research/vectorbt_discovery.py             research/candidate_vectorbt_validator.py             research/nautilus_validator.py             scripts/build_candidate_manifest.py             scripts/build_fusion_gate.py             scripts/rotate_candidate.py             scripts/candidate_rotation_lib.py             scripts/fusion-freqtrade-report.py             scripts/system_health.py             jesse/run_fusion_validator.py             jesse/strategies/UnifiedCandidateValidator/__init__.py             freqtrade/user_data/strategies/UnifiedCandidateStrategy.py

      - name: Test candidate rotation cooldown refresh
        run: PYTHONPATH=. python tests/test_candidate_rotation_logic.py

      - name: Test Jesse spot time-exit reservation fix
        run: python tests/test_jesse_spot_time_exit.py

      - name: Test explicit fusion orchestration wiring
        run: python tests/test_fusion_orchestration_wiring.py

      - name: Assert fail-closed trading policy
        run: |
          python - <<'PY'
          import json, pathlib, re
          p=json.loads(pathlib.Path("fusion/policy.json").read_text())
          assert p["mode"]=="PAPER_ONLY"
          assert p["liveTrading"] is False
          assert p["execution"]["executorAllowed"] is False
          assert p["execution"]["withdrawalsAllowed"] is False
          assert p["execution"]["futuresAllowed"] is False
          assert p["execution"]["leverageAllowed"] is False
          assert p["execution"]["autoEnableLive"] is False

          worker=pathlib.Path("src/edge-worker.js").read_text()
          assert 'liveTrading:false' in worker
          assert 'executorAllowed:false' in worker
          assert '/api/v3/order' not in worker
          assert 'withdraw/apply' not in worker
          assert 'BINANCE_API_SECRET' not in worker
          assert "BINANCE" in p["account"]["exchange"]
          print("Fail-closed policy verified.")
          PY

      - name: Assert unified candidate wiring
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path("validation/fusion")
          m=json.loads((root/"candidate-manifest.json").read_text())
          required=["vectorbt","freqtrade","jesse","nautilus","forward"]
          assert m["strategyId"]=="TST_UNIFIED_CANDIDATE_V1"
          assert m["validatorsRequired"]==required
          if m.get("candidateFingerprint"):
              for name,path in {
                  "vectorbt":"vectorbt-candidate-latest.json",
                  "freqtrade":"freqtrade-latest.json",
                  "jesse":"jesse-latest.json",
                  "nautilus":"nautilus-latest.json",
                  "forward":"forward-latest.json",
              }.items():
                  row=json.loads((root/path).read_text())
                  if row.get("candidateFingerprint") not in {None,m["candidateFingerprint"]}:
                      print(f"{name}: stale snapshot from prior candidate; gate must reject mismatch")
          gate_code=pathlib.Path("scripts/build_fusion_gate.py").read_text()
          assert "CANDIDATE_ID_MISMATCH" in gate_code
          assert "CANDIDATE_FINGERPRINT_MISMATCH" in gate_code
          print("Unified candidate wiring verified; stale snapshots are fail-closed during rotation.")
          PY
