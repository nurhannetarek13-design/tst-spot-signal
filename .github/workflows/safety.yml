name: Safety gates
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: npm test
      - run: node --check server.mjs
      - run: node --check src/index.js
      - run: node --check src/edge-worker.js
      - run: node --check scripts/forward-paper-public-edges.mjs
      - run: npm run check:render

      - name: Compile research and gate Python
        run: |
          python -m py_compile             research/public_edge_lab.py             research/derivatives_pressure.py             research/vectorbt_discovery.py             research/candidate_vectorbt_validator.py             research/nautilus_validator.py             scripts/build_candidate_manifest.py             scripts/build_fusion_gate.py             scripts/rotate_candidate.py             scripts/candidate_rotation_lib.py             scripts/fusion-freqtrade-report.py             scripts/system_health.py             jesse/run_fusion_validator.py             jesse/strategies/UnifiedCandidateValidator/__init__.py             freqtrade/user_data/strategies/UnifiedCandidateStrategy.py

      - name: Test candidate rotation cooldown refresh
        run: PYTHONPATH=. python tests/test_candidate_rotation_logic.py

      - name: Assert liquidity basket contract is research-only
        run: |
          python - <<'PY'
          import pathlib
          builder=pathlib.Path("scripts/build_candidate_manifest.py").read_text()
          gate=pathlib.Path("scripts/build_fusion_gate.py").read_text()
          rotation=pathlib.Path("scripts/rotate_candidate.py").read_text()
          jesse=pathlib.Path(".github/workflows/fusion-jesse-validator.yml").read_text()
          freqtrade=pathlib.Path(".github/workflows/fusion-freqtrade-validator.yml").read_text()
          assert 'MULTI_SYMBOL_BASKET' in builder
          assert 'MULTI_SYMBOL_POOLED_RESEARCH' in builder
          assert 'GLOBAL_SINGLE_POSITION_BASKET' in builder
          assert 'validatorsRequired":["vectorbt","freqtrade","nautilus","forward"]' in builder
          assert 'restricted_history' in gate
          assert 'small_ready=(len(small_reasons)==0) and not restricted_history' in gate
          assert 'historicalValidators' in rotation
          assert 'status":"NOT_REQUIRED"' in jesse
          assert 'candidate-config.json' in freqtrade
          print("Liquidity basket contract verified: pooled history -> one-position forward only.")
          PY

      - name: Assert fail-closed trading policy
        run: |
          python - <<'PY'
          import json, pathlib, re
          p=json.loads(pathlib.Path("fusion/policy.json").read_text())
          assert p["mode"]=="PAPER_ONLY"
          assert p["liveTrading"] is False
          assert p["execution"]["executorAllowed"] is False
          assert p["execution"]["withdrawalsAllowed"] is False
          assert p["execution"]["futuresAllowed"] is False
          assert p["execution"]["leverageAllowed"] is False
          assert p["execution"]["autoEnableLive"] is False

          worker=pathlib.Path("src/edge-worker.js").read_text()
          assert 'liveTrading:false' in worker
          assert 'executorAllowed:false' in worker
          assert '/api/v3/order' not in worker
          assert 'withdraw/apply' not in worker
          assert 'BINANCE_API_SECRET' not in worker
          assert "BINANCE" in p["account"]["exchange"]
          print("Fail-closed policy verified.")
          PY

      - name: Assert unified candidate wiring
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path("validation/fusion")
          m=json.loads((root/"candidate-manifest.json").read_text())
          assert m["strategyId"]=="TST_UNIFIED_CANDIDATE_V1"
          required=m.get("validatorsRequired") or []
          allowed={"vectorbt","freqtrade","jesse","nautilus","forward"}
          assert required and set(required)<=allowed
          if m.get("scope")=="MULTI_SYMBOL_BASKET":
              validation=m.get("validation") or {}
              assert m.get("symbol")=="BASKET"
              assert len(m.get("symbols") or [])>=3
              assert required==["vectorbt","freqtrade","nautilus","forward"]
              assert "jesse" not in required
              assert validation.get("historicalScope")=="MULTI_SYMBOL_POOLED_RESEARCH"
              assert validation.get("forwardScope")=="GLOBAL_SINGLE_POSITION_BASKET"
              assert validation.get("historicalValidators")==["vectorbt","freqtrade","nautilus"]
              assert validation.get("forwardValidators")==["forward"]
          else:
              assert required==["vectorbt","freqtrade","jesse","nautilus","forward"]
          if m.get("candidateFingerprint"):
              for name,path in {
                  "vectorbt":"vectorbt-candidate-latest.json",
                  "freqtrade":"freqtrade-latest.json",
                  "jesse":"jesse-latest.json",
                  "nautilus":"nautilus-latest.json",
                  "forward":"forward-latest.json",
              }.items():
                  row=json.loads((root/path).read_text())
                  if row.get("candidateFingerprint") not in {None,m["candidateFingerprint"]}:
                      print(f"{name}: stale snapshot from prior candidate; gate must reject mismatch")
          gate_code=pathlib.Path("scripts/build_fusion_gate.py").read_text()
          assert "CANDIDATE_ID_MISMATCH" in gate_code
          assert "CANDIDATE_FINGERPRINT_MISMATCH" in gate_code
          assert "MULTI_SYMBOL_POOLED_RESEARCH" in gate_code
          assert "restricted_history" in gate_code
          assert "GLOBAL_SINGLE_POSITION_BASKET:NOT_HISTORICALLY_VALIDATED" in gate_code
          forward_code=pathlib.Path("scripts/forward-paper-public-edges.mjs").read_text()
          assert 'scope==="MULTI_SYMBOL_BASKET"' in forward_code
          assert "opportunities.sort" in forward_code
          assert "ledger.open" in forward_code
          manifest_code=pathlib.Path("scripts/build_candidate_manifest.py").read_text()
          assert '"scope":"MULTI_SYMBOL_BASKET"' in manifest_code
          assert '"validatorsRequired":["vectorbt","freqtrade","nautilus","forward"]' in manifest_code
          print("Unified candidate wiring verified; basket research is explicit and fail-closed.")
          PY
