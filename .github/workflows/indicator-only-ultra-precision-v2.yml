name: Indicator-Only Ultra Precision V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/indicator_only_ultra_precision_v2.py'
      - 'ready_bot/indicator_config.json'
      - '.github/workflows/indicator-only-ultra-precision-v2.yml'

permissions:
  contents: write

concurrency:
  group: indicator-only-ultra-precision-v2
  cancel-in-progress: true

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy pandas
      - run: python -m py_compile research/indicator_only_ultra_precision_v2.py
      - run: PYTHONPATH=. python research/indicator_only_ultra_precision_v2.py
      - name: Verify research-only contract
        run: |
          python - <<'PY'
          import json
          x=json.load(open('validation/indicator-only-ultra-precision-v2-latest.json'))
          assert x['authorization']=='RESEARCH_ONLY'
          assert x['liveTrading'] is False
          assert x['runtimeChanged'] is False
          print(json.dumps({
            'selected':x['selected'],
            'holdout':x['holdout'],
            'claimSupported':x['claimSupported'],
            'diagnosticBest':x['diagnosticBestHoldoutPeekingNotEligible'],
            'diagnosticMaxWin':x['diagnosticMaxWinRateHoldoutPeekingNotEligible'],
            'trainQualifiedConfigs':x['trainQualifiedConfigs'],
            'validationQualifiedConfigs':x['validationQualifiedConfigs'],
            'symbolsWithWindow':{k:len(v) for k,v in x['symbolsWithWindow'].items()}
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: indicator-only-ultra-precision-v2
          path: validation/indicator-only-ultra-precision-v2-latest.json
          retention-days: 14
      - name: Persist snapshot
        run: |
          cp validation/indicator-only-ultra-precision-v2-latest.json /tmp/ultra.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ultra.json validation/indicator-only-ultra-precision-v2-latest.json
            git config user.name 'indicator-ultra-precision-bot'
            git config user.email 'indicator-ultra-precision-bot@users.noreply.github.com'
            git add validation/indicator-only-ultra-precision-v2-latest.json
            git diff --cached --quiet && exit 0
            git commit -m 'Update indicator-only ultra precision V2 snapshot'
            git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
