name: Probe Supabase CI Secrets

on:
  push:
    branches:
      - migration/supabase-free-relay-20260928
    paths:
      - ".github/workflows/probe-supabase-ci-secrets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report secret presence only
        env:
          HAS_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          HAS_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF != '' }}
          HAS_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD != '' }}
        run: |
          echo "SUPABASE_ACCESS_TOKEN_PRESENT=$HAS_ACCESS_TOKEN"
          echo "SUPABASE_PROJECT_REF_PRESENT=$HAS_PROJECT_REF"
          echo "SUPABASE_DB_PASSWORD_PRESENT=$HAS_DB_PASSWORD"
