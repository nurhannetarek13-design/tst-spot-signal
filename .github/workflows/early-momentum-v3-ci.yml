name: Early Momentum V3 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'ready_bot/indicator_bot.py'
      - 'ready_bot/early_momentum.py'
      - 'ready_bot/indicator_config.json'
      - 'scripts/v3_session_performance.py'
      - 'tests/test_binance_spot_point_in_time_universe.py'
      - 'research/binance_spot_point_in_time_universe.py'
      - 'tests/test_backtest_integrity_gate.py'
      - 'research/backtest_integrity_gate.py'
      - 'test/v3-execution-intent.test.mjs'
      - 'src/execution/v3-execution-intent.mjs'
      - 'test/v3-shadow-execution-runtime.test.mjs'
      - 'src/execution/v3-shadow-execution-runtime.mjs'
      - 'test/execution-safety.test.mjs'
      - 'test/stream-shadow.test.mjs'
      - 'tests/test_production_guard.py'
      - 'server.mjs'
      - 'ready_bot/stream_shadow.mjs'
      - 'ready_bot/smart_execution.py'
      - 'ready_bot/production_guard.py'
      - 'ready_bot/market_context.py'
      - 'tests/test_indicator_bot.py'
      - 'tests/test_early_momentum.py'
      - 'tests/test_ready_market_context.py'
      - '.github/workflows/indicator-paper-bot.yml'
      - '.github/workflows/early-momentum-v3-ci.yml'
  push:
    branches: [main, 'feat/**']
    paths:
      - 'ready_bot/indicator_bot.py'
      - 'ready_bot/early_momentum.py'
      - 'ready_bot/indicator_config.json'
      - 'scripts/v3_session_performance.py'
      - 'tests/test_binance_spot_point_in_time_universe.py'
      - 'research/binance_spot_point_in_time_universe.py'
      - 'tests/test_backtest_integrity_gate.py'
      - 'research/backtest_integrity_gate.py'
      - 'test/v3-execution-intent.test.mjs'
      - 'src/execution/v3-execution-intent.mjs'
      - 'test/execution-safety.test.mjs'
      - 'test/stream-shadow.test.mjs'
      - 'tests/test_production_guard.py'
      - 'server.mjs'
      - 'ready_bot/stream_shadow.mjs'
      - 'ready_bot/smart_execution.py'
      - 'ready_bot/production_guard.py'
      - 'ready_bot/market_context.py'
      - 'tests/test_indicator_bot.py'
      - 'tests/test_early_momentum.py'
      - 'tests/test_ready_market_context.py'
      - '.github/workflows/indicator-paper-bot.yml'
      - '.github/workflows/early-momentum-v3-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Compile
        run: |
          python -m py_compile ready_bot/indicator_bot.py
          python -m py_compile ready_bot/early_momentum.py
          python -m py_compile ready_bot/market_context.py
          python -m py_compile ready_bot/production_guard.py
          python -m py_compile ready_bot/smart_execution.py
          python -m py_compile research/backtest_integrity_gate.py
          python -m py_compile research/binance_spot_point_in_time_universe.py
          python -m py_compile scripts/v3_session_performance.py
          node --check ready_bot/stream_shadow.mjs
          node --check server.mjs
          node --check src/execution/v3-execution-intent.mjs
          node --check src/execution/v3-shadow-execution-runtime.mjs
      - name: Unit tests
        run: |
          python -m unittest discover -s tests -p 'test_indicator_bot.py' -v
          python -m unittest discover -s tests -p 'test_early_momentum.py' -v
          python -m unittest discover -s tests -p 'test_ready_market_context.py' -v
          python -m unittest discover -s tests -p 'test_production_guard.py' -v
          python -m unittest -v tests/test_backtest_integrity_gate.py
          python -m unittest -v tests/test_binance_spot_point_in_time_universe.py
          python -m unittest -v tests/test_v3_champion_challenger.py
          node --test test/stream-shadow.test.mjs
          node --test test/execution-safety.test.mjs
          node --test test/v3-execution-intent.test.mjs
          node --test test/v3-shadow-execution-runtime.test.mjs
      - name: Assert staged contract
        run: |
          python - <<'PY'
          import json
          c=json.load(open('ready_bot/indicator_config.json'))
          assert c['market_type']=='spot'
          assert c['engine']=='INDICATOR_ONLY_V3_EARLY_MOMENTUM'
          assert c['momentum']['watch_min']==65
          assert c['momentum']['armed_min']==75
          assert c['momentum']['entry_candidate_min']==85
          assert c['momentum']['obi_armed_min']==0.58
          assert c['risk']['leverage']==1
          assert c['risk']['allow_martingale'] is False
          assert c['risk']['max_pair_correlation']==0.85
          assert c['risk']['consecutive_loss_cooldown_count']==3
          assert c['data_integrity']['fail_closed'] is True
          assert c['production_guard']['max_signal_age_ms']<=12000
          assert c['production_guard']['max_stream_signal_age_ms']<=5000
          assert c['production_guard']['max_decision_latency_ms']<=6500
          assert c['smart_execution']['enabled'] is True
          assert c['security']['live_require_withdrawals_disabled'] is True
          assert c['security']['live_require_futures_disabled'] is True
          assert c['security']['never_log_credentials'] is True
          PY
