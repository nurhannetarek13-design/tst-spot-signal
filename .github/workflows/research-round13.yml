name: Round 13 quality-filtered rotation
on:
  push:
    paths:
      - 'scripts/research-round13.mjs'
      - 'validation/evidence-gate-round13.json'
      - '.github/workflows/research-round13.yml'
  workflow_dispatch:
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check scripts/research-round13.mjs
      - run: node scripts/research-round13.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: round13-discovery
          path: validation/round13-discovery.json
