name: Verify Cloudflare Runtime Only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-cloudflare-runtime.yml"
      - "src/buy-gateway-stable.js"
      - "api/binance-signed-relay.mjs"
      - "src/buy-gateway-time-monitor.js"
      - "src/buy-gateway-auth-wrapper.js"
      - "src/ops-supervisor.js"
      - "src/bridge-auth.js"
      - "src/live-cutover-policy.js"
      - "src/make-live-client.js"
      - "src/live-execution-router.js"
      - "src/supabase-live-client.js"
      - "src/binance-spot-filters.js"
      - "wrangler.jsonc"

permissions:
  contents: read

env:
  WORKER_URL: https://tst-spot-signal.nurhanne-tarek13.workers.dev

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Report Cloudflare legacy credential presence
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20             "$WORKER_URL/infra-credential-presence?nonce=$(date +%s%N)"             -o /tmp/cred.json
          cat /tmp/cred.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/cred.json'))
          assert r.get('ok') is True
          assert r.get('financialAction') is False
          assert r.get('noSecretValuesExposed') is True
          PY
      - name: Probe Binance credential alias pairing
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 30             "$WORKER_URL/cloudflare-binance-pair-preflight?nonce=$(date +%s%N)"             -o /tmp/pair.json
          cat /tmp/pair.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/pair.json'))
          assert r.get('financialAction') is False
          assert r.get('noSecretValuesExposed') is True
          print("PAIR_OK=",r.get('ok'))
          print("PAIR_STATUS=",r.get('status'))
          print("SELECTED_KEY_ALIAS=",r.get('selectedKeyAlias'))
          print("SELECTED_SECRET_ALIAS=",r.get('selectedSecretAlias'))
          print("CAN_TRADE=",r.get('canTrade'))
          PY

      - name: Probe Binance WebSocket API from Cloudflare
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 25 \
            "$WORKER_URL/cloudflare-binance-ws-preflight?nonce=$(date +%s%N)" \
            -o /tmp/ws.json
          cat /tmp/ws.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/ws.json'))
          assert r.get('financialAction') is False
          assert r.get('noSecretValuesExposed') is True
          print("WS_OK=",r.get('ok'))
          print("WS_STATUS=",r.get('status'))
          print("WS_CAN_TRADE=",r.get('canTrade'))
          print("WS_BINANCE_CODE=",r.get('binanceCode'))
          PY

      - name: Report legacy Vercel relay status without requiring it
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 20 \
            "$WORKER_URL/vercel-immutable-relay-preflight?nonce=$(date +%s%N)" \
            -o /tmp/immutable.json || true
          cat /tmp/immutable.json 2>/dev/null || true
          python - <<'PY'
          import json
          try: r=json.load(open('/tmp/immutable.json'))
          except Exception: r={}
          if r:
            assert r.get('financialAction') is False
            assert r.get('noSecretValuesExposed') is True
          print("legacyVercelOk=",r.get('ok'),"status=",r.get('status'))
          PY

      - name: Verify direct Cloudflare Binance read-only access
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 20 \
            "$WORKER_URL/cloudflare-binance-direct-preflight?nonce=$(date +%s%N)" \
            -o /tmp/direct.json
          cat /tmp/direct.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/direct.json'))
          assert r.get('financialAction') is False
          assert r.get('noSecretValuesExposed') is True
          PY

      - name: Verify Supabase public Binance connectivity by region
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          url="https://irinttijrhicxofsdplo.supabase.co/functions/v1/tst-binance-relay?probe=public"
          regions=["eu-west-1","eu-central-1","us-east-1","us-west-2","ap-southeast-1","ap-northeast-1"]
          results=[]
          for region in regions:
              p=subprocess.run(
                  ["curl","--silent","--show-error","--max-time","20","-H",f"x-region: {region}",url],
                  capture_output=True,text=True
              )
              try: row=json.loads(p.stdout or "{}")
              except Exception: row={"ok":False,"status":"BAD_JSON"}
              results.append({
                  "requestedRegion":region,
                  "region":row.get("region"),
                  "ok":row.get("ok") is True,
                  "status":row.get("status"),
                  "upstreamHttpStatus":row.get("upstreamHttpStatus"),
                  "binanceCode":row.get("binanceCode"),
                  "financialAction":row.get("financialAction"),
                  "financialWritesEnabled":row.get("financialWritesEnabled"),
              })
          print(json.dumps({"results":results},separators=(",",":")))
          assert all(x.get("financialAction") is False for x in results)
          assert all(x.get("financialWritesEnabled") is False for x in results)
          preferred={"eu-west-1","eu-central-1","ap-southeast-1","ap-northeast-1"}
          working=[x for x in results if x.get("ok") is True]
          assert working, "No Supabase region can reach Binance public API"
          assert any(x.get("requestedRegion") in preferred for x in working), "No preferred non-US region can reach Binance"
          for x in results:
              if x.get("requestedRegion") in {"us-east-1","us-west-2"} and not x.get("ok"):
                  assert x.get("upstreamHttpStatus") in {451,403}, x
          PY

      - name: Verify Supabase Binance relay read-only access
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 25 \
            "$WORKER_URL/supabase-relay-preflight?nonce=$(date +%s%N)" \
            -o /tmp/supabase-relay.json
          cat /tmp/supabase-relay.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/supabase-relay.json'))
          assert r.get('financialAction') is False
          assert r.get('noSecretValuesExposed') is True
          print("SUPABASE_RELAY_OK=",r.get('ok'))
          print("SUPABASE_RELAY_STATUS=",r.get('status'))
          print("SUPABASE_CAN_TRADE=",r.get('canTrade'))
          PY

      - name: Verify Railway-free live runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20             -H 'cache-control: no-store'             "$WORKER_URL/runtime-check?nonce=$(date +%s%N)" -o /tmp/runtime.json
          cat /tmp/runtime.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/runtime.json'))
          assert r.get('ok') is True
          provider=r.get('executionProvider')
          expected_route={
            'MAKE_V2':'CLOUDFLARE_HMAC_MAKE',
            'SUPABASE_V2':'CLOUDFLARE_SIGNED_SUPABASE_BINANCE',
          }.get(provider)
          assert provider in {'MAKE_V2','SUPABASE_V2'}
          assert r.get('executionRoute') == expected_route
          assert r.get('telegramConfigured') is True
          assert r.get('atomicConfirmClaim') is True
          assert r.get('fastSignalIngest') is True
          assert r.get('oneTapConfirm') is True
          assert r.get('autoBuy') is False
          assert r.get('oldVercelFallback') is False
          assert r.get('noSecretValuesExposed') is True
          PY

      - name: Report live execution readiness without failing runtime health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 25 \
            -H 'cache-control: no-store' \
            "$WORKER_URL/live-readiness?nonce=$(date +%s%N)" -o /tmp/readiness.json
          cat /tmp/readiness.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/readiness.json'))
          assert r.get('ok') is True
          provider=r.get('executionProvider')
          expected_route={
            'MAKE_V2':'CLOUDFLARE_HMAC_MAKE',
            'SUPABASE_V2':'CLOUDFLARE_SIGNED_SUPABASE_BINANCE',
          }.get(provider)
          assert provider in {'MAKE_V2','SUPABASE_V2'}
          assert r.get('executionRoute') == expected_route
          assert r.get('railwayDependency') is False
          assert r.get('telegramConfigured') is True
          assert r.get('userConfirmationRequired') is True
          assert r.get('autoBuy') is False
          assert r.get('liveExecutionEnabled') is False
          assert r.get('e2eArmed') is False
          assert r.get('autonomousExecution') is False
          assert r.get('manualOnly') is True
          assert r.get('executionReady') is False
          assert r.get('status') == 'LIVE_EXECUTION_BLOCKED'
          assert r.get('blocker') in {'EXECUTOR_INCOMPLETE','OPERATIONAL_GO_REQUIRED','LIVE_POLICY_DISABLED'}
          assert r.get('oldVercelFallback') is False
          assert r.get('noBalanceValuesExposed') is True
          assert r.get('noSecretValuesExposed') is True
          print('executionReady=', r.get('executionReady'), 'blocker=', r.get('blocker'))
          PY


      - name: Verify HMAC bridge and operational Go No-Go
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 -X POST \
            -H 'content-type: application/json' \
            --data '{"signal_id":"runtimecheck","symbol":"BTCUSDT"}' \
            "$WORKER_URL/bridge-auth-selftest?nonce=$(date +%s%N)" -o /tmp/bridge.json
          cat /tmp/bridge.json
          curl --fail --silent --show-error --max-time 20 \
            "$WORKER_URL/go-no-go?nonce=$(date +%s%N)" -o /tmp/gate.json
          cat /tmp/gate.json
          python - <<'PY'
          import json
          b=json.load(open('/tmp/bridge.json'))
          g=json.load(open('/tmp/gate.json'))
          assert b.get('ok') is True
          assert b.get('first') == 'BRIDGE_AUTH_OK'
          assert b.get('replay') == 'REPLAY_BLOCKED'
          assert b.get('oldVercelFallback') is False
          assert g.get('ok') is True
          provider=g.get('executionProvider')
          expected_route={
            'MAKE_V2':'CLOUDFLARE_HMAC_MAKE',
            'SUPABASE_V2':'CLOUDFLARE_SIGNED_SUPABASE_BINANCE',
          }.get(provider)
          assert provider in {'MAKE_V2','SUPABASE_V2'}
          assert g.get('executionRoute') == expected_route
          assert g.get('go') is False
          assert g.get('activationAllowed') is False
          assert g.get('e2eArmed') is False
          assert g.get('manualE2EComplete') is False
          assert g.get('manualExecutionAllowed') is False
          assert g.get('liveTrading') is False
          assert g.get('autonomousExecution') is False
          PY

      - name: Verify Telegram webhook ownership
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 -X POST             "$WORKER_URL/telegram-webhook-check?nonce=$(date +%s%N)" -o /tmp/webhook.json
          cat /tmp/webhook.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/webhook.json'))
          assert r.get('ok') is True
          assert r.get('status') == 'TELEGRAM_WEBHOOK_OK'
          assert r.get('urlMatches') is True
          assert r.get('callbackQueryAllowed') is True
          PY

      - name: Verify invalid external ingest cannot bypass ECDSA auth
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ts=$(date +%s%3N)
          body='{"id":"invalid-auth-test","symbol":"BTCUSDT","entry":100,"stop":99,"target":101,"stakeUSDT":5.5,"score":99,"dryRun":true}'
          code=$(curl --silent --show-error --max-time 20 -o /tmp/auth.json -w '%{http_code}'             -X POST "$WORKER_URL/fast-signal-ingest"             -H 'content-type: application/json'             -H "x-fast-timestamp: $ts"             -H 'x-fast-ecdsa: invalid'             --data "$body")
          cat /tmp/auth.json
          test "$code" = "401"
          python - <<'PY'
          import json
          r=json.load(open('/tmp/auth.json'))
          assert r.get('ok') is False
          assert r.get('status') == 'BAD_FAST_INGEST_SIGNATURE'
          assert r.get('autoBuy') is False
          PY

      - name: Verify scanner stays confirmation-only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30             "$WORKER_URL/scanner-status?nonce=$(date +%s%N)" -o /tmp/status.json
          cat /tmp/status.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/status.json'))
          assert r.get('ok') is True
          assert r.get('liveTrading') is False
          assert r.get('executorAllowed') is False
          PY

# diagnostic retrigger 2026-09-28 supabase cutover preflight
