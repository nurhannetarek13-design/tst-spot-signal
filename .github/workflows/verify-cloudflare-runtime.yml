name: Verify Cloudflare Runtime Only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-cloudflare-runtime.yml"
      - "src/buy-gateway-auth-wrapper.js"
      - "wrangler.jsonc"

permissions:
  contents: read

env:
  WORKER_URL: https://tst-spot-signal.nurhanne-tarek13.workers.dev

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify Make production runtime guards
        shell: bash
        run: |
          set -euo pipefail
          passed=0
          for attempt in $(seq 1 12); do
            curl --silent --show-error --max-time 20 \
              -H 'cache-control: no-store, no-cache, max-age=0' \
              "$WORKER_URL/make-runtime-check?verify=${GITHUB_SHA}&attempt=${attempt}&nonce=$(date +%s%N)" \
              -o /tmp/runtime.json || true
            if python - <<'PY'
          import json,sys
          try: row=json.load(open('/tmp/runtime.json'))
          except Exception: sys.exit(1)
          checks=[
              row.get('ok') is True,
              row.get('credentialMode') == 'MAKE_VERIFIED',
              row.get('executionRoute') == 'CLOUDFLARE_SIGNED_RAILWAY_MAKE_BINANCE',
              row.get('twoStepBuyOco') is True,
              row.get('actualFillProtection') is True,
              row.get('atomicConfirmClaim') is True,
              row.get('userConfirmationRequired') is True,
              row.get('autoBuy') is False,
              row.get('telegramConfigured') is True,
              row.get('noSecretValuesExposed') is True,
          ]
          sys.exit(0 if all(checks) else 1)
          PY
            then passed=1; break; fi
            sleep 3
          done
          cat /tmp/runtime.json
          test "$passed" = "1"

      - name: Verify Telegram webhook ownership
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            -X POST -H 'cache-control: no-store' \
            "$WORKER_URL/telegram-webhook-check?verify=${GITHUB_SHA}&nonce=$(date +%s%N)" \
            -o /tmp/webhook.json
          cat /tmp/webhook.json
          python - <<'PY'
          import json
          row=json.load(open('/tmp/webhook.json'))
          assert row.get('ok') is True
          assert row.get('status') == 'TELEGRAM_WEBHOOK_OK'
          assert row.get('urlMatches') is True
          assert row.get('callbackQueryAllowed') is True
          assert row.get('noSecretValuesExposed') is True
          PY

      - name: Verify Fast ingest rejects invalid ECDSA identity
        shell: bash
        run: |
          set -euo pipefail
          ts=$(date +%s%3N)
          body='{"id":"invalid-auth-test","symbol":"BTCUSDT","entry":100,"stop":99,"target":101,"stakeUSDT":5.5,"score":99,"dryRun":true}'
          code=$(curl --silent --show-error --max-time 20 -o /tmp/auth.json -w '%{http_code}' \
            -X POST "$WORKER_URL/fast-signal-ingest" \
            -H 'content-type: application/json' \
            -H "x-fast-timestamp: $ts" \
            -H 'x-fast-ecdsa: invalid' \
            --data "$body")
          cat /tmp/auth.json
          test "$code" = "401"
          python - <<'PY'
          import json
          row=json.load(open('/tmp/auth.json'))
          assert row.get('ok') is False
          assert row.get('status') == 'BAD_FAST_INGEST_SIGNATURE'
          assert row.get('autoBuy') is False
          PY

      - name: Verify scanner cannot auto-execute
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            -X POST -H 'cache-control: no-store' \
            "$WORKER_URL/scanner-status?verify=${GITHUB_SHA}&nonce=$(date +%s%N)" \
            -o /tmp/status.json
          cat /tmp/status.json
          python - <<'PY'
          import json
          row=json.load(open('/tmp/status.json'))
          assert row.get('ok') is True
          assert row.get('liveTrading') is False
          assert row.get('executorAllowed') is False
          PY
