name: Verify Cloudflare Runtime Only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-cloudflare-runtime.yml"

permissions:
  contents: read

env:
  WORKER_URL: https://tst-spot-signal.nurhanne-tarek13.workers.dev

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify Make production runtime guards
        shell: bash
        run: |
          set -euo pipefail
          passed=0
          for attempt in $(seq 1 12); do
            curl --silent --show-error --max-time 20 \
              -H 'cache-control: no-store, no-cache, max-age=0' \
              "$WORKER_URL/make-runtime-check?verify=${GITHUB_SHA}&attempt=${attempt}&nonce=$(date +%s%N)" \
              -o /tmp/runtime.json || true
            cat /tmp/runtime.json 2>/dev/null || true
            echo
            if python - <<'PY'
          import json,sys
          try: row=json.load(open('/tmp/runtime.json'))
          except Exception: sys.exit(1)
          checks=[
              row.get('ok') is True,
              row.get('credentialMode') == 'MAKE_VERIFIED',
              row.get('executionRoute') == 'CLOUDFLARE_SIGNED_RAILWAY_MAKE_BINANCE',
              row.get('twoStepBuyOco') is True,
              row.get('actualFillProtection') is True,
              row.get('atomicConfirmClaim') is True,
              row.get('userConfirmationRequired') is True,
              row.get('autoBuy') is False,
              row.get('telegramConfigured') is True,
              row.get('noSecretValuesExposed') is True,
          ]
          sys.exit(0 if all(checks) else 1)
          PY
            then passed=1; break; fi
            sleep 3
          done
          test "$passed" = "1"

      - name: Verify Telegram webhook ownership
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            -X POST -H 'cache-control: no-store' \
            "$WORKER_URL/telegram-webhook-check?verify=${GITHUB_SHA}&nonce=$(date +%s%N)" \
            -o /tmp/webhook.json
          cat /tmp/webhook.json
          echo
          python - <<'PY'
          import json
          row=json.load(open('/tmp/webhook.json'))
          assert row.get('ok') is True
          assert row.get('status') == 'TELEGRAM_WEBHOOK_OK'
          assert row.get('urlMatches') is True
          assert row.get('callbackQueryAllowed') is True
          assert row.get('noSecretValuesExposed') is True
          PY

      - name: Verify signed Fast ingest dry-run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_BOT_TOKEN:-}"
          python - <<'PY'
          import hashlib,hmac,json,os,time,urllib.request
          ts=str(int(time.time()*1000))
          body=json.dumps({
            'id':'runtime-dryrun-'+ts,
            'symbol':'BTCUSDT','entry':100.0,'stop':99.0,'target':101.0,
            'stakeUSDT':5.5,'strategy':'RUNTIME_DRYRUN','score':99,'dryRun':True,
          },separators=(',',':'))
          sig=hmac.new(os.environ['TELEGRAM_BOT_TOKEN'].encode(),f'{ts}.{body}'.encode(),hashlib.sha256).hexdigest()
          req=urllib.request.Request(
            os.environ['WORKER_URL']+'/fast-signal-ingest',data=body.encode(),method='POST',
            headers={'content-type':'application/json','x-fast-timestamp':ts,'x-fast-signature':sig,'cache-control':'no-store'})
          with urllib.request.urlopen(req,timeout=20) as r:
            out=json.loads(r.read())
          print(json.dumps({k:out.get(k) for k in ['ok','status','canTrade','credentialMode','autoBuy','userConfirmationRequired','recommendedUSDT']},sort_keys=True))
          assert out.get('ok') is True
          assert out.get('status') == 'FAST_SIGNAL_DRYRUN_OK'
          assert out.get('canTrade') is True
          assert out.get('credentialMode') == 'MAKE_VERIFIED'
          assert out.get('autoBuy') is False
          assert out.get('userConfirmationRequired') is True
          PY

      - name: Verify scanner cannot auto-execute
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            -X POST -H 'cache-control: no-store' \
            "$WORKER_URL/scanner-status?verify=${GITHUB_SHA}&nonce=$(date +%s%N)" \
            -o /tmp/status.json
          cat /tmp/status.json
          echo
          python - <<'PY'
          import json
          row=json.load(open('/tmp/status.json'))
          assert row.get('ok') is True
          assert row.get('liveTrading') is False
          assert row.get('executorAllowed') is False
          PY
