name: Derivatives Pressure 48H Validation

on:
  workflow_dispatch:
  push:
    branches: [fix/unified-execution-parity]
    paths:
      - "research/validate_derivatives_pressure_48h.py"
      - ".github/workflows/derivatives-pressure-48h-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run frozen 48h validation
        run: python research/validate_derivatives_pressure_48h.py
      - name: Enforce research-only contract
        run: |
          python - <<'PY'
          import json, pathlib
          r=json.loads(pathlib.Path('validation/edges/derivatives-pressure-48h-validation.json').read_text())
          print(json.dumps(r,indent=2))
          if r.get('liveTrading') is not False: raise SystemExit('liveTrading must remain false')
          if r.get('authorization') != 'RESEARCH_ONLY': raise SystemExit('authorization must remain RESEARCH_ONLY')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: derivatives-pressure-48h-validation
          path: validation/edges/derivatives-pressure-48h-validation.json
          if-no-files-found: error
