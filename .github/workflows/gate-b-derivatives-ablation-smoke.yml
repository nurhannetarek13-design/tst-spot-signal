name: Gate B Derivatives Ablation Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/gate-b-derivatives-ablation-smoke.yml
permissions: {contents: read}
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy pandas pyarrow scikit-learn
      - name: Run 7-day diagnostic ablation
        run: PYTHONPATH=. python research/gate_b_derivatives_ablation_v1.py --days 7 --out validation/edges/gate-b-derivatives-ablation-smoke.json
      - name: Assert research-only diagnostic
        run: |
          python - <<'PY'
          import json
          x=json.load(open('validation/edges/gate-b-derivatives-ablation-smoke.json'))
          assert x['authorization']=='RESEARCH_ONLY' and x['liveTrading'] is False and x['mutatesGateA'] is False
          print(json.dumps({'base':x['base'],'extended':x['extended'],'improvement':x['improvement'],'researchGatePass':x['researchGatePass']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gate-b-derivatives-ablation-smoke
          path: validation/edges/gate-b-derivatives-ablation-smoke.json
          retention-days: 7
