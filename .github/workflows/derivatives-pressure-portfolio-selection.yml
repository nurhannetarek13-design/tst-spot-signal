name: Derivatives Pressure Portfolio Selection

on:
  push:
    branches: [fix/unified-execution-parity]
    paths:
      - 'research/validate_derivatives_pressure_portfolio_selection.py'
      - '.github/workflows/derivatives-pressure-portfolio-selection.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run ranked portfolio selection validation
        run: python research/validate_derivatives_pressure_portfolio_selection.py
      - name: Enforce research-only contract
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('validation/edges/derivatives-pressure-48h-portfolio-selection.json')
          r=json.loads(p.read_text())
          print(json.dumps(r,indent=2))
          if r.get('liveTrading') is not False: raise SystemExit('liveTrading must remain false')
          if r.get('authorization') != 'RESEARCH_ONLY': raise SystemExit('authorization must remain RESEARCH_ONLY')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: derivatives-pressure-portfolio-selection
          path: validation/edges/derivatives-pressure-48h-portfolio-selection.json
          if-no-files-found: error
