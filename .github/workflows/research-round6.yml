name: Round 6 liquid-major dip recovery
on:
  push:
    paths:
      - 'scripts/research-round6.mjs'
      - '.github/workflows/research-round6.yml'
  workflow_dispatch:
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/research-round6.mjs
      - run: node scripts/research-round6.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: round6-discovery
          path: validation/round6-discovery.json
